{# Inline SVG icons, drawn for this site in the Lucide style (24-unit grid, round
   strokes). Inline means no icon font to download and no request that can fail.
   Decorative icons are aria-hidden; the text next to them carries the meaning. #}
{% macro icon(name, size=24, stroke=1.7) %}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ stroke }}" stroke-linecap="round" stroke-linejoin="round">
{% if name == "loom" %}
  {# A plain weave: each thread goes over, then under, the threads it crosses. #}
  <path d="M4 8h6.5M13.5 8H20M4 12h2.5M9.5 12h5M17.5 12H20M4 16h6.5M13.5 16H20"/>
  <path d="M8 4v2.5M8 9.5v5M8 17.5V20M12 4v6.5M12 13.5V20M16 4v2.5M16 9.5v5M16 17.5V20"/>
{% elif name == "badge" %}
  <rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/>
  <path d="M5.8 16.2c.6-1.5 1.8-2.3 3.2-2.3s2.6.8 3.2 2.3M14.5 10h4M14.5 13.5h3"/>
{% elif name == "briefcase" %}
  <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8.5 7V5.2A2.2 2.2 0 0 1 10.7 3h2.6a2.2 2.2 0 0 1 2.2 2.2V7M3 12.5h18M10 12.5v2h4v-2"/>
{% elif name == "flask" %}
  <path d="M9 3h6M10 3v6.2l-5.2 8.9A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.9L14 9.2V3M7.4 15h9.2"/>
{% elif name == "clapper" %}
  <rect x="3" y="9.5" width="18" height="10.5" rx="1.6"/><path d="m3.3 9.5-.8-3.3 15.9-3.7.8 3.3-15.9 3.7ZM7.6 5.4l1.6 2.9M12.2 4.3l1.6 3M16.8 3.3l1.5 3"/>
{% elif name == "play" %}
  <path d="M7 4.5v15l12-7.5-12-7.5Z" fill="currentColor"/>
{% elif name == "info" %}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/>
{% elif name == "code" %}
  <path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/>
{% elif name == "mail" %}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
{% elif name == "file" %}
  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>
{% elif name == "pen" %}
  <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4ZM13.5 6.5l4 4"/>
{% elif name == "link" %}
  <path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>
{% elif name == "arrow-left" %}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
{% elif name == "external" %}
  <path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>
{% elif name == "replay" %}
  <path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5M4 4v4.5h4.5"/>
{% endif %}
</svg>
{% endmacro %}
