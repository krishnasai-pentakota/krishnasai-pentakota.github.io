<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">

<!-- Fonts: Fraunces (headings, numbers) + Outfit (text). If they do not load (weak signal), system fonts are used. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<title>Aditya Traders · Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4332'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%23f3b733'%3EAT%3C/text%3E%3C/svg%3E">
<style>
/* Aditya Traders, version 2: one place for every load.
   Plain HTML/CSS/JS with system fonts, so it is fast on low-end Android over weak signal.
   Brand: teak brown, mango yellow. Red = changed since you last checked. */
:root{--bg:#f3eee4;--card:#fffdf8;--ink:#1c1712;--mut:#6e645a;--line:#e3d7c6;--soft:#f8f3ea;--brand:#1b4332;--brand2:#8a4a12;--act:#b85c14;--mango:#f3b733;--serif:"Fraunces",Georgia,"Times New Roman",serif;--red:#c62828;--redbg:#fdecea;--blue:#1d4ed8;--bluebg:#e8efff;--green:#13804a;--greenbg:#e5f4eb;--amber:#8a5a00;--amberbg:#fff3d6;--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.hidden{display:none!important}
h2{font:600 22px/1.2 var(--serif);letter-spacing:-.01em;margin:4px 0 12px}
h3{font:600 17px/1.25 var(--serif);margin:0 0 10px}
.mut{color:var(--mut)} .small{font-size:14px} .tiny{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* app bar + bottom nav */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));min-height:56px}
.top h1{font:600 19px/1.15 var(--serif);letter-spacing:-.01em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font:600 11px/1.3 "Outfit",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.iconbtn{background:none;border:0;color:inherit;min-width:44px;min-height:44px;border-radius:10px;font-size:22px;cursor:pointer}
.iconbtn:hover{background:rgba(0,0,0,.05)}
.net{background:#7a2e0e;color:#fff;text-align:center;font-size:14px;padding:6px 10px}
main{max-width:860px;margin:0 auto;padding:12px 12px 96px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;color:var(--mut);font-size:12px;font-weight:600;position:relative}
nav.bottom a svg{width:24px;height:24px}
nav.bottom a[aria-current=page]{color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,white);border-radius:12px}
nav.bottom a .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.sect{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sect h3{margin:0;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--act);border-color:var(--act);color:#fff8f1}
.btn.acc{background:var(--brand);border-color:var(--brand);color:#f4f7f4}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:var(--red);border-color:#efb4ae}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tile .n{font:600 28px/1.1 var(--serif)}
.tile .l{font-size:14px;color:var(--mut);margin-top:2px}
.tile.alert{border-color:#f0b9b3;background:#fff8f7}
.tile.alert .n{color:var(--red)}
.tile.money{background:var(--brand);border-color:var(--brand);color:#f4f7f4}.tile.money .l{color:#cfe0d6}.tile.money .n{font-size:21px}
/* chips + pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .c{margin-left:4px;opacity:.7}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:#efe9e2;color:#5b4a3a}
.pill.s-planning{background:#eef0f3;color:#475467}
.pill.s-truck_fixed,.pill.s-going_to_load{background:var(--bluebg);color:var(--blue)}
.pill.s-under_loading{background:var(--amberbg);color:var(--amber)}
.pill.s-loaded,.pill.s-in_transit{background:#efe4ff;color:#5b21b6}
.pill.s-delivered{background:var(--greenbg);color:var(--green)}
.pill.s-cancelled{background:#eee;color:#666}
.pill.b-not_ready{background:#eef0f3;color:#475467}
.pill.b-ready_to_bill{background:var(--amberbg);color:var(--amber)}
.pill.b-billed{background:var(--bluebg);color:var(--blue)}
.pill.b-payment_pending{background:var(--redbg);color:var(--red)}
.pill.b-paid{background:var(--greenbg);color:var(--green)}
.pill.l-planned{background:#eef0f3;color:#475467}
.pill.l-loading{background:var(--amberbg);color:var(--amber)}
.pill.l-done{background:var(--greenbg);color:var(--green)}
.flag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800}
.flag.edited{background:var(--red);color:#fff}
.flag.new{background:var(--bluebg);color:var(--blue)}
/* person avatars: initials in a rounded square (owner forest, accountant sand, staff amber) */
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font:700 12px/1 "Outfit",system-ui,sans-serif;background:#f8e6d2;color:#b85c14;flex:none;vertical-align:middle;margin-right:6px}
.av.owner{background:#1b4332;color:#f4f7f4}.av.accountant{background:#efe6d6;color:#1c1712}
.av.big{width:40px;height:40px;border-radius:12px;font-size:15px;margin:0}
/* load cards */
.loadc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);text-decoration:none}
.loadc.edited{border-left-color:var(--red);background:#fffafa}
.loadc.new{border-left-color:var(--blue)}
.loadc .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.loadc .no{font:600 18px/1.2 var(--serif)}
.loadc .veh{font-weight:700;color:var(--brand2)}
.loadc .t2{margin-top:4px;color:var(--mut);font-size:14.5px}
.loadc .t3{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:14.5px}
.loadc .t4{margin-top:6px;font-size:13px}
.bar{height:8px;border-radius:4px;background:#eee6dc;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--mango);border-radius:4px}
.bar.full>i{background:var(--green)}
.search{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:10px;font-size:16px}
.empty{text-align:center;padding:36px 14px;color:var(--mut)}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.red{background:var(--redbg);color:#7f1d1d;border:1px solid #f3c1bb}
.banner.blue{background:var(--bluebg);color:#1e3a8a;border:1px solid #c7d6fb}
.banner.amber{background:var(--amberbg);color:#5b3d06;border:1px solid #f0dba5}
/* stepper */
.stepper{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.step{flex:1 0 auto;min-width:86px;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.step i{display:block;height:6px;border-radius:3px;background:#e7ded3;margin-bottom:6px}
.step.done i{background:var(--brand2)} .step.cur i{background:var(--mango)} .step.cur{color:var(--ink)}
/* details */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mut);font-size:14.5px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.line{border-top:1px solid var(--line);padding:12px 0}
.line:first-of-type{border-top:0;padding-top:0}
.line .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{margin-top:8px;background:var(--soft);border:1px dashed #e0d3c2;border-radius:10px;padding:8px 10px;font-size:14px}
.tot{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tot.big{font-weight:800;font-size:17px}
/* timeline */
.tl{position:relative;padding-left:16px;border-left:3px solid var(--line);margin:0 0 12px 4px}
.tl.new{border-left-color:var(--red)}
.tl .when{font-size:13px;color:var(--mut)}
.tl .what{margin-top:2px}
.tl .why{margin-top:3px;font-size:14px;color:#5b4a3a;font-style:italic}
.tl.note .what{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-style:normal}
.tl.adm .what::before{content:"Admin only · ";font-weight:700;color:var(--amber)}
/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:600;margin-bottom:4px;font-size:14.5px}
.in{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-size:16px}
textarea.in{min-height:76px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;cursor:pointer;font-size:14.5px}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.req::after{content:" *";color:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.savebar .in2{max-width:860px;margin:0 auto;display:flex;gap:8px}
.savebar .btn{flex:1}
/* sheet (modal) */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(20,12,4,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;background:#1f1a15;color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--red)}
/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file a{display:flex;align-items:center;justify-content:center;height:110px;background:#f1ece6;color:var(--mut);font-weight:800;text-decoration:none}
.file img{width:100%;height:100%;object-fit:cover}
.file .cap{padding:6px 8px;font-size:13px}
/* login */
.login{max-width:420px;margin:7vh auto 0;padding:0 16px}
.brandbox{background:var(--brand);color:#f4f7f4;border-radius:18px;padding:22px 20px;margin-bottom:14px}
.brandbox b{display:block;font:600 28px/1.15 var(--serif);margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td.r,table.t th.r{text-align:right}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px}
@media(max-width:420px){.three{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="demoBar" style="background:#f3b733;color:#2a1b0b;font:600 14px/1.3 system-ui,sans-serif;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <span style="background:#2a1b0b;color:#f3b733;border-radius:6px;padding:2px 7px;font-weight:800">DEMO</span>
  <span style="flex:1;min-width:120px">Sample data · changes stay on this phone</span>
  <label style="display:flex;gap:6px;align-items:center">You are
    <select id="demoWho" aria-label="Switch person" style="min-height:36px;border-radius:8px;border:1px solid #8a5a00;background:#fff;font:inherit;padding:2px 6px">
      <option value="">— choose —</option><option value="owner@adityatraders.demo">Bharat · Owner</option><option value="accounts@adityatraders.demo">Lakshmi · Accountant</option><option value="9848000001">Ravi · Staff</option><option value="9848000002">Suresh · Staff</option><option value="9848000003">Prasad · Staff</option></select></label>
  <a href="guide.html" style="min-height:36px;display:inline-flex;align-items:center;border-radius:8px;border:1px solid #8a5a00;background:#fff;color:#2a1b0b;padding:2px 10px;text-decoration:none">Guide</a>
  <button id="demoReset" style="min-height:36px;border-radius:8px;border:1px solid #8a5a00;background:#fff;font:inherit;padding:2px 10px;cursor:pointer">Reset</button>
</div>
<script>
(function () {
  /* Switch person: forget the current login, then sign in as the chosen sample person. */
  const who = document.getElementById("demoWho");
  const cur = sessionStorage.getItem("demo_as") || "";
  who.value = cur;
  function clearLogin() { Object.keys(localStorage).filter(k => k.startsWith("sb-")).forEach(k => localStorage.removeItem(k)); }
  who.onchange = () => {
    if (!who.value) return;
    sessionStorage.setItem("demo_as", who.value); sessionStorage.setItem("demo_autologin", "1");
    clearLogin(); location.hash = "#/"; location.reload();
  };
  document.getElementById("demoReset").onclick = async () => {
    if (!confirm("Put the sample data back as it was? Your demo changes on this phone will be removed.")) return;
    await window.ADITYA_DEMO.reset(); clearLogin(); sessionStorage.setItem("demo_autologin", cur ? "1" : ""); location.hash = "#/"; location.reload();
  };
  /* Fill and submit the login form automatically after a switch; otherwise show the demo logins. */
  const iv = setInterval(() => {
    const u = document.getElementById("lUser");
    if (!u) return;
    clearInterval(iv);
    const box = document.createElement("div");
    box.className = "card"; box.style.marginTop = "12px";
    box.innerHTML = '<b>Demo logins</b><p class="small mut" style="margin:4px 0 8px">Tap a person to sign in. Password for all: <b></b></p>' +
      [["Bharat · Owner", "owner@adityatraders.demo"], ["Lakshmi · Accountant", "accounts@adityatraders.demo"], ["Ravi · Staff", "9848000001"], ["Suresh · Staff", "9848000002"], ["Prasad · Staff", "9848000003"]].map(p => '<button type="button" class="btn sm" style="margin:0 6px 6px 0" data-l="' + p[1] + '">' + p[0] + '</button>').join("");
    box.querySelector("b + p b").textContent = window.ADITYA_DEMO.password;
    u.closest("form").after(box);
    box.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { sessionStorage.setItem("demo_as", b.dataset.l); who.value = b.dataset.l; go(b.dataset.l); });
    function go(login) { u.value = login; document.getElementById("lPw").value = window.ADITYA_DEMO.password; document.getElementById("lBtn").click(); }
    if (sessionStorage.getItem("demo_autologin") === "1" && cur) { sessionStorage.removeItem("demo_autologin"); go(cur); }
  }, 100);
})();
</script>

/* Truck journey (owner, 25 Nov) and money journey. */
const STAGES = [["planning","Planning"],["truck_fixed","Truck fixed"],["going_to_load","Going to load"],["under_loading","Under loading"],["loaded","Loaded"],["in_transit","In transit"],["delivered","Delivered"]];

function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : ""); t.textContent = msg; t.setAttribute("role", "status");
  $("toastHost").replaceChildren(t);
  setTimeout(() => t.remove(), isErr ? 6500 : 3000);
}
function errText(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || "");
  if (/Failed to fetch|NetworkError|network|timeout/i.test(m)) return "No signal or the server is not reachable. Nothing was lost: try again when you have signal.";
  if (/Invalid login/i.test(m)) return "Wrong phone/email or password.";
  if (/row-level security|permission denied|not allowed/i.test(m)) return "You are not allowed to do this. Ask the owner or accountant.";
  if (/duplicate key/i.test(m)) return "This already exists.";
  return m || "Something went wrong.";
}
async function q(p){ const r = await p; if (r.error) throw r.error; return r.data; }

/* Bottom-sheet form. fields: [{id,label,type,options,value,required,hint,step}] → values object or null. */
function sheet({title, intro = "", fields = [], ok = "Save", danger = null}){
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "sheetbg";
    const field = f => {
      const req = f.required ? " req" : "";
      if (f.type === "select") return `<label class="f"><span class="${req}">${esc(f.label)}</span><select class="in" id="sf_${f.id}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(f.value ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
      if (f.type === "textarea") return `<label class="f"><span class="${req}">${esc(f.label)}</span><textarea class="in" id="sf_${f.id}" placeholder="${esc(f.placeholder || "")}">${esc(f.value ?? "")}</textarea>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
      if (f.type === "check") return `<label class="row" style="margin-bottom:12px"><input type="checkbox" id="sf_${f.id}" ${f.value ? "checked" : ""} style="width:22px;height:22px"> <span>${esc(f.label)}</span></label>`;
      return `<label class="f"><span class="${req}">${esc(f.label)}</span><input class="in" id="sf_${f.id}" type="${f.type || "text"}" ${f.type === "number" ? `inputmode="decimal" step="${f.step || "any"}"` : ""} ${f.list ? `list="sl_${f.id}"` : ""} value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder || "")}" autocomplete="off">${f.list ? `<datalist id="sl_${f.id}">${f.list.map(x => `<option value="${esc(x)}">`).join("")}</datalist>` : ""}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
    };
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${intro ? `<p class="mut small" style="margin-top:-6px">${intro}</p>` : ""}
      <form id="sheetForm" novalidate>${fields.map(field).join("")}<p class="small" id="sheetErr" style="color:var(--red);min-height:1em;margin:0 0 8px"></p>
      <div class="row"><button type="button" class="btn" id="sheetCancel">Cancel</button>${danger ? `<button type="button" class="btn red" id="sheetDanger">${esc(danger)}</button>` : ""}<button class="btn pri grow" id="sheetOk">${esc(ok)}</button></div></form></div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); resolve(v); };
    const first = bg.querySelector("input,select,textarea"); if (first) setTimeout(() => first.focus(), 30);
    bg.addEventListener("click", e => { if (e.target === bg) close(null); });
    $("sheetCancel").onclick = () => close(null);
    if (danger) $("sheetDanger").onclick = () => close({__danger: true});
    $("sheetForm").onsubmit = e => {
      e.preventDefault();
      const out = {};
      for (const f of fields) {
        const el = $("sf_" + f.id);
        out[f.id] = f.type === "check" ? el.checked : el.value.trim();
        if (f.required && !out[f.id]) { $("sheetErr").textContent = "Fill in: " + f.label; el.focus(); return; }
        if (f.type === "number" && out[f.id] !== "" && (isNaN(Number(out[f.id])) || (f.min !== undefined && Number(out[f.id]) < f.min))) { $("sheetErr").textContent = "Check the number in: " + f.label; el.focus(); return; }
      }
      close(out);
    };
  });
}

function chrome(title, {back = false, nav = null, sub = ""} = {}){
  $("title").innerHTML = esc(title) + (sub ? `<span class="sub">${esc(sub)}</span>` : "");
  $("backBtn").classList.toggle("hidden", !back);
  $("refreshBtn").classList.toggle("hidden", !(S.me && S.me.active));
  const showNav = !!(S.me && S.me.active);
  $("nav").classList.toggle("hidden", !showNav);
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
function setNet(){
  const n = $("net");
  if (!navigator.onLine) { n.textContent = "No internet. Showing the last saved data" + (S.loadedAt ? " from " + dShort(S.loadedAt) : "") + "."; n.classList.remove("hidden"); }
  else if (S.offline) { n.textContent = "Could not reach the server. Showing data from " + dShort(S.loadedAt) + "."; n.classList.remove("hidden"); }
  else n.classList.add("hidden");
}
window.addEventListener("online", () => { setNet(); if (S.me && S.me.active) refresh(); });
window.addEventListener("offline", setNet);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me && S.me.active) refresh(true); });

$("refreshBtn").onclick = () => refresh();

async function afterLogin(){
  try { S.me = await q(sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle()); }
  catch(e) {
    const c = lsGet(cacheKey());
    if (c && c.me) { Object.assign(S, {me:c.me, loads:c.loads || [], sawmills:c.sawmills || [], parties:c.parties || [], people:c.people || {}, settings:c.settings || {}, loadedAt:c.at, offline:true}); setNet(); route(); return; }
    $("app").innerHTML = `<div class="empty">${esc(errText(e))}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`; return;
  }
  if (!S.me || !S.me.active) {
    chrome("Aditya Traders");
    $("app").innerHTML = `<div class="card" style="margin-top:20px"><h2>Waiting for approval</h2><p>You are signed in as <b>${esc(phoneOf(S.user.email) || S.user.email)}</b>. The owner or accountant must approve your login first.</p>
      <div class="row"><button class="btn" onclick="location.reload()">Check again</button><button class="btn" id="soBtn">Sign out</button></div></div>`;
    $("soBtn").onclick = () => sb.auth.signOut(); return;
  }
  $("navPartiesLabel").textContent = isAdmin() ? "Parties" : "Mills";
  $("navParties").href = isAdmin() ? "#/parties" : "#/mills";
  await loadMasters();
  route();
}

async function loadMasters(){
  try {
    const [mills, parties, ppl, sets] = await Promise.all([
      q(sb.from("sawmills").select("*").order("name")),
      q(sb.from("parties").select("*").order("name")),
      q(sb.from("profiles").select("id,full_name,email,phone,role,active,created_at").order("created_at")),
      q(sb.from("app_settings").select("*"))
    ]);
    S.sawmills = mills; S.parties = parties; S.people = Object.fromEntries(ppl.map(p => [p.id, p]));
    S.settings = Object.fromEntries(sets.map(s => [s.key, Number(s.value)]));
  } catch(e) { /* keep cached */ }
}
async function loadLoads(silent){
  try {
    S.loads = await q(sb.from("v_loads").select("*").order("load_date", {ascending:false}).order("id", {ascending:false}).limit(500));
    S.loadedAt = new Date().toISOString(); S.offline = false;
    lsSet(cacheKey(), {at:S.loadedAt, me:S.me, loads:S.loads, sawmills:S.sawmills, parties:S.parties, people:S.people, settings:S.settings});
  } catch(e) {
    const c = lsGet(cacheKey()); if (c) { S.loads = c.loads || []; S.loadedAt = c.at; }
    S.offline = true; if (!silent) toast(errText(e), true);
  }
  setNet();
  const dot = $("navDot"), n = S.loads.filter(l => l.my_flag !== "ok").length;
  dot.textContent = n > 99 ? "99+" : n; dot.classList.toggle("hidden", !n);
}
async function refresh(silent){ await loadMasters(); await loadLoads(silent); route(true); }

/* =====================================================================
   Router
   ===================================================================== */
let lastHash = null;
async function route(soft){
  const h = location.hash || "#/"; let m;
  if (soft && /^#\/(new|edit\/)/.test(h)) return;          // never wipe a form being typed
  lastHash = h;
  if (h === "#/") { if (!S.loadedAt || !soft) await loadLoads(true); return renderHome(); }
  if (h === "#/loads") { if (!S.loadedAt || !soft) await loadLoads(true); return renderLoads(); }
  if ((m = h.match(/^#\/load\/(\d+)$/))) return renderLoad(Number(m[1]));
  if (h === "#/new") return renderLoadForm(null);
  if ((m = h.match(/^#\/edit\/(\d+)$/))) return renderLoadForm(Number(m[1]));
  if (h === "#/updates") return renderUpdates();
  if (h === "#/mills") return renderMills();
  if (h === "#/parties") return isAdmin() ? renderParties() : (location.hash = "#/mills");
  if ((m = h.match(/^#\/party\/(buyer|mill|transporter)\/(\d+)$/))) return isAdmin() ? renderParty(m[1], Number(m[2])) : (location.hash = "#/");
  if (h === "#/more") return renderMore();
  if (h === "#/team") return isAdmin() ? renderTeam() : (location.hash = "#/");
  if (h === "#/settings") return isAdmin() ? renderSettings() : (location.hash = "#/");
  if (h === "#/export") return renderExport();
  location.hash = "#/";
}
window.addEventListener("hashchange", () => { if (S.me && S.me.active) route(); });

function renderLoads(){
  chrome("Loads", {nav:"loads"});
  const L = S.loads;
  const filters = [["all","All"],["check","To check"],...STAGES,["cancelled","Cancelled"]];
  if (isAdmin()) filters.push(["ready_to_bill","Ready to bill"],["billed","Billed"],["payment_pending","Payment pending"],["paid","Paid"]);
  const match = (l, f) => f === "all" ? l.truck_stage !== "cancelled" : f === "check" ? l.my_flag !== "ok" : (BILL[f] ? l.bill_stage === f : l.truck_stage === f);
  const qq = S.q.trim().toLowerCase();
  let rows = L.filter(l => match(l, S.filter));
  if (qq) rows = rows.filter(l => [l.load_no, l.vehicle_no, l.driver_name, l.driver_phone, l.party_name, l.party_city, l.destination, l.transporter_name, l.eway_bill_no, l.invoice_no, l.qty_summary].join(" ").toLowerCase().includes(qq));
  let h = `<div class="chips" role="group" aria-label="Filter">${filters.map(([k, n]) => `<button class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${esc(n)}<span class="c">${L.filter(l => match(l, k)).length}</span></button>`).join("")}</div>
    <input class="search" id="search" type="search" placeholder="Search load, truck, driver, buyer, invoice" value="${esc(S.q)}" aria-label="Search">`;
  if (S.filter === "check" && rows.length) h += `<div class="row" style="margin-bottom:10px"><span class="grow small mut">Open each load to see what changed, or</span><button class="btn sm" id="markAll">Mark all ${rows.length} checked</button></div>`;
  h += rows.length ? rows.map(loadCard).join("") : `<div class="empty">${L.length ? "No loads match." : "No loads yet. Tap <b>+ New load</b> to start."}</div>`;
  h += `<a class="btn acc block" href="#/new" style="margin-top:6px">+ New load</a>`;
  $("app").innerHTML = h;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filter = b.dataset.f; renderLoads(); });
  document.querySelectorAll("[data-load]").forEach(b => b.onclick = () => { location.hash = "#/load/" + b.dataset.load; });
  const s = $("search"); s.oninput = () => { S.q = s.value; const p = s.selectionStart; renderLoads(); const s2 = $("search"); s2.focus(); s2.setSelectionRange(p, p); };
  const ma = $("markAll");
  if (ma) ma.onclick = async () => { ma.disabled = true; try { await q(sb.rpc("v2_mark_checked", {p_load_ids: rows.map(l => l.id)})); toast("Marked as checked."); await loadLoads(); renderLoads(); } catch(e) { toast(errText(e), true); ma.disabled = false; } };
}
function loadCard(l){
  const flag = l.my_flag === "edited" ? `<span class="flag edited">Changed</span>` : l.my_flag === "new" ? `<span class="flag new">New</span>` : "";
  const guide = CFT_GUIDE[Number(l.capacity_t)];
  const pct = guide && l.cft_total ? Math.min(100, Math.round(Number(l.cft_total) / guide * 100)) : (l.lines_total ? Math.round(l.lines_done / l.lines_total * 100) : 0);
  return `<button class="loadc ${l.my_flag === "ok" ? "" : l.my_flag}" data-load="${l.id}">
    <div class="t1"><span class="no">${esc(l.load_no)}</span>${l.vehicle_no ? `<span class="veh">${esc(l.vehicle_no)}</span>` : ""}${flag}<span class="grow"></span>${stagePill(l.truck_stage)}${isAdmin() && l.bill_stage && l.bill_stage !== "not_ready" ? billPill(l.bill_stage) : ""}</div>
    <div class="t2">${esc(l.mills_count ? l.mills_count + (l.mills_count > 1 ? " mills" : " mill") : "No mills yet")} → ${esc(l.party_name || "Buyer not set")}${l.destination ? ", " + esc(l.destination) : ""}</div>
    <div class="t3">${l.qty_summary ? `<span class="num">${esc(l.qty_summary)}</span>` : ""}${l.net_weight_t ? `<span class="num">Kata ${esc(Number(l.net_weight_t))} T</span>` : ""}${l.lines_total ? `<span>${l.lines_done}/${l.lines_total} lines done</span>` : ""}${isAdmin() && l.invoice_total != null ? `<span class="num"><b>${inr(l.invoice_total)}</b></span>` : ""}</div>
    ${l.lines_total ? `<div class="bar ${pct >= 100 ? "full" : ""}"><i style="width:${pct}%"></i></div>` : ""}
    <div class="t4 ${l.my_flag === "edited" ? "" : "mut"}" ${l.my_flag === "edited" ? 'style="color:var(--red)"' : ""}>${esc(dExact(l.last_at || l.created_at))} · ${esc(person(l.last_by || l.created_by))}${l.last_reason ? " · " + esc(l.last_reason) : ""}</div>
  </button>`;
}

/* =====================================================================
   One load
   ===================================================================== */
async function renderLoad(id){
  chrome("Load", {back:true, nav:"loads"});
  $("app").innerHTML = `<div class="empty">Loading…</div>`;
  let L, lines, costs, acts, files, bill = null, pays = [];
  try {
    [L, lines, costs, acts, files] = await Promise.all([
      q(sb.from("v_loads").select("*").eq("id", id).maybeSingle()),
      q(sb.from("v_lines").select("*").eq("load_id", id).order("id")),
      q(sb.from("load_costs").select("*").eq("load_id", id).order("id")),
      q(sb.from("activity").select("*").eq("load_id", id).order("at", {ascending:false}).order("id", {ascending:false}).limit(300)),
      q(sb.from("load_files").select("*").eq("load_id", id).order("id"))
    ]);
    if (isAdmin()) [bill, pays] = await Promise.all([
      q(sb.from("load_billing").select("*").eq("load_id", id).maybeSingle()),
      q(sb.from("payments").select("*").eq("load_id", id).order("paid_on").order("id"))

    L = S.loads.find(x => x.id === id);
    if (!L) { $("app").innerHTML = `<div class="empty">${esc(errText(e))}</div>`; return; }

  }

  const since = L.my_reviewed_at;
  const fresh = since ? acts.filter(a => a.at > since && a.actor !== S.user.id) : [];
  const freshIds = new Set(fresh.map(a => a.entity + ":" + a.entity_id));

  if (L.my_flag === "new") h += `<div class="banner blue"><span class="grow">You have not checked this load yet.</span><button class="btn sm" id="chk">Mark checked</button></div>`;

  h += `<div class="card"><div class="sect"><h3>Truck stage</h3>${stagePill(L.truck_stage)}</div>

      ${isAdmin() ? `<div class="price">Purchase: ${ln.rate != null ? `<b class="num">${inr(ln.rate)}</b> per ${esc(ln.unit)}${Number(ln.adjustment) ? ` · adj. ${inr(ln.adjustment)}` : ""} = <b class="num">${inr(ln.amount)}</b>` : `<span class="mut">no rate yet</span>`} <button class="btn sm" data-rate="${ln.id}" style="margin-left:6px">${ln.rate != null ? "Change rate" : "Set rate"}</button></div>` : ""}

  if (isAdmin() && L.purchase_total != null) h += `<div class="tot big"><span>Purchase total</span><span class="num">${inr(L.purchase_total)}</span></div>`;

    ${costs.map(c => `<div class="tot"><span>${esc(c.cost_type)}${c.paid_to ? `<span class="mut small"> · ${esc(c.paid_to)}</span>` : ""}${freshIds.has("load_costs:" + c.id) ? ' <span class="flag edited">Changed</span>' : ""}</span><span class="row"><span class="num">${inr(c.amount)}</span><button class="btn sm" data-cost="${c.id}">Edit</button></span></div>`).join("")}

  // Billing and payments (admins)
  if (isAdmin()) {
    h += `<div class="card"><div class="sect"><h3>Billing</h3>${billPill(L.bill_stage)}<button class="btn sm" id="editBill">${bill ? "Edit bill" : "+ Create bill"}</button></div>`;
    if (bill) h += `<dl class="kv">${r("Invoice", esc((bill.invoice_no || "—") + (bill.invoice_date ? " · " + dDay(bill.invoice_date) : "")))}

      ${r("Invoice total", `<b class="num">${inr(L.invoice_total)}</b>`)}${r("Due date", esc(dDay(L.due_date)))}

    else h += `<p class="mut small">${L.truck_stage === "delivered" ? "Delivered and ready to bill." : "Create the bill when the load is delivered."}</p>`;
    h += `<div class="sect" style="margin-top:12px"><h3>Payments on this load</h3><button class="btn sm" id="addPay">+ Record payment</button></div>

  }

  // Photos
  h += `<div class="card"><div class="sect"><h3>Photos and documents</h3></div>
    ${files.length ? `<div class="files">${files.map(f => `<div class="file"><a id="fl-${f.id}" target="_blank" rel="noopener">${/^image\//.test(f.mime_type || "") ? `<img alt="${esc(f.kind)}" id="fi-${f.id}">` : "PDF"}</a><div class="cap"><b>${esc(f.kind)}</b>${freshIds.has("load_files:" + f.id) ? ' <span class="flag edited">New</span>' : ""}<div class="mut">${esc(dShort(f.created_at))} · ${esc(person(f.created_by))}</div>${isAdmin() ? `<button class="btn sm red" style="margin-top:6px;width:100%" data-delfile="${f.id}">Remove</button>` : ""}</div></div>`).join("")}</div>` : `<p class="mut small">No photos yet. Add the kata slip, e-way bill or receipts.</p>`}
    <div class="row"><select class="in grow" id="fKind" aria-label="Photo type">${FILE_KINDS.map(k => `<option>${esc(k)}</option>`).join("")}</select><label class="btn pri" for="fPick" id="fPickBtn">+ Add photo</label></div>

  h += `<div class="card"><div class="sect"><h3>Updates and history</h3></div>

  h += `<div class="row" style="margin-bottom:12px"><a class="btn wa grow" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText(L, lines))}">Share on WhatsApp</a>${isAdmin() ? `<button class="btn red" id="delLoad">Delete load</button>` : ""}</div>`;
  $("app").innerHTML = h;

  // ---------- actions
  const reload = () => { loadLoads(true); renderLoad(id); };
  const chk = $("chk"); if (chk) chk.onclick = async () => { try { await q(sb.rpc("v2_mark_checked", {p_load_ids:[id]})); toast("Marked as checked."); reload(); } catch(e) { toast(errText(e), true); } };

  const stageRec = (target, v) => { const r = {truck_stage: target, change_reason: v.change_reason}; if (target === "loaded" && v.net_weight_t !== undefined && v.net_weight_t !== "") r.net_weight_t = num(v.net_weight_t); return r; };
  const moveTo = async target => {
    const v = await sheet({title: "Move to " + STAGE[target], intro: `From <b>${esc(STAGE[L.truck_stage])}</b> to <b>${esc(STAGE[target])}</b>.`, fields: target === "loaded" ? [kataField(), reasonField(true)] : [reasonField(true)], ok:"Move"});
    if (!v) return;
    try { await q(sb.from("loads").update(stageRec(target, v)).eq("id", id)); toast("Stage updated."); reload(); }
    catch(e) { toast(errText(e), true); }
  };
  const ns = $("nextStage"); if (ns) ns.onclick = () => moveTo(STAGES[ci + 1][0]);
  $("setStage").onclick = async () => {
    const v = await sheet({title:"Change stage", fields:[{id:"stage", label:"New stage", type:"select", value:L.truck_stage, options:[...STAGES, ["cancelled","Cancelled"]]}, reasonField(true)], ok:"Change"});
    if (!v || v.stage === L.truck_stage) return;
    if (v.stage === "loaded" && !L.net_weight_t) { const w = await sheet({title:"Kata net weight", intro:"Optional: leave empty if the slip is not here yet.", fields:[kataField()], ok:"Continue"}); if (!w) return; v.net_weight_t = w.net_weight_t; }
    try { await q(sb.from("loads").update(stageRec(v.stage, v)).eq("id", id)); toast("Stage updated."); reload(); } catch(e) { toast(errText(e), true); }
  };
  $("addLine").onclick = () => lineForm(L, null, reload);
  document.querySelectorAll("[data-line]").forEach(b => b.onclick = () => lineForm(L, lines.find(x => x.id === Number(b.dataset.line)), reload));
  document.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => {
    const ln = lines.find(x => x.id === Number(b.dataset.done));
    const v = await sheet({title:"Mark " + ln.sawmill_name + " done", fields:[{id:"quantity", label:"Final quantity (" + ln.unit + ")", type:"number", value:ln.quantity ?? "", required:true, min:0}, {id:"loaded_on", label:"Loaded on", type:"date", value:ln.loaded_on || today()}, reasonField(false, "Loading finished at this mill")], ok:"Mark done"});
    if (!v) return;
    try { await q(sb.from("load_lines").update({line_status:"done", quantity:num(v.quantity), loaded_on:v.loaded_on || null, change_reason:v.change_reason || "Loading finished"}).eq("id", ln.id)); toast("Line done."); reload(); } catch(e) { toast(errText(e), true); }
  });
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rateForm(lines.find(x => x.id === Number(b.dataset.rate)), reload));
  $("addCost").onclick = () => costForm(id, null, reload);
  document.querySelectorAll("[data-cost]").forEach(b => b.onclick = () => costForm(id, costs.find(x => x.id === Number(b.dataset.cost)), reload));
  const eb = $("editBill"); if (eb) eb.onclick = () => billForm(L, bill, reload, lines);
  const ap = $("addPay"); if (ap) ap.onclick = () => payForm({load: L, lines}, null, reload);
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => payForm({load: L, lines}, pays.find(x => x.id === Number(b.dataset.pay)), reload));
  if (files.length) showFileLinks(files);
  $("fPick").onchange = async () => {
    const f = $("fPick").files[0]; if (!f) return;
    const btn = $("fPickBtn"); btn.textContent = "Uploading…";
    try { await uploadFile(id, f, $("fKind").value); toast("Photo saved."); reload(); } catch(e) { toast(errText(e), true); btn.textContent = "+ Add photo"; $("fPick").value = ""; }

    const f = files.find(x => x.id === Number(b.dataset.delfile));

  });
  $("noteForm").onsubmit = async e => {
    e.preventDefault(); const t = $("noteText").value.trim(); if (!t) return;

  };
  const dl = $("delLoad");
  if (dl) dl.onclick = async () => {
    if (!confirm("Delete " + L.load_no + " with all its mill lines, costs and bill? The history keeps a record. This cannot be undone.")) return;
    try { await q(sb.from("loads").delete().eq("id", id)); toast("Deleted."); location.hash = "#/loads"; } catch(e) { toast(errText(e), true); }
  };
}

/* One history entry: exact time, who, the load's stage then, what changed, and why. */
function describe(a, lines){
  const ch = a.changes || {};
  const fmt = (k, v) => {
    if (v === null || v === undefined || v === "") return "—";
    if (k === "truck_stage") return STAGE[v] || v;
    if (k === "line_status") return LINE_ST[v] || v;
    if (k === "size_grade") return GRADES[v] || v;
    if (k === "sawmill_id") return millName(v);
    if (k === "party_id" || k === "transporter_id") return partyName(v);
    if (k === "mode") return MODES[v] || v;
    if (/amount|rate|adjustment|gst/.test(k)) return inr(v);
    if (/date|_on$/.test(k)) return dDay(v);
    return String(v);
  };
  const ent = ENTITY[a.entity] || a.entity;
  const lineLabel = () => { const ln = (lines || []).find(x => String(x.id) === String(a.entity_id)); return ln ? " (" + ln.sawmill_name + ")" : ""; };
  if (a.action === "note") return `<b>${esc(person(a.actor))}:</b> ${esc(a.reason)}`;
  if (a.action === "stage") return `Stage: <b>${esc(fmt("truck_stage", ch.truck_stage?.[0]))} → ${esc(fmt("truck_stage", ch.truck_stage?.[1]))}</b>` + Object.entries(ch).filter(([k]) => k !== "truck_stage").map(([k, v]) => `<br>${esc(FIELD[k] || k)}: ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join("");
  if (a.action === "update") return `${esc(ent)}${a.entity === "load_lines" || a.entity === "line_prices" ? esc(lineLabel()) : ""} changed:` + Object.entries(ch).map(([k, v]) => `<br>${esc(FIELD[k] || k)}: ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join("");
  const keyBits = {loads: ["vehicle_no","truck_stage"], load_lines:["sawmill_id","wood_type","quantity","unit"], line_prices:["rate","adjustment"], load_costs:["cost_type","amount"], load_billing:["invoice_no","sale_rate","gst_amount"], payments:["party_kind","amount","mode"], load_files:["kind"]}[a.entity] || [];
  const bits = keyBits.filter(k => ch[k] !== undefined).map(k => k === "unit" ? "" : (k === "quantity" ? fmt(k, ch[k]) + " " + (ch.unit || "") : fmt(k, ch[k]))).filter(Boolean).join(" · ");
  return `${a.action === "insert" ? "Added" : "Removed"} ${esc(ent.toLowerCase())}${a.entity === "line_prices" ? esc(lineLabel()) : ""}${bits ? ": <b>" + esc(bits) + "</b>" : ""}`;
}
function tlItem(a, since, lines){
  const isNew = since && a.at > since && a.actor !== S.user.id;
  return `<div class="tl ${isNew ? "new" : ""} ${a.action === "note" ? "note" : ""} ${a.visibility === "admin" ? "adm" : ""}"><div class="when">${avatar(a.actor)}<b>${esc(dExact(a.at))}</b> · ${esc(person(a.actor))} · ${stagePill(a.truck_stage)}</div>
    <div class="what">${describe(a, lines)}</div>${a.reason && a.action !== "note" ? `<div class="why">Reason: ${esc(a.reason)}</div>` : ""}</div>`;
}
function feedItem(a, compact){
  const L = S.loads.find(x => x.id === a.load_id);

    {id:"length_ft", label:"Length (ft), for size grade", type:"number", value:ln?.length_ft ?? "", min:0, hint:`Small < ${S.settings.size_small_below_ft ?? 4} ft · Medium ${S.settings.size_small_below_ft ?? 4}–${S.settings.size_large_above_ft ?? 6} ft · Large > ${S.settings.size_large_above_ft ?? 6} ft (provisional)`},

    reasonField(!!ln, ln ? "" : "Mill added to the load")

/* Payment in (buyer) or out (mill / transporter). ctx: {load, lines} or {kind, partyId, sawmillId} */
async function payForm(ctx, p, done){
  const L = ctx.load;
  const opts = [];
  if (L) {
    if (L.party_id) opts.push(["buyer:" + L.party_id, "Received from buyer: " + partyName(L.party_id)]);
    [...new Set((ctx.lines || []).map(x => x.sawmill_id))].forEach(m => opts.push(["mill:" + m, "Paid to mill: " + millName(m)]));
    if (L.transporter_id) opts.push(["transporter:" + L.transporter_id, "Paid to transporter: " + partyName(L.transporter_id)]);
  } else {
    opts.push([ctx.kind + ":" + (ctx.sawmillId || ctx.partyId), (ctx.kind === "buyer" ? "Received from " : "Paid to ") + (ctx.kind === "mill" ? millName(ctx.sawmillId) : partyName(ctx.partyId))]);
  }
  if (!opts.length) return toast("Add the buyer, mills or transporter first.", true);
  const cur = p ? p.party_kind + ":" + (p.sawmill_id || p.party_id) : opts[0][0];
  const v = await sheet({title: p ? "Edit payment" : "Record payment", fields:[
    {id:"who", label:"Payment", type:"select", options:opts, value:cur},
    {id:"amount", label:"Amount (₹)", type:"number", value:p?.amount ?? "", required:true, min:0.01},
    {id:"paid_on", label:"Date", type:"date", value:p?.paid_on ?? today(), required:true},
    {id:"mode", label:"Mode", type:"select", options:Object.entries(MODES), value:p?.mode ?? "bank"},
    {id:"reference", label:"Reference (UTR / cheque no)", type:"text", value:p?.reference ?? ""},
    {id:"note", label:"Note", type:"text", value:p?.note ?? ""},
    reasonField(!!p, p ? "" : "Payment recorded")], ok:"Save", danger: p ? "Remove" : null});
  if (!v) return;
  try {
    if (v.__danger) { if (!confirm("Remove this payment?")) return; await q(sb.from("payments").delete().eq("id", p.id)); toast("Removed."); return done(); }
    const [kind, idv] = v.who.split(":");
    const rec = {party_kind:kind, party_id: kind === "mill" ? null : Number(idv), sawmill_id: kind === "mill" ? Number(idv) : null, amount:num(v.amount), paid_on:v.paid_on, mode:v.mode, reference:v.reference || null, note:v.note || null, change_reason:v.change_reason || null};
    if (p) await q(sb.from("payments").update(rec).eq("id", p.id)); else await q(sb.from("payments").insert({...rec, load_id: L ? L.id : null}));
    toast("Payment saved."); done();
  } catch(e) { toast(errText(e), true); }
}

/* ---------- photos ---------- */
async function showFileLinks(files){
  if (CFG.fileUrl) {   // demo page only: photos live in the browser
    for (const f of files) { const url = await CFG.fileUrl(f.storage_path); const a = $("fl-" + f.id), i = $("fi-" + f.id); if (a) a.href = url; if (i) i.src = url; }
    return;
  }
  try {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(files.map(f => f.storage_path), 3600);
    if (error) throw error;
    for (const f of files) { const hit = data.find(d => d.path === f.storage_path); if (!hit || !hit.signedUrl) continue; const a = $("fl-" + f.id), i = $("fi-" + f.id); if (a) a.href = hit.signedUrl; if (i) i.src = hit.signedUrl; }
  } catch(e) {}
}
async function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", {type:"image/jpeg"}) : file;
  } catch(e) { return file; }
}
async function uploadFile(loadId, original, kind){
  const file = await shrink(original);
  if (file.size > 10 * 1024 * 1024) throw new Error("File is bigger than 10 MB.");
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, file.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
  const path = `v2/${loadId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const up = await sb.storage.from(BUCKET).upload(path, file, {contentType:file.type || undefined, upsert:false});
  if (up.error) throw up.error;
  try { await q(sb.from("load_files").insert({load_id:loadId, kind, storage_path:path, file_name:original.name, mime_type:file.type || null, size_bytes:file.size})); }
  catch(e) { await sb.storage.from(BUCKET).remove([path]); throw e; }
}

function locText(L){
  return `Namaskaram ${L.driver_name || ""}, Aditya Traders here. Please share your live location on WhatsApp for truck ${L.vehicle_no || ""} (${L.load_no})${L.destination ? " going to " + L.destination : ""}. Thank you.`.replace(/\s+/g, " ");
}
function waText(L, lines){
  const out = [`*Aditya Traders · ${L.load_no}*`, `Stage: ${STAGE[L.truck_stage]}`];
  if (L.vehicle_no) out.push(`Truck: ${L.vehicle_no}${L.capacity_t ? " (" + Number(L.capacity_t) + " T)" : ""}`);
  if (L.driver_name || L.driver_phone) out.push(`Driver: ${[L.driver_name, L.driver_phone].filter(Boolean).join(", ")}`);
  if (L.party_name) out.push(`Buyer: ${L.party_name}${L.destination ? ", " + L.destination : ""}`);
  (lines || []).forEach(ln => out.push(`• ${ln.sawmill_name}: ${ln.wood_type} ${qty(ln.quantity, ln.unit)} (${LINE_ST[ln.line_status]})`));
  if (L.net_weight_t) out.push(`Kata net weight: ${Number(L.net_weight_t)} T`);
  if (L.eway_bill_no) out.push(`E-way bill: ${L.eway_bill_no}`);
  out.push(`Updated: ${dExact(L.last_at || L.created_at)}`);
  return out.join("\n");
}

      XLSX.writeFile(wb, `Aditya_Traders_${from}_to_${to}.xlsx`);
      $("xMsg").textContent = `Downloaded: ${s1.length} loads, ${s2.length} mill lines, ${s4.length} history rows.`;
    } catch(e) { toast(errText(e), true); }
    b.disabled = false; b.textContent = "Download Excel";
  };
}
function loadScript(src){ return new Promise((ok, bad) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Failed to fetch the Excel tool")); document.head.appendChild(s); }); }

sb.auth.onAuthStateChange((event, session) => {
  const u = session ? session.user : null;
  if (event === "TOKEN_REFRESHED") { S.user = u; return; }
  if (u && S.user && u.id === S.user.id && S.me) return;
  S.user = u; S.me = null; S.loadedAt = null;
  setTimeout(() => { if (u) afterLogin(); else showLogin(); }, 0);   // outside the auth callback (supabase-js deadlock)
});
}
