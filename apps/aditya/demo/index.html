<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3315">
<title>Aditya Traders (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%235b3315'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='18' text-anchor='middle' fill='%23f3b733'%3EAT%3C/text%3E%3C/svg%3E">
<style>
/* Aditya Traders trips app, version 1.
   Plain HTML/CSS/JS, system fonts only: loads fast on low-end Android over weak signal.
   Colours: teak brown band, mango yellow accent, red = "edited since you checked". */
:root{--bg:#f6f2ec;--card:#fff;--ink:#22170f;--mut:#6e5d4f;--line:#e5dbcf;--wood:#5b3315;--wood2:#7a4a24;--mango:#f3b733;--red:#c62828;--redbg:#fdecea;--blue:#1d4ed8;--bluebg:#e8efff;--green:#12864a;--greenbg:#e6f4ec}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--wood2)}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--wood);color:#fbf3e9;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .back{background:none;border:0;color:inherit;font-size:24px;min-width:44px;min-height:44px;cursor:pointer;padding:0}
.top .menu{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:8px;min-height:40px;padding:6px 12px;font-weight:600;cursor:pointer}
.net{background:#7a2e0e;color:#fff;text-align:center;font-size:14px;padding:6px 10px}
main{max-width:760px;margin:0 auto;padding:12px 12px 110px}
/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--wood);border-color:var(--wood);color:#fff}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:var(--red);border-color:#efb4ae}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.mut{color:var(--mut)}
.small{font-size:14px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:17px;margin:0 0 8px}
/* list */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--wood);border-color:var(--wood);color:#fff}
.chip .n{display:inline-block;min-width:22px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:13px}
.search{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;font-size:16px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alert.red{background:var(--redbg);color:#7f1d1d;border:1px solid #f3c1bb}
.alert.info{background:#fff6dc;color:#5b4106;border:1px solid #f0dfaa}
.day{font-size:14px;font-weight:700;color:var(--mut);margin:14px 2px 6px}
.trip{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.trip.edited{border-left-color:var(--red);background:#fffafa}
.trip.new{border-left-color:var(--blue)}
.trip .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.veh{font-size:18px;font-weight:800;letter-spacing:.02em}
.trip .l2{margin-top:4px;color:var(--mut);font-size:15px}
.trip .l3{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:15px}
.money{font-weight:700;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;white-space:nowrap}
.b-edited{background:var(--red);color:#fff}
.b-new{background:var(--bluebg);color:var(--blue)}
.st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;margin-left:auto}
.st-order_taken{background:#f1ece6;color:#5b4a3a}
.st-on_the_way{background:#fff1cc;color:#7a5200}
.st-completed{background:var(--greenbg);color:var(--green)}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;min-height:56px;padding:0 22px;border-radius:999px;border:0;background:var(--mango);color:#2a1b0b;font-weight:800;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:600;margin-bottom:4px}
.in{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea.in{min-height:80px}
.in:focus,.chip:focus-visible,.btn:focus-visible,.seg button:focus-visible,.trip:focus-visible{outline:3px solid var(--mango);outline-offset:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;min-height:48px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--wood);border-color:var(--wood);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;gap:8px}
.pick select{flex:1}
.addbox{background:#faf6f1;border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.savebar .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
.savebar .btn{flex:1}
/* detail */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mut)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.kv dd.chg{color:var(--red)}
.was{display:block;font-weight:400;font-size:14px;color:var(--red)}
.tot{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.tot.big{font-size:18px;font-weight:800}
.cost{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.cost .grow{min-width:0}
.cost.chg .money{color:var(--red)}
.hist{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:0 0 10px}
.hist.new{border-left-color:var(--red)}
.hist .when{font-size:14px;color:var(--mut)}
/* photos and files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.file.chg{border:2px solid var(--red)}
.file .thumb{display:flex;align-items:center;justify-content:center;height:120px;background:#f1ece6;color:var(--mut);font-weight:800;text-decoration:none}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file .cap{padding:6px 8px}
.upl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
/* people */
.person{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
/* login */
.login{max-width:420px;margin:8vh auto 0;padding:0 16px}
.brand{background:var(--wood);color:#fbf3e9;border-radius:16px;padding:22px 20px;margin-bottom:16px}
.brand b{display:block;font-size:26px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:#22170f;color:#fff;padding:12px 16px;border-radius:10px;max-width:92vw;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast.err{background:var(--red)}
.menuSheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:flex-end;padding:60px 10px 0}
.menuSheet .box{background:#fff;border-radius:12px;min-width:230px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menuSheet button{display:block;width:100%;text-align:left;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;min-height:48px}
.menuSheet .who{padding:12px 16px;background:#faf6f1;font-size:14px;color:var(--mut);border-bottom:1px solid var(--line)}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:20px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top" id="top">
  <button class="back hidden" id="backBtn" aria-label="Back">&#8592;</button>
  <h1 id="title">Aditya Traders</h1>
  <button class="menu hidden" id="menuBtn">Menu</button>
</div>
<div class="net hidden" id="net"></div>
<div id="demoBar" style="background:#f3b733;color:#2a1b0b;font-size:14px;padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:160px"><b>Demo</b> with sample data. Changes stay on this phone only.</span><button id="demoSwitch" style="min-height:36px;border:1px solid #2a1b0b;background:#fff;border-radius:8px;padding:4px 10px;font-weight:700">Switch person</button><button id="demoReset" style="min-height:36px;border:1px solid #2a1b0b;background:transparent;border-radius:8px;padding:4px 10px;font-weight:700">Reset</button></div>
<main id="app"><div class="empty">Loading…</div></main>
<button class="fab hidden" id="fab">+ New lorry</button>
<div id="toastHost"></div>

<script>
// =====================================================================
// DEMO ONLY. Stands in for Supabase so the app can be tried without a
// login. Sample data lives in this phone's browser (localStorage) and
// copies the real database's rules: history, red "Edited" flags, totals.
// Nothing here talks to the real Aditya Traders database.
// =====================================================================
(function(){
  const KEY = "aditya_demo_v1";
  const USERS = {
    "owner@demo":      {id:"d-owner", email:"owner@demo"},
    "accountant@demo": {id:"d-acc",   email:"accountant@demo"},
    "staff@demo":      {id:"d-staff", email:"staff@demo"}
  };
  const META = ["id","created_at","created_by","updated_at","updated_by","last_change_at","last_change_by"];
  const CMETA = ["id","trip_id","created_at","created_by","updated_at","updated_by"];
  let st, session = null, seeding = false;
  const cbs = [];

  // ---------- time: seeded steps go back in time, live actions use the clock
  function now(){
    if (seeding) { st.clock += 7 * 60000; return new Date(st.clock).toISOString(); }
    st.clock = Math.max(st.clock + 1000, Date.now());
    return new Date(st.clock).toISOString();
  }
  const uid = () => session ? session.user.id : null;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
  const diff = (o, n, skip) => { const d = {}; for (const k in n) if (!skip.includes(k) && JSON.stringify(o[k]) !== JSON.stringify(n[k])) d[k] = [o[k], n[k]]; return d; };
  const strip = (r, skip) => { const c = {...r}; skip.forEach(k => delete c[k]); return c; };
  const statusOf = (trip_id, changes) => { const tr = st.DB.trips.find(x => x.id === trip_id); return tr ? tr.status : (changes && typeof changes.status === "string" ? changes.status : null); };
  const log = (trip_id, table_name, record_id, action, changes) => st.DB.change_log.push({id:++st.seq.change_log, trip_id, table_name, record_id, action, changes, changed_by:uid(), changed_at:now(), trip_status:statusOf(trip_id, changes)});
  const touch = t => { const DB = st.DB; if (!DB.trips.some(x => x.id === t)) return; const r = DB.trip_reviews.find(x => x.trip_id === t && x.user_id === uid()); const ts = now(); if (r) r.reviewed_at = ts; else DB.trip_reviews.push({trip_id:t, user_id:uid(), reviewed_at:ts}); };
  const bump = t => { const tr = st.DB.trips.find(x => x.id === t); if (tr) { tr.last_change_at = now(); tr.last_change_by = uid(); } touch(t); };

  const seesPrices = () => { const m = st.DB.profiles.find(p => p.id === uid()); return !!(m && m.active && (m.role === "owner" || m.role === "accountant")); };
  const eff = t => { const pr = seesPrices() ? (st.DB.trip_prices || []).find(x => x.trip_id === t.id) : null; return pr && pr.updated_at > t.last_change_at ? {at: pr.updated_at, by: pr.updated_by} : {at: t.last_change_at, by: t.last_change_by}; };
  function vtrips(){
    const DB = st.DB;
    return DB.trips.map(t => {
      const s = DB.sawmills.find(x => x.id === t.sawmill_id), p = DB.parties.find(x => x.id === t.party_id);
      const ch = DB.trip_charges.filter(c => c.trip_id === t.id).reduce((a, c) => a + Number(c.amount), 0);
      const r = DB.trip_reviews.find(x => x.trip_id === t.id && x.user_id === uid());
      return {...t, sawmill_name:s?.name ?? null, sawmill_place:s?.place ?? null, party_name:p?.name ?? null, party_city:p?.city ?? null,
        charges_total:ch, total_cost:Number(t.freight_amount || 0) + ch, my_reviewed_at:r ? r.reviewed_at : null,
        my_flag: !r ? "new" : (eff(t).at > r.reviewed_at ? "edited" : "ok"), my_change_at: eff(t).at, my_change_by: eff(t).by,
        change_count: DB.change_log.filter(l => l.trip_id === t.id && !(l.table_name === "trips" && l.action === "insert")).length};
    });
  }

  // ---------- a tiny query builder with the same calls the app uses
  function Q(table){ this.t = table; this.f = []; this.op = "select"; this.ord = []; this.lim = null; this.one = null; }
  Q.prototype.select = function(){ return this; };
  Q.prototype.eq = function(k, v){ this.f.push(r => r[k] === v); return this; };
  Q.prototype.in = function(k, v){ this.f.push(r => v.includes(r[k])); return this; };
  Q.prototype.gte = function(k, v){ this.f.push(r => r[k] >= v); return this; };
  Q.prototype.lte = function(k, v){ this.f.push(r => r[k] <= v); return this; };
  Q.prototype.order = function(k, o){ this.ord.push([k, !o || o.ascending !== false]); return this; };
  Q.prototype.limit = function(n){ this.lim = n; return this; };
  Q.prototype.single = function(){ this.one = "single"; return this; };
  Q.prototype.maybeSingle = function(){ this.one = "maybe"; return this; };
  Q.prototype.insert = function(o){ this.op = "insert"; this.val = o; return this; };
  Q.prototype.update = function(o){ this.op = "update"; this.val = o; return this; };
  Q.prototype.delete = function(){ this.op = "delete"; return this; };
  Q.prototype.upsert = function(o){ this.op = "upsert"; this.val = o; return this; };
  Q.prototype.then = function(res, rej){ return Promise.resolve().then(() => { const r = this.run(); if (!seeding) save(); return r; }).then(res, rej); };
  Q.prototype.run = function(){
    const DB = st.DB, t = this.t;
    const me = DB.profiles.find(p => p.id === uid());
    const member = me && me.active;
    if (t !== "profiles" && !member) return {data: this.op === "select" ? [] : null, error: this.op === "select" ? null : {message:"row-level security"}};
    // Owner's answer E5: the accountant may not change costs (same rule as the real database).
    if (me && me.role === "accountant" && this.op !== "select" && (t === "trip_charges" || (t === "trips" && this.op === "update" && this.val && "freight_amount" in this.val)))
      return {data:null, error:{message:"The accountant cannot change costs."}};
    // Purchase/sale prices: owner and accountant read, owner writes (same as the real database)
    if (t === "price_log" && !(me && (me.role === "owner" || me.role === "accountant"))) return {data: this.one ? null : [], error: null};
    if (t === "trip_prices") {
      if (!(me && (me.role === "owner" || (me.role === "accountant" && this.op === "select")))) return {data: this.op === "select" ? (this.one ? null : []) : null, error: this.op === "select" ? null : {message:"row-level security"}};
      if (this.op === "upsert") {
        const ex = DB.trip_prices.find(x => x.trip_id === this.val.trip_id), before = ex ? {...ex} : {}, ts = now();
        const row = ex || {}; Object.assign(row, this.val, {updated_at: ts, updated_by: uid()}); if (!ex) DB.trip_prices.push(row);
        const d = {}; for (const k in this.val) if (k !== "trip_id" && JSON.stringify(before[k] ?? null) !== JSON.stringify(this.val[k] ?? null)) d[k] = [before[k] ?? null, this.val[k]];
        if (Object.keys(d).length) { DB.price_log.push({id: DB.price_log.length + 1, trip_id: row.trip_id, action: ex ? "update" : "insert", changes: d, changed_by: uid(), changed_at: ts, trip_status: statusOf(row.trip_id)}); touch(row.trip_id); }
        return {data:null, error:null};
      }
    }
    if (this.op === "select") {
      let rows = t === "v_trips" ? vtrips() : DB[t].slice();
      if (t === "trip_reviews") rows = rows.filter(r => r.user_id === uid());
      rows = rows.filter(r => this.f.every(f => f(r)));
      for (const [k, asc] of this.ord.slice().reverse()) rows.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * (asc ? 1 : -1));
      if (this.lim) rows = rows.slice(0, this.lim);
      rows = JSON.parse(JSON.stringify(rows));
      if (this.one) return {data: rows[0] || null, error: (!rows[0] && this.one === "single") ? {message:"not found"} : null};
      return {data: rows, error: null};
    }
    if (this.op === "insert") {
      const ts = now();
      const r = {...this.val, id: ++st.seq[t], created_at: ts, created_by: uid()};
      if (t === "trips") { r.updated_at = ts; r.last_change_at = ts; r.last_change_by = uid(); r.status = r.status || "order_taken"; r.trip_date = r.trip_date || ts.slice(0, 10); DB.trips.push(r); log(r.id, "trips", r.id, "insert", strip(r, META)); touch(r.id); }
      else if (t === "trip_charges") { r.amount = Number(r.amount); DB.trip_charges.push(r); log(r.trip_id, "trip_charges", r.id, "insert", strip(r, CMETA)); bump(r.trip_id); }
      else if (t === "trip_files") { DB.trip_files.push(r); log(r.trip_id, "trip_files", r.id, "insert", {kind:r.kind, file_name:r.file_name}); bump(r.trip_id); }
      else DB[t].push(r);
      return {data: this.one ? {...r} : [r], error: null};
    }
    if (this.op === "update") {
      if (t === "profiles" && !(me && me.role === "owner")) return {data: null, error: null};
      for (const r of DB[t].filter(r => this.f.every(f => f(r)))) {
        const before = {...r};
        Object.assign(r, this.val);
        if (t === "trips") { const d = diff(before, r, META); if (Object.keys(d).length) { r.updated_at = r.last_change_at = now(); r.updated_by = r.last_change_by = uid(); log(r.id, "trips", r.id, "update", d); touch(r.id); } }
        if (t === "trip_charges") { const d = diff(before, r, CMETA); if (Object.keys(d).length) { r.updated_at = now(); r.updated_by = uid(); log(r.trip_id, "trip_charges", r.id, "update", d); bump(r.trip_id); } }
      }
      return {data: null, error: null};
    }
    if (this.op === "delete") {
      if ((t === "trips" || t === "sawmills" || t === "parties") && me.role !== "owner") return {data: null, error: null};
      const keep = [], gone = [];
      DB[t].forEach(r => (this.f.every(f => f(r)) ? gone : keep).push(r));
      DB[t] = keep;
      for (const r of gone) {
        if (t === "trips") { log(r.id, "trips", r.id, "delete", strip(r, META)); DB.trip_charges = DB.trip_charges.filter(c => c.trip_id !== r.id); DB.trip_reviews = DB.trip_reviews.filter(x => x.trip_id !== r.id); DB.trip_files = (DB.trip_files || []).filter(x => x.trip_id !== r.id); }
        if (t === "trip_charges") { log(r.trip_id, "trip_charges", r.id, "delete", strip(r, CMETA)); bump(r.trip_id); }
        if (t === "trip_files") { log(r.trip_id, "trip_files", r.id, "delete", {kind:r.kind}); bump(r.trip_id); }
      }
      return {data: null, error: null};
    }
  };

  function markChecked(ids){ ids.forEach(touch); }

  // ---------- sample data (clearly marked "sample")
  function istDate(daysAgo){ return new Date(Date.now() - daysAgo * 864e5).toLocaleDateString("en-CA", {timeZone:"Asia/Kolkata"}); }
  function as(email){ session = {user: USERS[email]}; }
  function at(daysAgo){ st.clock = Date.now() - daysAgo * 864e5; }
  function run(q){ seeding = true; const r = q.run(); return r.data; }
  function seed(){
    st = {clock: Date.now() - 3 * 864e5, seq:{sawmills:0, parties:0, trips:0, trip_charges:0, change_log:0, trip_files:0},
      DB:{profiles:[

/* ---------- app state ---------- */

/* ---------- small helpers ---------- */

/* Owner's answer E5 (24 Nov): the accountant may not change costs. The database enforces this too. */
const canCost = () => !!S.me && S.me.role !== "accountant";
const cacheKey = () => "at_trips_" + (S.user ? S.user.id : "x");
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } }
function lsSet(k, v){ try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

function toast(msg, isErr){
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  $("toastHost").replaceChildren(t);
  setTimeout(() => { if (t.parentNode) t.remove(); }, isErr ? 6000 : 3000);
}
/* Turn Supabase / network errors into plain words. */
function errText(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || "");
  if (/fetch|network|Failed to fetch|NetworkError|timeout/i.test(m)) return "No signal or server not reachable. Your entry is kept — tap Save again when you have signal.";
  if (/Invalid login/i.test(m)) return "Wrong email or password.";
  if (/row-level security|permission|not allowed/i.test(m)) return "You are not allowed to do this. Ask the owner.";
  return m || "Something went wrong.";
}
async function q(promise){ const r = await promise; if (r.error) throw r.error; return r.data; }

/* ---------- screen chrome ---------- */
function chrome(title, {back=false, fab=false, menu=true} = {}){
  $("title").textContent = title;
  $("backBtn").classList.toggle("hidden", !back);

  $("fab").classList.toggle("hidden", !fab);
  window.scrollTo(0, 0);
}
function setNet(){
  const n = $("net");
  if (!navigator.onLine) { n.textContent = "No internet. Showing the last saved list" + (S.loadedAt ? " from " + dTime(S.loadedAt) : "") + "."; n.classList.remove("hidden"); }
  else if (S.offline) { n.textContent = "Could not reach the server. Showing the list from " + dTime(S.loadedAt) + "."; n.classList.remove("hidden"); }
  else n.classList.add("hidden");
}

window.addEventListener("offline", setNet);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me && S.me.active && (location.hash || "#/") === "#/") loadList(true); });

async function afterLogin(){
  try {
    const me = await q(sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle());
    S.me = me;
  } catch(e) {
    // Offline at startup: fall back to the last cached profile + list.
    const c = lsGet(cacheKey());
    if (c && c.me) { S.me = c.me; S.trips = c.trips || []; S.sawmills = c.sawmills || []; S.parties = c.parties || []; S.people = c.people || {}; S.loadedAt = c.at; S.offline = true; setNet(); route(); return; }
    $("app").innerHTML = `<div class="empty">${esc(errText(e))}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`;

  }

async function loadMasters(){
  try {
    const [saws, parts, ppl] = await Promise.all([
      q(sb.from("sawmills").select("id,name,place,phone").order("name")),
      q(sb.from("parties").select("id,name,city,phone").order("name")),
      q(sb.from("profiles").select("id,full_name,email,role,active,created_at").order("created_at"))
    ]);
    S.sawmills = saws; S.parties = parts;
    S.people = Object.fromEntries(ppl.map(p => [p.id, p]));
  } catch(e) { /* keep whatever we had; list screen shows the network banner */ }
}

async function loadList(silent){
  try {
    S.trips = await q(sb.from("v_trips").select("*").order("trip_date", {ascending:false}).order("id", {ascending:false}).limit(400));
    S.loadedAt = new Date().toISOString(); S.offline = false;
    lsSet(cacheKey(), {at:S.loadedAt, me:S.me, trips:S.trips, sawmills:S.sawmills, parties:S.parties, people:S.people});
  } catch(e) {
    const c = lsGet(cacheKey());
    if (c) { S.trips = c.trips || []; S.loadedAt = c.at; }
    S.offline = true;
    if (!silent) toast(errText(e), true);
  }
  setNet();
  if ((location.hash || "#/") === "#/") renderList();
}

/* =====================================================================
   Router: #/  #/trip/ID  #/new  #/edit/ID  #/export  #/team
   ===================================================================== */
function route(){
  const h = location.hash || "#/";
  let m;
  if (h === "#/" ) { renderList(); loadList(true); }
  else if ((m = h.match(/^#\/trip\/(\d+)$/))) renderTrip(Number(m[1]));
  else if (h === "#/new") renderForm(null);
  else if ((m = h.match(/^#\/edit\/(\d+)$/))) renderForm(Number(m[1]));
  else if (h === "#/export") renderExport();
  else if (h === "#/team") renderTeam();
  else location.hash = "#/";
}
window.addEventListener("hashchange", () => { if (S.me && S.me.active) route(); });

  document.querySelectorAll(".trip").forEach(b => b.onclick = () => { location.hash = "#/trip/" + b.dataset.id; });

  s.oninput = () => { S.q = s.value; const pos = s.selectionStart; renderList(); const s2 = $("search"); s2.focus(); s2.setSelectionRange(pos, pos); };
  const ma = $("markAll");
  if (ma) ma.onclick = async () => {
    ma.disabled = true;
    try { await q(sb.rpc("mark_checked", {p_trip_ids: rows.map(t => t.id)})); toast("Marked as checked."); await loadList(); }
    catch(e) { toast(errText(e), true); ma.disabled = false; }
  };
}

/* =====================================================================
   2. One lorry: details, costs, what changed, history
   ===================================================================== */
async function renderTrip(id){
  chrome("Lorry", {back:true});
  $("app").innerHTML = `<div class="empty">Loading…</div>`;
  let t, costs, log, files, price = null, plog = [];
  try {
    [t, costs, log, files] = await Promise.all([
      q(sb.from("v_trips").select("*").eq("id", id).maybeSingle()),
      q(sb.from("trip_charges").select("*").eq("trip_id", id).order("id")),
      q(sb.from("change_log").select("*").eq("trip_id", id).order("changed_at", {ascending:false}).limit(200)),
      q(sb.from("trip_files").select("*").eq("trip_id", id).order("id"))
    ]);
    if (canSeePrices()) [price, plog] = await Promise.all([
      q(sb.from("trip_prices").select("*").eq("trip_id", id).maybeSingle()),
      q(sb.from("price_log").select("*").eq("trip_id", id).order("changed_at", {ascending:false}).limit(100))
    ]);
  } catch(e) {
    t = S.trips.find(x => x.id === id); costs = null; log = []; files = null;
    if (!t) { $("app").innerHTML = `<div class="empty">${esc(errText(e))}</div>`; return; }
    toast("Offline: showing saved details. Costs and history need signal.", true);
  }
  if (!t) { $("app").innerHTML = `<div class="empty">This lorry was deleted.</div>`; return; }
  chrome(t.vehicle_no, {back:true});

  // What changed since *I* last checked (by other people).
  const since = t.my_reviewed_at;
  const fresh = since ? log.filter(l => l.changed_at > since && l.changed_by !== S.user.id) : [];
  const was = {};                       // field -> oldest "before" value
  const wasAt = {};                     // field -> {at, by} of the latest change
  const costChg = new Set();            // charge ids changed/added
  const fileNew = new Set();            // file ids added since my check
  let costRemoved = 0, filesRemoved = 0;
  for (const l of fresh.slice().reverse()) {
    if (l.table_name === "trips" && l.action === "update") for (const [k, v] of Object.entries(l.changes || {})) { if (!(k in was)) was[k] = v[0]; wasAt[k] = {at: l.changed_at, by: l.changed_by}; }
    if (l.table_name === "trip_charges") { if (l.action === "delete") costRemoved++; else costChg.add(l.record_id); }
    if (l.table_name === "trip_files") { if (l.action === "delete") filesRemoved++; else fileNew.add(l.record_id); }
  }
  const show = (k, v) => {
    if (k === "sawmill_id") return sawmillLabel(v);
    if (k === "party_id") return partyLabel(v);
    if (k === "status") return STATUS[v] || v;
    if (k === "freight_amount" || k === "amount") return inr(v);

  let h = "";
  if (t.my_flag === "edited") h += `<div class="alert red"><span class="grow"><b>Changed since you checked it</b> (${esc(dExact(since))}).<br>Last change: <b>${esc(dExact(t.my_change_at || t.last_change_at))}</b> by ${esc(personName(t.my_change_by || t.last_change_by))}. Status now: ${esc(STATUS[t.status])}. Changes are shown in red.${costRemoved ? ` ${costRemoved} cost${costRemoved > 1 ? "s" : ""} removed.` : ""}${filesRemoved ? ` ${filesRemoved} file${filesRemoved > 1 ? "s" : ""} removed.` : ""}</span><button class="btn small" id="chk">Mark as checked</button></div>`;

    ${row("Status","status",STATUS[t.status])}

    ${row("Net weight","net_weight_t",qty(t.net_weight_t,"tons"))}
    ${row("Party","party_id",t.party_name ? t.party_name + (t.party_city ? ", " + t.party_city : "") : null)}
    ${row("Destination","destination",t.destination)}
    ${row("Driver","driver_name",t.driver_name)}
    ${row("Driver phone","driver_phone",t.driver_phone)}
    ${row("Transporter","transporter",t.transporter)}
    ${row("Invoice no","invoice_no",t.invoice_no)}

    ${row("Notes","notes",t.notes)}
  </dl>
  ${t.driver_phone ? `<div class="row" style="margin-top:12px"><a class="btn small" href="tel:${esc(String(t.driver_phone).replace(/[^\d+]/g,""))}">Call driver</a></div>` : ""}
  </div>`;

  // Purchase and sale price: owner and accountant see it; only the owner changes it
  if (canSeePrices()) {

    const line = (rate, basis, amt) => [rate != null ? inr(rate) + (basis ? " " + basis : "") : "", amt != null ? "Amount " + inr(amt) : ""].filter(Boolean).join(" · ") || "—";

      <dl class="kv" style="margin-top:10px">
        <dt>Purchase</dt><dd>${esc(line(pr.purchase_rate, pr.purchase_basis, pr.purchase_amount))}${pr.purchase_note ? `<span class="small mut" style="display:block;font-weight:400">${esc(pr.purchase_note)}</span>` : ""}</dd>
        <dt>Sale</dt><dd>${esc(line(pr.sale_rate, pr.sale_basis, pr.sale_amount))}${pr.sale_note ? `<span class="small mut" style="display:block;font-weight:400">${esc(pr.sale_note)}</span>` : ""}</dd>
      </dl>

      ${isOwner() ? `<button class="btn small" style="margin-top:10px" id="editPrice">${price ? "Edit prices" : "+ Add prices"}</button><div id="priceForm"></div>` : ""}</div>`;
  }

  // Costs
  h += `<div class="card"><h3>Costs for this lorry</h3>
    <div class="tot ${"freight_amount" in was ? "chg" : ""}"><span>Lorry hire (freight)</span><span class="money" ${"freight_amount" in was ? 'style="color:var(--red)"' : ""}>${inr(t.freight_amount)}</span></div>

  if (costs === null) h += `<p class="mut small">Costs need signal to load.</p>`;
  else {
    for (const c of costs) h += `<div class="cost ${costChg.has(c.id) ? "chg" : ""}"><div class="grow"><b>${esc(c.charge_type)}</b>${costChg.has(c.id) ? ` <span class="badge b-edited">${since && c.created_at > since ? "Added" : "Changed"}</span>` : ""}<div class="small mut">${[c.paid_to ? "To " + esc(c.paid_to) : "", c.paid_on ? esc(dShort(c.paid_on)) : "", c.note ? esc(c.note) : ""].filter(Boolean).join(" · ") || "&nbsp;"}</div></div><span class="money">${inr(c.amount)}</span>${canCost() ? `<button class="btn small" data-cost="${c.id}">Edit</button>` : ""}</div>`;
    h += `<div class="tot"><span>Other costs</span><span class="money">${inr(t.charges_total)}</span></div>
      <div class="tot big"><span>Total</span><span class="money">${inr(t.total_cost)}</span></div>

  if (S.me.role === "owner") h += `<button class="btn red" style="width:100%" id="delTrip">Delete this lorry</button>`;
  $("app").innerHTML = h;

  const chk = $("chk");
  if (chk) chk.onclick = async () => { chk.disabled = true; try { await q(sb.rpc("mark_checked", {p_trip_ids:[t.id]})); toast("Marked as checked."); renderTrip(id); } catch(e) { toast(errText(e), true); chk.disabled = false; } };
  const ac = $("addCost"); if (ac) ac.onclick = () => costForm(t.id, null, id);

  document.querySelectorAll("[data-delfile]").forEach(b => b.onclick = async () => {

  };

/* Files are private: show them through links that expire after an hour. */
async function showFileLinks(files){
  try {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(files.map(f => f.storage_path), 3600);
    if (error) throw error;
    for (const f of files) {
      const hit = data.find(d => d.path === f.storage_path);
      if (!hit || !hit.signedUrl) continue;
      const a = $("fl-" + f.id), img = $("fi-" + f.id);
      if (a) a.href = hit.signedUrl;
      if (img) img.src = hit.signedUrl;
    }
  } catch(e) { /* thumbnails stay blank; the list still shows */ }
}
/* Phone photos are often 3-5 MB: shrink to about 1600 px so they upload on weak signal. */
async function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;      // PDFs and HEIC go as they are
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", {type:"image/jpeg"}) : file;
  } catch(e) { return file; }
}
async function uploadFile(tripId, original, kind){
  const file = await shrink(original);
  if (file.size > 10 * 1024 * 1024) throw new Error("File is bigger than 10 MB.");
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, file.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
  const path = `${tripId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const up = await sb.storage.from(BUCKET).upload(path, file, {contentType: file.type || undefined, upsert: false});
  if (up.error) throw up.error;
  try { await q(sb.from("trip_files").insert({trip_id: tripId, kind, storage_path: path, file_name: original.name, mime_type: file.type || null, size_bytes: file.size})); }
  catch(e) { await sb.storage.from(BUCKET).remove([path]); throw e; }
}

function fmtPrice(k, v){
  if (v === null || v === undefined || v === "") return "—";
  return /_rate$|_amount$/.test(k) ? inr(v) : String(v);
}
function histItem(l, since){
  const who = personName(l.changed_by);
  const isNew = since && l.changed_at > since && l.changed_by !== S.user.id;
  let what = "";
  const ch = l.changes || {};
  const fmt = (k, v) => k === "sawmill_id" ? sawmillLabel(v) : k === "party_id" ? partyLabel(v) : k === "status" ? (STATUS[v] || v) : (k === "freight_amount" || k === "amount") ? inr(v) : (v === null || v === "" ? "—" : String(v));
  if (l.table_name === "trips") {
    if (l.action === "insert") what = "Added this lorry";
    else if (l.action === "delete") what = "Deleted this lorry";
    else what = Object.entries(ch).map(([k, v]) => `${esc(FIELD[k] || k)}: ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join("<br>");
  } else if (l.table_name === "trip_prices") {
    what = (l.action === "insert" ? "Price added: " : l.action === "delete" ? "Price removed: " : "Price changed: ") + Object.entries(ch).map(([k, v]) => Array.isArray(v) ? `${esc(FIELD[k] || k)} ${esc(fmtPrice(k, v[0]))} → <b>${esc(fmtPrice(k, v[1]))}</b>` : `${esc(FIELD[k] || k)} ${esc(fmtPrice(k, v))}`).join(", ");
  } else if (l.table_name === "trip_files") {
    what = (l.action === "insert" ? "Added photo/file: " : "Removed photo/file: ") + `<b>${esc(ch.kind)}</b>`;
  } else {
    if (l.action === "insert") what = `Added cost: ${esc(ch.charge_type)} <b>${esc(inr(ch.amount))}</b>`;
    else if (l.action === "delete") what = `Removed cost: ${esc(ch.charge_type)} ${esc(inr(ch.amount))}`;
    else what = "Changed a cost: " + Object.entries(ch).map(([k, v]) => `${esc(FIELD[k] || k)} ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join(", ");
  }
  return `<div class="hist ${isNew ? "new" : ""}"><div class="when"><b>${esc(dExact(l.changed_at))}</b> · ${esc(who)} ${l.trip_status ? "· status " + stPill(l.trip_status) : ""}</div><div>${what}</div></div>`;
}

/* Add / edit one cost line, inside the lorry screen. */
function costForm(tripId, c, backId){

    <label class="f"><span>Paid to</span><input class="in" id="cTo" value="${esc(c ? (c.paid_to || "") : "")}"></label>

  box.scrollIntoView({behavior:"smooth", block:"center"});

    if (!confirm("Remove this cost?")) return;
    try { await q(sb.from("trip_charges").delete().eq("id", c.id)); toast("Cost removed."); renderTrip(backId); } catch(e) { toast(errText(e), true); }
  };
}

    catch(e) { toast(errText(e), true); b.disabled = false; b.textContent = "Save prices"; }
  };
}

/* WhatsApp-ready summary of one lorry. */
function waText(t, costs){
  const L = [`*Aditya Traders – Lorry ${t.vehicle_no}*`, `Date: ${dShort(t.trip_date)}`, `Status: ${STATUS[t.status]}`];
  if (t.sawmill_name) L.push(`From: ${t.sawmill_name}${t.sawmill_place ? ", " + t.sawmill_place : ""}`);
  if (t.party_name) L.push(`To: ${t.party_name}${t.party_city ? ", " + t.party_city : ""}${t.destination ? " (" + t.destination + ")" : ""}`);
  const load = [t.wood_type, qty(t.quantity_cft, "CFT"), qty(t.net_weight_t, "T")].filter(Boolean).join(" · ");
  if (load) L.push(`Load: ${load}`);
  if (t.driver_name || t.driver_phone) L.push(`Driver: ${[t.driver_name, t.driver_phone].filter(Boolean).join(", ")}`);
  if (t.invoice_no) L.push(`Invoice: ${t.invoice_no}`);
  if (t.eway_bill_no) L.push(`E-way bill: ${t.eway_bill_no}`);
  L.push("", `Lorry hire: ${inr(t.freight_amount)}`);
  if (costs && costs.length) for (const c of costs) L.push(`${c.charge_type}: ${inr(c.amount)}`);
  L.push(`*Total: ${inr(t.total_cost)}*`);
  return L.join("\n");
}

      renderTrip(newId);
    } catch(e) { toast(errText(e), true); b.disabled = false; b.textContent = id ? "Save changes" : "Save lorry"; }
  };
}

/* =====================================================================
   4. Excel export for the accountant
   ===================================================================== */
function renderExport(){
  chrome("Excel export", {back:true});
  const d = new Date(), y = d.toLocaleDateString("en-CA", {timeZone:"Asia/Kolkata"}).slice(0, 7);
  $("app").innerHTML = `<div class="card">
    <h2>Download for the accountant</h2>
    <p class="mut">One Excel file with three sheets: <b>Lorries</b> (one row per lorry with totals), <b>Costs</b> (every cost line) and <b>Changes</b> (every edit, who and when).${canSeePrices() ? " You also get a <b>Prices</b> sheet." : ""}</p>
    <div class="two"><label class="f"><span>From</span><input class="in" type="date" id="xFrom" value="${y}-01"></label><label class="f"><span>To</span><input class="in" type="date" id="xTo" value="${todayIST()}"></label></div>
    <button class="btn pri" style="width:100%" id="xGo">Download Excel</button>
    <p class="small mut" id="xMsg"></p>
  </div>`;
  $("xGo").onclick = async () => {
    const from = $("xFrom").value, to = $("xTo").value, b = $("xGo"), msg = $("xMsg");
    if (!from || !to || from > to) return toast("Check the dates.", true);
    b.disabled = true; b.textContent = "Preparing…";
    try {
      await loadScript(XLSX_URL);
      const trips = await q(sb.from("v_trips").select("*").gte("trip_date", from).lte("trip_date", to).order("trip_date").order("id"));
      const ids = trips.map(t => t.id);
      let costs = [], logs = [];
      for (let i = 0; i < ids.length; i += 150) {          // keep URLs short
        const part = ids.slice(i, i + 150);
        costs = costs.concat(await q(sb.from("trip_charges").select("*").in("trip_id", part).order("id")));
        logs = logs.concat(await q(sb.from("change_log").select("*").in("trip_id", part).order("changed_at")));
      }
      let prices = [], plogs = [];
      if (canSeePrices()) for (let i = 0; i < ids.length; i += 150) {
        prices = prices.concat(await q(sb.from("trip_prices").select("*").in("trip_id", ids.slice(i, i + 150))));
        plogs = plogs.concat(await q(sb.from("price_log").select("*").in("trip_id", ids.slice(i, i + 150)).order("changed_at")));
      }
      const veh = Object.fromEntries(trips.map(t => [t.id, t]));
      const n = v => v === null || v === undefined ? null : Number(v);
      const s1 = trips.map(t => ({"Date":t.trip_date, "Vehicle no":t.vehicle_no, "Lorry (T)":t.lorry_capacity_t, "Status":STATUS[t.status], "Sawmill":t.sawmill_name, "Sawmill place":t.sawmill_place, "Wood":t.wood_type, "Quantity (CFT)":n(t.quantity_cft), "Net weight (T)":n(t.net_weight_t), "Party":t.party_name, "Party city":t.party_city, "Destination":t.destination, "Invoice no":t.invoice_no, "E-way bill no":t.eway_bill_no, "Driver":t.driver_name, "Driver phone":t.driver_phone, "Transporter":t.transporter, "Lorry hire (₹)":n(t.freight_amount), "Other costs (₹)":n(t.charges_total), "Total cost (₹)":n(t.total_cost), "Notes":t.notes, "Times edited":n(t.change_count), "Last change (exact)":dExact(t.my_change_at || t.last_change_at), "Last change by":personName(t.my_change_by || t.last_change_by), "Trip ID":t.id}));
      const s2 = costs.map(c => ({"Lorry date":veh[c.trip_id]?.trip_date, "Vehicle no":veh[c.trip_id]?.vehicle_no, "Cost type":c.charge_type, "Amount (₹)":n(c.amount), "Paid to":c.paid_to, "Paid on":c.paid_on, "Note":c.note, "Added by":personName(c.created_by), "Added at":dFull(c.created_at), "Trip ID":c.trip_id}));
      const s3 = [];
      for (const l of logs) {
        const base = {"When (exact)":dExact(l.changed_at), "By":personName(l.changed_by), "Vehicle no":veh[l.trip_id]?.vehicle_no, "Lorry status then":STATUS[l.trip_status] || l.trip_status || "", "Trip ID":l.trip_id, _t:l.changed_at};
        const what = ({trips:"Lorry ", trip_charges:"Cost ", trip_files:"Photo/file "}[l.table_name] || "") + ({insert:"added", update:"changed", delete:"removed"}[l.action]);
        if (l.action === "update") for (const [k, v] of Object.entries(l.changes || {})) s3.push({...base, "What":what, "Field":FIELD[k] || k, "Old value":fmtCell(k, v[0]), "New value":fmtCell(k, v[1])});
        else s3.push({...base, "What":what, "Field":l.table_name === "trip_charges" ? (l.changes?.charge_type || "") : l.table_name === "trip_files" ? (l.changes?.kind || "") : "", "Old value":l.action === "delete" && l.table_name === "trip_charges" ? n(l.changes?.amount) : "", "New value":l.action === "insert" && l.table_name === "trip_charges" ? n(l.changes?.amount) : ""});
      }
      for (const l of plogs) {
        const base = {"When (exact)":dExact(l.changed_at), "By":personName(l.changed_by), "Vehicle no":veh[l.trip_id]?.vehicle_no, "Lorry status then":STATUS[l.trip_status] || l.trip_status || "", "Trip ID":l.trip_id, _t:l.changed_at};
        for (const [k, v] of Object.entries(l.changes || {})) s3.push({...base, "What":"Price " + ({insert:"added", update:"changed", delete:"removed"}[l.action]), "Field":FIELD[k] || k, "Old value":Array.isArray(v) ? v[0] : (l.action === "delete" ? v : ""), "New value":Array.isArray(v) ? v[1] : (l.action === "insert" ? v : "")});
      }
      s3.sort((x, y) => (x["Trip ID"] - y["Trip ID"]) || (x._t < y._t ? -1 : x._t > y._t ? 1 : 0));   // per lorry, in time order
      s3.forEach(r => delete r._t);
      const wb = XLSX.utils.book_new();
      const add = (rows, name, empty) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [empty]); ws["!cols"] = Object.keys(rows[0] || empty).map(k => ({wch: Math.max(10, k.length + 2)})); XLSX.utils.book_append_sheet(wb, ws, name); };
      add(s1, "Lorries", {"Date":"No lorries in these dates"});
      add(s2, "Costs", {"Vehicle no":"No costs in these dates"});
      add(s3, "Changes", {"When (exact)":"No changes in these dates"});
      if (canSeePrices()) {
        const s4 = prices.map(pr => ({"Lorry date":veh[pr.trip_id]?.trip_date, "Vehicle no":veh[pr.trip_id]?.vehicle_no, "Quantity (CFT)":n(veh[pr.trip_id]?.quantity_cft), "Purchase rate (₹)":n(pr.purchase_rate), "Purchase basis":pr.purchase_basis, "Purchase amount (₹)":n(pr.purchase_amount), "Purchase note":pr.purchase_note, "Sale rate (₹)":n(pr.sale_rate), "Sale basis":pr.sale_basis, "Sale amount (₹)":n(pr.sale_amount), "Sale note":pr.sale_note, "Trip ID":pr.trip_id}));
        add(s4, "Prices", {"Vehicle no":"No prices in these dates"});
      }
      XLSX.writeFile(wb, `Aditya_Traders_${from}_to_${to}.xlsx`);
      msg.textContent = `Downloaded: ${s1.length} lorries, ${s2.length} costs, ${s3.length} changes.`;
    } catch(e) { toast(errText(e), true); }
    b.disabled = false; b.textContent = "Download Excel";
  };
}
function fmtCell(k, v){
  if (k === "sawmill_id") return sawmillLabel(v);
  if (k === "party_id") return partyLabel(v);
  if (k === "status") return STATUS[v] || v;
  return v === null || v === undefined ? "" : v;
}
function loadScript(src){
  return new Promise((ok, bad) => {
    if (document.querySelector(`script[src="${src}"]`) && window.XLSX) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Failed to fetch the Excel tool")); document.head.appendChild(s);
  });
}

async function renderTeam(){
  chrome("Team", {back:true});
  if (S.me.role !== "owner") { $("app").innerHTML = `<div class="empty">Only the owner can manage the team.</div>`; return; }
  await loadMasters();

  $("app").innerHTML = `<div class="card"><h2>People</h2>

    if (b.dataset.go) location.hash = b.dataset.go;
    if (b.dataset.act === "refresh") { await loadMasters(); location.hash === "#/" || !location.hash ? loadList() : route(); }
    if (b.dataset.act === "out") { lsSet(cacheKey(), null); history.replaceState(null, "", "#/"); await sb.auth.signOut(); }
  };
  document.body.appendChild(m);
};

/* =====================================================================
   Start
   ===================================================================== */
sb.auth.onAuthStateChange((event, session) => {
  const u = session ? session.user : null;
  if (event === "TOKEN_REFRESHED") { S.user = u; return; }
  if (u && S.user && u.id === S.user.id && S.me) return;   // same person, already loaded
  S.user = u; S.me = null;
  // Run outside the auth callback: supabase-js can deadlock if queries start inside it.
  setTimeout(() => { if (u) afterLogin(); else showLogin(); }, 0);
});
}
</script>
<script>
document.getElementById("demoSwitch").onclick = () => { history.replaceState(null, "", "#/"); window.supabase.createClient().auth.signOut(); };
document.getElementById("demoReset").onclick = () => { if (confirm("Reset the demo to the original sample lorries?")) window.__demoReset(); };
</script>
