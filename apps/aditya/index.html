   <div class="card"><label class="f" style="margin:0"><span class="${id ? "req" : ""}">Reason for this ${id ? "change" : register ? "entry" : "load"}</span><input class="in" name="change_reason" placeholder="${id ? "e.g. Driver changed, told by transporter" : register ? "e.g. Truck reached Sawmill A" : "e.g. Goel asked for one load"}"><div class="hint">Everyone sees who did this, when and why.</div></label></div>
   ${register ? `<p class="small mut">Next: add the sawmills and their wood items on the truck's page.</p>` : id ? "" : `<p class="small mut">This load starts in Planning (owner only). Staff see it from Going to load.</p>`}
  </form>
  <div class="savebar"><div class="in2"><button class="btn" id="fCancel">Cancel</button><button class="btn pri" id="fSave">${id ? "Save changes" : register ? "Save and continue" : "Save load"}</button></div></div>`;
  $("nav").classList.add("hidden");
  const form = $("lf"); let cap = L.capacity_t ? Number(L.capacity_t) : null;
  const picked = {};
  if (register) [["driver", photoRequired()], ["licence"], ["cbook"]].forEach(([key, must]) => {
    const inp = $(`reg-${key}-in`);
    inp.onchange = () => {
      const f = inp.files[0]; picked[key] = f || null;
      const box = $(`reg-${key}`), st = $(`reg-${key}-st`), prev = $(`reg-${key}-prev`);
      box.className = "doc " + (f ? "ok" : must ? "req" : "na"); st.textContent = f ? "Ready to upload" : must ? "Required" : "Not Provided";
      prev.innerHTML = f && /^image\//.test(f.type) ? `<a><img alt="" src="${URL.createObjectURL(f)}"></a>` : "";
      if (must && f) $("regMust").classList.add("hidden");
    };
  });
  form.querySelectorAll("[data-seg=capacity_t] button").forEach(b => b.onclick = () => { const on = b.getAttribute("aria-pressed") === "true"; form.querySelectorAll("[data-seg=capacity_t] button").forEach(x => x.setAttribute("aria-pressed", "false")); cap = on ? null : Number(b.dataset.v); if (!on) b.setAttribute("aria-pressed", "true"); form.capacity_other.value = ""; draft(); });
  form.capacity_other.oninput = () => { form.querySelectorAll("[data-seg=capacity_t] button").forEach(x => x.setAttribute("aria-pressed", "false")); cap = num(form.capacity_other.value); };
  const collect = () => { const f = Object.fromEntries(new FormData(form)); const rec = {
    load_date: f.load_date || today(), vehicle_no: (f.vehicle_no || "").toUpperCase().replace(/\s+/g, "") || null, capacity_t: cap, capacity_cft: num(f.capacity_cft),
    driver_name: (f.driver_name || "").trim() || null, driver_phone: (f.driver_phone || "").trim() || null,
    transporter_id: f.transporter_id && f.transporter_id !== "__new" ? Number(f.transporter_id) : null, change_reason: (f.change_reason || "").trim() || null };
    if (!register) Object.assign(rec, {net_weight_t: num(f.net_weight_t), party_id: f.party_id && f.party_id !== "__new" ? Number(f.party_id) : null, destination: (f.destination || "").trim() || null,
      destination_state: (f.destination_state || "").trim() || null, eway_bill_no: (f.eway_bill_no || "").replace(/\s+/g, "") || null, notes: (f.notes || "").trim() || null});
    return rec; };
  const draft = () => { if (!id) lsSet(register ? "at2_reg" : "at2_draft", collect()); };
  form.addEventListener("input", draft);
  form.querySelectorAll("select").forEach(s => s.onchange = async () => {
    if (s.value !== "__new") return draft();
    const kind = s.name === "party_id" ? "buyer" : "transporter";
    const p = await partyForm(kind, null);
    if (p) s.innerHTML = `<option value="">— choose —</option>${S.parties.filter(x => x.kind === kind).map(x => `<option value="${x.id}" ${x.id === p.id ? "selected" : ""}>${esc(x.name + (x.city ? ", " + x.city : ""))}</option>`).join("")}<option value="__new">+ Add new…</option>`;
    else s.value = "";
    draft();
  });
  $("fCancel").onclick = () => { if (!id) lsSet(register ? "at2_reg" : "at2_draft", null); history.back(); };
  $("fSave").onclick = async () => {
    const rec = collect();
    if (id && !rec.change_reason) { toast("Write the reason for this change.", true); form.change_reason.focus(); return; }
    if (rec.net_weight_t != null && (isNaN(rec.net_weight_t) || rec.net_weight_t <= 0 || rec.net_weight_t >= 100)) return toast("Check the kata net weight (tons).", true);
    if (rec.capacity_cft != null && (isNaN(rec.capacity_cft) || rec.capacity_cft <= 0)) return toast("Check the capacity in CFT.", true);
    if (register) {
      if (!rec.vehicle_no) { form.vehicle_no.focus(); return toast("Enter the truck number.", true); }
      if (!rec.driver_name) { form.driver_name.focus(); return toast("Enter the driver name.", true); }
      if (photoRequired() && !picked.driver) {   // compulsory photo (owner setting): red, highlighted, and nothing is saved
        $("regMust").classList.remove("hidden"); $("reg-driver").scrollIntoView({behavior:"smooth", block:"center"});
        return toast("Driver photo with truck is mandatory.", true);
      }
      rec.truck_stage = "going_to_load"; rec.change_reason = rec.change_reason || "Truck registered";
    }
    const b = $("fSave"); b.disabled = true; b.textContent = "Saving…";
    try {
      let newId = id;
      if (id) await q(sb.from("loads").update(rec).eq("id", id));
      else { const r = await q(sb.from("loads").insert(rec).select("id").single()); newId = r.id; lsSet(register ? "at2_reg" : "at2_draft", null); }
      if (register) {
        b.textContent = "Uploading photos…";
        if (picked.driver) await uploadFile(newId, picked.driver, "Driver with truck");
        if (picked.licence) await uploadFile(newId, picked.licence, "Driving licence");
        if (picked.cbook) await uploadFile(newId, picked.cbook, "C-Book / RC");
      }
      toast("Saved."); history.replaceState(null, "", "#/load/" + newId); loadLoads(true); renderLoad(newId);
    } catch(e) { toast(errText(e), true); b.disabled = false; b.textContent = id ? "Save changes" : register ? "Save and continue" : "Save load"; }
  };
}

async function millForm(m){

async function renderRates(){

  if (!millId) { $("app").innerHTML = h + `<div class="empty">Add sawmills first.</div>`; return; }

    bal = (await q(sb.from("v_balances").select("*").eq("party_kind", "mill").eq("sawmill_id", millId)))[0];

      const s1 = loads.map(l => ({"Load":l.load_no, "Date":l.load_date, "Stage":STAGE[l.truck_stage], "Truck":l.vehicle_no, "Capacity (T)":n(l.capacity_t), "Capacity (CFT)":n(l.capacity_cft), "Kata net (T)":n(l.net_weight_t), "Driver":l.driver_name, "Driver phone":l.driver_phone, "Driver photo":l.driver_photo ? "Yes" : "No", "Transporter":l.transporter_name, "Party":l.party_name, "Destination":l.destination, "State":l.destination_state, "E-way bill":l.eway_bill_no, "Sawmills":n(l.mills_count), "Quantity":l.qty_summary,
        ...(X ? {"Freight (₹)":n(l.freight_total), "All expenses (₹)":n(l.costs_total)} : {}),
        ...(F ? {"Purchase total (₹)":n(l.purchase_total), "Invoice no":l.invoice_no, "Invoice date":l.invoice_date, "Invoice total (₹)":n(l.invoice_total), "Due date":l.due_date, "Received (₹)":n(l.received), "Bill stage":BILL[l.bill_stage]} : {}),
        "Last change":dExact(l.last_at), "Last change by":person(l.last_by), "Last reason":l.last_reason}));
      const s2 = lines.map(x => ({"Load":byId[x.load_id]?.load_no, "Saw Mill Name":x.sawmill_name, "Place":x.sawmill_place, "Sawmill owner":x.owner_name, "Party name":x.party_name, "Wood":x.wood_type, "Dimensions":x.dimensions, "Size":GRADES[x.size_grade] || "", "Quantity":n(x.quantity), "Unit":x.unit, "Pieces":n(x.pieces), "Length (ft)":n(x.length_ft), "Status":LINE_ST[x.line_status], "Loaded on":x.loaded_on, ...(F ? {"Rate (₹)":n(x.rate), "Adjustment (₹)":n(x.adjustment), "Amount (₹)":n(x.amount)} : {})}));
      const s3 = files.map(f => ({"Load":byId[f.load_id]?.load_no, "Document":f.kind, "Saw Mill Name":f.allocation_id ? (lines.find(x => x.allocation_id === f.allocation_id) || {}).sawmill_name : "", "Uploaded":dExact(f.created_at), "By":person(f.created_by)}));
      const s4 = acts.map(a => ({"When (exact)":dExact(a.at), "Load":byId[a.load_id]?.load_no, "Who":person(a.actor), "Stage then":STAGE[a.truck_stage] || "", "What":(ENTITY[a.entity] || a.entity) + " " + a.action, "Details":a.action === "note" ? a.reason : JSON.stringify(a.changes || {}), "Reason":a.action === "note" ? "" : (a.reason || "")}));
      const wb = XLSX.utils.book_new();
      const add = (rows, name) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{"Info":"Nothing in these dates"}]); XLSX.utils.book_append_sheet(wb, ws, name); };
      const s5 = [];
      tallies.forEach(t => Object.entries(t.counts || {}).sort((x, y) => x[0] - y[0]).forEach(([th, cells]) => Object.entries(cells).map(([k, n]) => [...k.split("|").map(Number), Number(n)]).sort((x, y) => x[0] - y[0] || x[1] - y[1]).forEach(([len, w, n]) =>
        s5.push({"Load":byId[t.load_id]?.load_no, "Saw Mill Name":(lines.find(x => x.allocation_id === t.allocation_id) || {}).sawmill_name || millName(t.sawmill_id), "Wood":t.wood_type, "Thickness (in)":Number(th), "Length (ft)":len, "Length":ftIn(len), "Width (in)":w, "Pieces":n, "Size":GRADES[gradeFor(len)], "CFT":Number(th) * w * len * n / 144}))));
      add(s1, "Loads"); add(s2, "Sawmill items"); add(s5, "Piece tally"); add(s3, "Documents"); add(s4, "History");
      if (X) add(exps.map(c => ({"Date":c.paid_on, "Load":byId[c.load_id]?.load_no, "Category":c.cost_type, "Saw Mill Name":c.allocation_id ? (lines.find(x => x.allocation_id === c.allocation_id) || {}).sawmill_name : "Whole trip", "Amount (₹)":n(c.amount), "Paid to":c.paid_to, "Description":c.note, "Entered by":person(c.created_by)})), "Expenses");
      if (F) {
        add(pays.map(p => ({"Date":p.paid_on, "Load":byId[p.load_id]?.load_no, "Type":p.party_kind === "buyer" ? "Received" : "Paid", "Party":p.party_kind === "mill" ? millName(p.sawmill_id) : partyName(p.party_id), "Amount (₹)":n(p.amount), "Mode":MODES[p.mode], "Reference":p.reference, "Note":p.note})), "Payments");
        const bal = await q(sb.from("v_balances").select("*"));
        add(bal.map(x => ({"Kind":x.party_kind, "Name":x.name, "Place":x.place, "Total (₹)":n(x.total_due), "Paid (₹)":n(x.total_paid), "Balance (₹)":Number(x.total_due) - Number(x.total_paid)})), "Balances");
      }
      XLSX.writeFile(wb, `Aditya_Traders_${from}_to_${to}.xlsx`);
      $("xMsg").textContent = `Downloaded: ${s1.length} loads, ${s2.length} wood items, ${s4.length} history rows.`;
    } catch(e) { toast(errText(e), true); }
    b.disabled = false; b.textContent = "Download Excel";
  };
}
function loadScript(src){ return new Promise((ok, bad) => { if (window.XLSX) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => bad(new Error("Failed to fetch the Excel tool")); document.head.appendChild(s); }); }

sb.auth.onAuthStateChange((event, session) => {
  const u = session ? session.user : null;
  if (event === "TOKEN_REFRESHED") { S.user = u; return; }
  if (u && S.user && u.id === S.user.id && S.me) return;
  S.user = u; S.me = null; S.loadedAt = null;
  setTimeout(() => { if (u) afterLogin(); else showLogin(); }, 0);   // outside the auth callback (supabase-js deadlock)
});
}
