<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3eee4">
<!-- Fonts: Fraunces (headings, numbers) + Outfit (text). If they do not load (weak signal), system fonts are used. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<title>Aditya Traders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b4332'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%23f3b733'%3EAT%3C/text%3E%3C/svg%3E">
<style>
/* Aditya Traders, version 2: one place for every load.
   Plain HTML/CSS/JS with system fonts, so it is fast on low-end Android over weak signal.
   Brand: teak brown, mango yellow. Red = changed since you last checked. */
:root{--bg:#f3eee4;--card:#fffdf8;--ink:#1c1712;--mut:#6e645a;--line:#e3d7c6;--soft:#f8f3ea;--brand:#1b4332;--brand2:#8a4a12;--act:#b85c14;--mango:#f3b733;--serif:"Fraunces",Georgia,"Times New Roman",serif;--red:#c62828;--redbg:#fdecea;--blue:#1d4ed8;--bluebg:#e8efff;--green:#13804a;--greenbg:#e5f4eb;--amber:#8a5a00;--amberbg:#fff3d6;--r:14px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Outfit",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand2)}
.hidden{display:none!important}
h2{font:600 22px/1.2 var(--serif);letter-spacing:-.01em;margin:4px 0 12px}
h3{font:600 17px/1.25 var(--serif);margin:0 0 10px}
.mut{color:var(--mut)} .small{font-size:14px} .tiny{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* app bar + bottom nav */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));min-height:56px}
.top h1{font:600 19px/1.15 var(--serif);letter-spacing:-.01em;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{display:block;font:600 11px/1.3 "Outfit",system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.iconbtn{background:none;border:0;color:inherit;min-width:44px;min-height:44px;border-radius:10px;font-size:22px;cursor:pointer}
.iconbtn:hover{background:rgba(0,0,0,.05)}
.topnew{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;background:var(--act);color:#fff8f1;font-weight:700;font-size:14.5px;text-decoration:none;white-space:nowrap}
.net{background:#7a2e0e;color:#fff;text-align:center;font-size:14px;padding:6px 10px}
main{max-width:860px;margin:0 auto;padding:12px 12px 96px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;color:var(--mut);font-size:12px;font-weight:600;position:relative}
nav.bottom a svg{width:24px;height:24px}
nav.bottom a[aria-current=page]{color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,white);border-radius:12px}
nav.bottom a .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center}
/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flush{padding:0;overflow:hidden}
.sect{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.sect h3{margin:0;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:9px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand2)}
.btn.pri{background:var(--act);border-color:var(--act);color:#fff8f1}
.btn.acc{background:var(--brand);border-color:var(--brand);color:#f4f7f4}
.btn.wa{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{color:var(--red);border-color:#efb4ae}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tile{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-decoration:none;color:var(--ink)}
.tile .n{font:600 28px/1.1 var(--serif)}
.tile .l{font-size:14px;color:var(--mut);margin-top:2px}
.tile.alert{border-color:#f0b9b3;background:#fff8f7}
.tile.alert .n{color:var(--red)}
.tile.money{background:var(--brand);border-color:var(--brand);color:#f4f7f4}.tile.money .l{color:#cfe0d6}.tile.money .n{font-size:21px}
/* chips + pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.chip .c{margin-left:4px;opacity:.7}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:#efe9e2;color:#5b4a3a}
.pill.s-planning{background:#eef0f3;color:#475467}
.pill.s-truck_fixed,.pill.s-going_to_load{background:var(--bluebg);color:var(--blue)}
.pill.s-under_loading{background:var(--amberbg);color:var(--amber)}
.pill.s-loaded,.pill.s-in_transit{background:#efe4ff;color:#5b21b6}
.pill.s-delivered{background:var(--greenbg);color:var(--green)}
.pill.s-cancelled{background:#eee;color:#666}
.pill.b-not_ready{background:#eef0f3;color:#475467}
.pill.b-ready_to_bill{background:var(--amberbg);color:var(--amber)}
.pill.b-billed{background:var(--bluebg);color:var(--blue)}
.pill.b-payment_pending{background:var(--redbg);color:var(--red)}
.pill.b-paid{background:var(--greenbg);color:var(--green)}
.pill.l-planned{background:#eef0f3;color:#475467}
.pill.l-loading{background:var(--amberbg);color:var(--amber)}
.pill.l-done{background:var(--greenbg);color:var(--green)}
.flag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:800}
.flag.edited{background:var(--red);color:#fff}
.flag.new{background:var(--bluebg);color:var(--blue)}
/* person avatars: initials in a rounded square (owner forest, accountant sand, staff amber) */
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font:700 12px/1 "Outfit",system-ui,sans-serif;background:#f8e6d2;color:#b85c14;flex:none;vertical-align:middle;margin-right:6px}
.av.owner{background:#1b4332;color:#f4f7f4}.av.accountant{background:#efe6d6;color:#1c1712}
.av.big{width:40px;height:40px;border-radius:12px;font-size:15px;margin:0}
/* quick actions (GimBooks-style round icons) */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 6px 12px;margin-bottom:12px}
.qa a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.qa i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.qa svg{width:24px;height:24px}
/* documents and per-sawmill sections */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.doc{border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;background:var(--soft)}
.doc .st{display:block;font-weight:700;margin:4px 0 6px}
.doc.req{border-color:#e7a19a;background:#fff4f2}
.doc.req .st{color:var(--red)}
.doc.ok .st{color:var(--green)}
.doc.na .st{color:#555}
.doc img{width:100%;height:70px;object-fit:cover;border-radius:8px;display:block;background:#eee}
.doc label.btn{width:100%}
.mustbox{border:2px solid var(--red);background:#fff1ef;color:#8e1b12;border-radius:12px;padding:10px 12px;font-weight:700;margin:10px 0}
.alloc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.alloc .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alloc .sub{font-size:13.5px;color:var(--mut);margin:2px 0 6px}
.item{border-top:1px dashed var(--line);padding:8px 0}
.item:first-of-type{border-top:0}
.slip{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.slip .hd{display:flex;gap:8px;align-items:center}
.na-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:#e9e6e1;color:#444}
.ok-pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--greenbg);color:var(--green)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs a{width:64px;height:64px;border-radius:8px;overflow:hidden;background:#eee;display:grid;place-items:center;font-size:11px;color:var(--mut);text-decoration:none}
.thumbs img{width:100%;height:100%;object-fit:cover}
.stepno{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font:700 13px/1 "Outfit",system-ui,sans-serif;margin-right:6px}
/* load cards */
.loadc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink);text-decoration:none}
.loadc.edited{border-left-color:var(--red);background:#fffafa}
.loadc.new{border-left-color:var(--blue)}
.loadc .t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.loadc .no{font:600 18px/1.2 var(--serif)}
.loadc .veh{font-weight:700;color:var(--brand2)}
.loadc .t2{margin-top:4px;color:var(--mut);font-size:14.5px}
.loadc .t3{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;font-size:14.5px}
.loadc .t4{margin-top:6px;font-size:13px}
.bar{height:8px;border-radius:4px;background:#eee6dc;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--mango);border-radius:4px}
.bar.full>i{background:var(--green)}
.search{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:10px;font-size:16px}
.empty{text-align:center;padding:36px 14px;color:var(--mut)}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.red{background:var(--redbg);color:#7f1d1d;border:1px solid #f3c1bb}
.banner.blue{background:var(--bluebg);color:#1e3a8a;border:1px solid #c7d6fb}
.banner.amber{background:var(--amberbg);color:#5b3d06;border:1px solid #f0dba5}
/* stepper */
.stepper{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.step{flex:1 0 auto;min-width:86px;text-align:center;font-size:12px;font-weight:700;color:var(--mut)}
.step i{display:block;height:6px;border-radius:3px;background:#e7ded3;margin-bottom:6px}
.step.done i{background:var(--brand2)} .step.cur i{background:var(--mango)} .step.cur{color:var(--ink)}
/* details */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mut);font-size:14.5px}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.line{border-top:1px solid var(--line);padding:12px 0}
.line:first-of-type{border-top:0;padding-top:0}
.line .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{margin-top:8px;background:var(--soft);border:1px dashed #e0d3c2;border-radius:10px;padding:8px 10px;font-size:14px}
.tot{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.tot.big{font-weight:800;font-size:17px}
/* timeline */
.tl{position:relative;padding-left:16px;border-left:3px solid var(--line);margin:0 0 12px 4px}
.tl.new{border-left-color:var(--red)}
.tl .when{font-size:13px;color:var(--mut)}
.tl .what{margin-top:2px}
.tl .why{margin-top:3px;font-size:14px;color:#5b4a3a;font-style:italic}
.tl.note .what{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-style:normal}
.tl.adm .what::before{content:"Money only · ";font-weight:700;color:var(--amber)}
/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:600;margin-bottom:4px;font-size:14.5px}
.in{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--card);font-size:16px}
textarea.in{min-height:76px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;cursor:pointer;font-size:14.5px}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.req::after{content:" *";color:var(--red)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.savebar .in2{max-width:860px;margin:0 auto;display:flex;gap:8px}
.savebar .btn{flex:1}
/* sheet (modal) */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(20,12,4,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;background:#1f1a15;color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.err{background:var(--red)}
/* files */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:10px}
.file{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.file a{display:flex;align-items:center;justify-content:center;height:110px;background:#f1ece6;color:var(--mut);font-weight:800;text-decoration:none}
.file img{width:100%;height:100%;object-fit:cover}
.file .cap{padding:6px 8px;font-size:13px}
/* login */
.login{max-width:420px;margin:7vh auto 0;padding:0 16px}
.brandbox{background:var(--brand);color:#f4f7f4;border-radius:18px;padding:22px 20px;margin-bottom:14px}
.brandbox b{display:block;font:600 28px/1.15 var(--serif);margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.t td.r,table.t th.r{text-align:right}
footer{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px}
@media(max-width:420px){.three{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.two{grid-template-columns:1fr}}
/* piece tally grid */
.tgrid{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0 10px}
.tgrid table{border-collapse:separate;border-spacing:0;font-size:14px}
.tgrid th,.tgrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.tgrid thead th{position:sticky;top:0;z-index:2;background:var(--soft);padding:6px 2px;min-width:42px;font-weight:700}
.tgrid tbody th{position:sticky;left:0;z-index:1;background:var(--soft);padding:3px 7px;text-align:left;white-space:nowrap;line-height:1.1;font-weight:700}
.tgrid thead th:first-child{left:0;z-index:3}
.tgrid tbody th small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.tgrid tr.band>*{border-top:2px solid var(--brand)}
.tgrid input{width:42px;height:38px;border:0;padding:0;text-align:center;background:transparent;font-variant-numeric:tabular-nums;font-size:15px}
.tgrid input:focus{outline:2px solid var(--act);outline-offset:-2px;background:var(--amberbg)}
.tgrid td.has input{background:var(--greenbg);font-weight:700}
.tgrid td.rt{padding:0 6px;font-size:12px;color:var(--mut);white-space:nowrap;text-align:right;min-width:40px}
.tqa{position:sticky;bottom:76px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.12);display:flex;gap:6px;align-items:center;margin-bottom:12px}
.tqa .cell{flex:1;min-width:0;font-size:13px;line-height:1.2}
.tqa button{min-width:46px;padding-left:6px;padding-right:6px}
.tsum td,.tsum th{padding:6px 4px}
.tally{border:1px dashed var(--brand);border-radius:12px;padding:8px 10px;margin:6px 0;background:var(--soft)}
</style>
</head>
<body>
<div class="top" id="top">
  <button class="iconbtn hidden" id="backBtn" aria-label="Back">&#8592;</button>
  <h1 id="title">Aditya Traders</h1>
  <a class="topnew hidden" id="topNew" href="#/new">+ New load</a>
  <button class="iconbtn hidden" id="refreshBtn" aria-label="Refresh" title="Refresh">&#8635;</button>
</div>
<div class="net hidden" id="net"></div>
<main id="app"><div class="empty">Loading…</div></main>
<nav class="bottom hidden" id="nav" aria-label="Main">
  <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#/loads" data-nav="loads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 7h11v9H2zM13 10h4l3 3v3h-7z"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>Loads<span class="dot hidden" id="navDot"></span></a>
  <a href="#/updates" data-nav="updates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>Updates</a>
  <a href="#/parties" data-nav="parties" id="navParties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg><span id="navPartiesLabel">Mills</span></a>
  <a href="#/more" data-nav="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>More</a>
</nav>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
{
/* =====================================================================
   Settings. The key is Supabase's public "anon" key and is meant to be

/* Same formula as the client's workbook: CFT = thickness (in) x width (in) x length (ft) x pieces / 144. No rounding inside. */
function tallyTotals(counts){
  const blank = () => ({pcs:0, cft:0, th:{}});
  const out = {...blank(), size:{small:blank(), medium:blank(), large:blank()}};
  for (const [t, cells] of Object.entries(counts || {})) for (const [k, n0] of Object.entries(cells || {})) {
    const n = Number(n0) || 0; if (!n) continue;
    const [len, w] = k.split("|").map(Number), th = Number(t), c = th * w * len * n / 144, g = gradeFor(len) || "small";
    for (const o of [out, out.size[g]]) { o.pcs += n; o.cft += c; o.th[th] = o.th[th] || {pcs:0, cft:0}; o.th[th].pcs += n; o.th[th].cft += c; }
  }
  return out;
}

/* Bottom-sheet form. fields: [{id,label,type,options,value,required,hint,step}] → values object or null. */
function sheet({title, intro = "", fields = [], ok = "Save", danger = null}){
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "sheetbg";
    const field = f => {
      const req = f.required ? " req" : "";
      if (f.type === "select") return `<label class="f"><span class="${req}">${esc(f.label)}</span><select class="in" id="sf_${f.id}">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(f.value ?? "") ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
      if (f.type === "textarea") return `<label class="f"><span class="${req}">${esc(f.label)}</span><textarea class="in" id="sf_${f.id}" placeholder="${esc(f.placeholder || "")}">${esc(f.value ?? "")}</textarea>${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
      if (f.type === "file") return `<label class="f"><span>${esc(f.label)}</span><input class="in" id="sf_${f.id}" type="file" accept="image/*,application/pdf"></label>`;
      if (f.type === "check") return `<label class="row" style="margin-bottom:12px"><input type="checkbox" id="sf_${f.id}" ${f.value ? "checked" : ""} style="width:22px;height:22px"> <span>${esc(f.label)}</span></label>`;
      return `<label class="f"><span class="${req}">${esc(f.label)}</span><input class="in" id="sf_${f.id}" type="${f.type || "text"}" ${f.type === "number" ? `inputmode="${f.step === "1" ? "numeric" : "decimal"}" step="${f.step || "any"}"` : ""} ${f.list ? `list="sl_${f.id}"` : ""} value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder || "")}" autocomplete="off">${f.list ? `<datalist id="sl_${f.id}">${f.list.map(x => `<option value="${esc(x)}">`).join("")}</datalist>` : ""}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</label>`;
    };
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${intro ? `<p class="mut small" style="margin-top:-6px">${intro}</p>` : ""}
      <form id="sheetForm" novalidate>${fields.map(field).join("")}<p class="small" id="sheetErr" style="color:var(--red);min-height:1em;margin:0 0 8px"></p>
      <div class="row"><button type="button" class="btn" id="sheetCancel">Cancel</button>${danger ? `<button type="button" class="btn red" id="sheetDanger">${esc(danger)}</button>` : ""}<button class="btn pri grow" id="sheetOk">${esc(ok)}</button></div></form></div>`;
    document.body.appendChild(bg);
    const close = v => { bg.remove(); resolve(v); };
    const first = bg.querySelector("input,select,textarea"); if (first) first.focus({preventScroll:true});   // immediately: a delayed focus could steal typing from another box
    bg.addEventListener("click", e => { if (e.target === bg) close(null); });
    $("sheetCancel").onclick = () => close(null);
    if (danger) $("sheetDanger").onclick = () => close({__danger: true});
    $("sheetForm").onsubmit = e => {
      e.preventDefault();
      const out = {};
      for (const f of fields) {
        const el = $("sf_" + f.id);
        out[f.id] = f.type === "check" ? el.checked : f.type === "file" ? (el.files[0] || null) : el.value.trim();
        if (f.required && !out[f.id]) { $("sheetErr").textContent = (f.type === "file" ? "Add: " : "Fill in: ") + f.label; el.focus(); return; }
        if (f.type === "number" && out[f.id] !== "" && (isNaN(Number(out[f.id])) || (f.min !== undefined && Number(out[f.id]) < f.min))) { $("sheetErr").textContent = "Check the number in: " + f.label; el.focus(); return; }
      }
      close(out);
    };
  });
}

const here = () => location.hash || "#/";
async function route(soft){
  const h = location.hash || "#/"; let m;
  if (soft && /^#\/(new|register|edit\/|tally\/)/.test(h)) return;          // never wipe a form being typed
  lastHash = h;
  if (h === "#/") { if (!S.loadedAt || !soft) await loadLoads(true); return here() === h ? renderHome() : undefined; }
  if (h === "#/loads") { if (!S.loadedAt || !soft) await loadLoads(true); return here() === h ? renderLoads() : undefined; }
  if ((m = h.match(/^#\/load\/(\d+)$/))) return renderLoad(Number(m[1]));
  if ((m = h.match(/^#\/tally\/(\d+)\/(\d+|new)$/))) return renderTally(Number(m[1]), m[2] === "new" ? null : Number(m[2]));
  if (h === "#/new") return can("plan") ? renderLoadForm(null) : (location.hash = "#/register");

  if (h === "#/expenses") return canSeeExp() ? renderExpenses() : (location.hash = "#/");

  let L, allocs, lines, acts, files, costs = [], bill = null, pays = [], sets, tallies = [];
  try {
    [L, allocs, lines, acts, files, sets, tallies] = await Promise.all([
      q(sb.from("v_loads").select("*").eq("id", id).maybeSingle()),
      q(sb.from("v_allocations").select("*").eq("load_id", id).order("id")),
      q(sb.from("v_lines").select("*").eq("load_id", id).order("id")),
      q(sb.from("activity").select("*").eq("load_id", id).order("at", {ascending:false}).order("id", {ascending:false}).limit(300)),
      q(sb.from("load_files").select("*").eq("load_id", id).order("id")),
      q(sb.from("app_settings").select("*")),   // loading rules may have changed on another phone
      q(sb.from("load_tallies").select("*").eq("load_id", id).order("id"))
    ]);
    S.settings = Object.fromEntries(sets.map(x => [x.key, Number(x.value)]));
    if (canSeeExp()) costs = await q(sb.from("load_costs").select("*").eq("load_id", id).order("id"));

    return `<div class="alloc" ${chgA ? 'style="background:#fff7f6"' : ""}><div class="hd"><b class="grow">${esc(a.sawmill_name)}${a.sawmill_place ? `<span class="mut small">, ${esc(a.sawmill_place)}</span>` : ""}</b>${chgA ? `<span class="flag edited">Changed</span>` : ""}<span class="pill ${a.items_total && a.items_done === a.items_total ? "l-done" : "l-loading"}">${a.items_done}/${a.items_total} done</span></div>
      <div class="sub">Owner: ${esc(a.owner_name || "—")} · Party name: ${esc(a.party_name || "—")}</div>
      <div class="small" style="margin-bottom:6px">${a.reached_at ? `<span class="ok-pill">Truck reached · ${esc(dShort(a.reached_at))}</span>` : `<span class="na-pill">Truck not here yet</span>`} ${a.loading_done_at ? `<span class="ok-pill">Loading done · ${esc(dShort(a.loading_done_at))}${a.slip_net_weight_t ? " · slip " + esc(Number(a.slip_net_weight_t)) + " T" : ""}</span>` : ""}</div>
      ${!a.reached_at && !OWNER_STAGES.includes(L.truck_stage) && L.truck_stage !== "cancelled" ? `<button class="btn pri block" data-reached="${a.id}" style="margin-bottom:8px">Truck reached ${esc(a.sawmill_name)}</button>` : ""}
      ${tallies.filter(t => t.allocation_id === a.id).map(t => { const tt = tallyTotals(t.counts), chgT = freshIds.has("load_tallies:" + t.id);
        return `<div class="tally" ${chgT ? 'style="background:#fff7f6"' : ""}><div class="row"><b class="grow">Piece tally · ${esc(t.wood_type)}</b>${chgT ? `<span class="flag edited">Changed</span>` : ""}<a class="btn sm" href="#/tally/${a.id}/${t.id}" data-opentally="${t.id}">Open tally</a></div>
          <div class="small"><b class="num">${esc(cft2(tt.cft))} CFT</b> · ${esc(pcsTxt(tt.pcs))} pcs · ${esc(Object.keys(tt.th).sort((x, y) => x - y).map(thTxt).join(", "))} thick</div></div>`; }).join("")}
      ${its.length ? its.map(ln => {
        const chg = freshIds.has("load_lines:" + ln.id) || freshIds.has("line_prices:" + ln.id);
        return `<div class="item" ${chg ? 'style="background:#fff7f6"' : ""}><div class="row"><b class="grow">${esc(ln.wood_type)}${ln.dimensions ? ` <span class="mut small">${esc(ln.dimensions)}</span>` : ""}</b>${chg ? `<span class="flag edited">Changed</span>` : ""}${ln.tally_id ? `<span class="na-pill" style="margin-right:4px">From tally</span>` : ""}<span class="pill l-${ln.line_status}">${LINE_ST[ln.line_status]}</span></div>
          <div class="small"><b class="num">${esc(ln.tally_id ? cft2(ln.quantity) + " CFT" : qty(ln.quantity, ln.unit))}</b>${ln.pieces ? ` · ${esc(Number(ln.pieces).toLocaleString("en-IN"))} pcs` : ""} · ${esc(GRADES[ln.size_grade] || "Size not set")}${ln.length_ft ? " · " + esc(Number(ln.length_ft)) + " ft" : ""}${ln.loaded_on ? " · loaded " + esc(dDay(ln.loaded_on)) : ""}</div>
          ${ln.notes ? `<div class="small mut">${esc(ln.notes)}</div>` : ""}
          ${canSeeRates() ? `<div class="price">Purchase: ${ln.rate != null ? `<b class="num">${inr(ln.rate)}</b> per ${esc(ln.unit)}${Number(ln.adjustment) ? ` ${Number(ln.adjustment) < 0 ? "−" : "+"} ${inr(Math.abs(Number(ln.adjustment)))} adj.` : ""} = <b class="num">${inr(ln.amount)}</b>` : `<span class="mut">no rate yet</span>`} ${can("rates") ? `<button class="btn sm" data-rate="${ln.id}" style="margin-left:6px">${ln.rate != null ? "Change rate" : "Set rate"}</button>` : ""}</div>` : ""}
          <div class="row" style="margin-top:6px">${ln.line_status !== "done" ? `<button class="btn sm" data-done="${ln.id}">Mark done</button>` : ""}${ln.tally_id ? `<a class="btn sm" href="#/tally/${a.id}/${ln.tally_id}">Open tally</a>` : `<button class="btn sm" data-item="${ln.id}">Edit</button>`}</div></div>`;
      }).join("") : `<p class="small mut">No wood items yet.</p>`}
      <div class="row" style="margin-top:8px"><button class="btn sm ${a.reached_at ? "" : "pri"}" data-additem="${a.id}">+ Add wood item</button>${["loaded","in_transit","delivered","cancelled"].includes(L.truck_stage) ? "" : `<a class="btn sm" href="#/tally/${a.id}/new" data-newtally="${a.id}">+ Piece tally</a>`}${a.reached_at && !a.loading_done_at && its.length ? `<button class="btn sm pri" data-ldone="${a.id}">Loading done here + weigh slip</button>` : ""}<button class="btn sm" data-alloc="${a.id}">Edit sawmill</button></div></div>`;
  }).join("") : `<p class="mut small">No sawmills yet. Add each sawmill the truck loads from, then its wood items.</p>`;
  if (can("finance") && L.purchase_total != null) h += `<div class="tot big"><span>Purchase total</span><span class="num">${inr(L.purchase_total)}</span></div>`;
  h += `</div>`;

  // ---- step 3: staff PDF
  h += `<div class="card"><div class="sect"><h3><span class="stepno">3</span>Loading document</h3></div>
    <p class="small mut" style="margin-top:0">Truck loading / dispatch details as a PDF: sawmills, wood, size, quantity and unit. No rates, amounts, tax or payment details.</p>
    <button class="btn pri block" id="pdfBtn" ${lines.length ? "" : "disabled"}>Export Staff PDF</button>${lines.length ? "" : `<p class="small mut">Add the sawmills and wood items first.</p>`}</div>`;

  // ---- step 4: weigh slips per sawmill
  h += `<div class="card"><div class="sect"><h3><span class="stepno">4</span>Weigh slips</h3><span class="small mut">one per sawmill</span></div>
    ${slipRequired() ? `<p class="small mut" style="margin-top:0">Every sawmill needs its weigh slip before the truck can be marked Loaded.</p>` : ""}
    ${allocs.length ? allocs.map((a, i) => {
      const fs = files.filter(f => f.kind === "Weigh slip" && f.allocation_id === a.id);
      return `<div class="slip" data-slipfor="${a.id}"><div class="hd"><b class="grow">${i + 1}. ${esc(a.sawmill_name)}${a.slip_net_weight_t ? ` <span class="mut small">· net ${esc(Number(a.slip_net_weight_t))} T</span>` : ""}</b>${fs.length ? `<span class="ok-pill">${fs.length} uploaded</span>` : `<span class="na-pill">Not Uploaded</span>`}</div>
        ${fs.length ? `<div class="thumbs">${fs.map(f => `${fileTile(f)}`).join("")}</div>` : ""}
        <label class="btn sm" style="margin-top:8px" for="slip-${a.id}">Upload weigh slip for ${esc(a.sawmill_name)}</label>
        <input type="file" id="slip-${a.id}" data-alloc="${a.id}" accept="image/*,application/pdf" multiple hidden></div>`;
    }).join("") : `<p class="mut small">Weigh-slip sections appear here, one for each sawmill on this truck.</p>`}</div>`;

  // ---- expenses (expense / finance people only)
  if (canSeeExp()) {
    h += `<div class="card"><div class="sect"><h3>Freight and expenses</h3>${can("expenses") ? `<button class="btn sm" id="addExp">+ Add expense</button>` : ""}</div>
      ${costs.length ? costs.map(c => `<div class="tot"><span>${esc(c.cost_type)}${c.allocation_id ? `<span class="mut small"> · ${esc((allocs.find(a => a.id === c.allocation_id) || {}).sawmill_name || "sawmill")}</span>` : ""}${c.paid_to ? `<span class="mut small"> · ${esc(c.paid_to)}</span>` : ""}${c.receipt_path ? ` <a class="small" href="#" data-receipt="${esc(c.receipt_path)}">receipt</a>` : ""}${freshIds.has("load_costs:" + c.id) ? ' <span class="flag edited">Changed</span>' : ""}</span><span class="row"><span class="num">${inr(c.amount)}</span>${can("expenses") ? `<button class="btn sm" data-cost="${c.id}">Edit</button>` : ""}</span></div>`).join("") : `<p class="mut small">No freight or expenses recorded.</p>`}
      <div class="tot big"><span>Total</span><span class="num">${inr(L.costs_total || 0)}</span></div></div>`;
  }

  // ---- billing and payments (finance)
  if (can("finance")) {
    h += `<div class="card"><div class="sect"><h3>Billing</h3>${billPill(L.bill_stage)}<button class="btn sm" id="editBill">${bill ? "Edit bill" : "+ Create bill"}</button></div>`;
    if (bill) h += `<dl class="kv">${r("Invoice", esc((bill.invoice_no || "—") + (bill.invoice_date ? " · " + dDay(bill.invoice_date) : "")))}
      ${r("Sale", bill.sale_rate != null ? `<span class="num">${esc(qty(bill.sale_qty, bill.sale_unit))} × ${inr(bill.sale_rate)}</span>` : "—")}
      ${Number(bill.sale_adjustment) ? r("Adjustment", `<span class="num">${inr(bill.sale_adjustment)}</span>`) : ""}${Number(bill.gst_amount) ? r("GST", `<span class="num">${inr(bill.gst_amount)}</span>`) : ""}
      ${r("Invoice total", `<b class="num">${inr(L.invoice_total)}</b>`)}${r("Due date", esc(dDay(L.due_date)))}
      ${r("Received", `<span class="num">${inr(L.received || 0)}</span>`)}${r("Balance", `<b class="num" style="color:${Number(L.invoice_total || 0) - Number(L.received || 0) > 0 ? "var(--red)" : "var(--green)"}">${inr(Number(L.invoice_total || 0) - Number(L.received || 0))}</b>`)}</dl>`;
    else h += `<p class="mut small">${L.truck_stage === "delivered" ? "Delivered and ready to bill." : "Create the bill when the load is delivered."}</p>`;
    h += `<div class="sect" style="margin-top:12px"><h3>Payments on this load</h3><button class="btn sm" id="addPay">+ Record payment</button></div>
      ${pays.length ? `<table class="t">${pays.map(p => `<tr><td>${esc(dDay(p.paid_on))}<div class="tiny mut">${esc(p.party_kind === "buyer" ? "From " + partyName(p.party_id) : p.party_kind === "mill" ? "To " + millName(p.sawmill_id) : "To " + partyName(p.party_id))} · ${esc(MODES[p.mode])}${p.reference ? " · " + esc(p.reference) : ""}</div></td><td class="r num">${p.party_kind === "buyer" ? "+" : "−"}${inr(p.amount)}</td><td class="r"><button class="btn sm" data-pay="${p.id}">Edit</button></td></tr>`).join("")}</table>` : `<p class="mut small">No payments recorded.</p>`}</div>`;
  }

  // ---- other photos
  const others = files.filter(f => !["Driver with truck","Driving licence","C-Book / RC","Weigh slip"].includes(f.kind));
  h += `<div class="card"><div class="sect"><h3>Other photos and documents</h3></div>
    ${others.length ? `<div class="files">${others.map(f => `<div class="file">${fileTile(f)}<div class="cap"><b>${esc(f.kind)}</b>${freshIds.has("load_files:" + f.id) ? ' <span class="flag edited">New</span>' : ""}<div class="mut">${esc(dShort(f.created_at))} · ${esc(person(f.created_by))}</div>${isOwner() || f.created_by === S.user.id ? `<button class="btn sm red" style="margin-top:6px;width:100%" data-delfile="${f.id}">Remove</button>` : ""}</div></div>`).join("")}</div>` : `<p class="mut small">E-way bill, lorry receipt, loading photos.</p>`}
    <div class="row"><select class="in grow" id="fKind" aria-label="Photo type">${FILE_KINDS.map(k => `<option>${esc(k)}</option>`).join("")}</select><label class="btn" for="fPick" id="fPickBtn">+ Add photo</label></div>
    <input type="file" id="fPick" accept="image/*,application/pdf" hidden></div>`;

  // ---- updates and history
  h += `<div class="card"><div class="sect"><h3>Updates and history</h3></div>
    <form id="noteForm" class="row" style="margin-bottom:14px;align-items:flex-start"><textarea class="in grow" id="noteText" placeholder="Post an update (e.g. truck reached the sawmill, loading started)" style="min-height:50px"></textarea>
    <div style="display:grid;gap:6px"><button class="btn pri">Post</button>${can("finance") ? `<label class="tiny row" style="gap:4px"><input type="checkbox" id="noteAdmin"> Money only</label>` : ""}</div></form>
    ${acts.length ? acts.map(a => tlItem(a, since, lines, allocs)).join("") : `<p class="mut small">No history yet.</p>`}</div>`;
  h += `<div class="row" style="margin-bottom:12px"><a class="btn wa grow" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(waText(L, lines))}">Share on WhatsApp</a>${isOwner() ? `<button class="btn red" id="delLoad">Delete load</button>` : ""}</div>`;
  $("app").innerHTML = h;

  // ---------- actions
  const reload = () => { loadLoads(true); renderLoad(id); };
  const chk = $("chk"); if (chk) chk.onclick = async () => { try { await q(sb.rpc("v2_mark_checked", {p_load_ids:[id]})); toast("Marked as checked."); reload(); } catch(e) { toast(errText(e), true); } };
  const kataField = () => ({id:"net_weight_t", label:"Kata net weight (T), from the final weighbridge slip", type:"number", value:L.net_weight_t ?? "", min:0.001, hint: L.capacity_t ? "Truck capacity: " + Number(L.capacity_t) + " T" : ""});
  const stageRec = (target, v) => { const rr = {truck_stage: target, change_reason: v.change_reason}; if (target === "loaded" && v.net_weight_t !== undefined && v.net_weight_t !== "") rr.net_weight_t = num(v.net_weight_t); return rr; };
  const needsPhoto = t => photoRequired() && ["under_loading","loaded","in_transit","delivered"].includes(t) && !hasPhoto;
  const blockPhoto = () => { toast("Driver photo with truck is mandatory.", true); const m = $("photoMust"); if (m) m.scrollIntoView({behavior:"smooth", block:"center"}); };
  const moveTo = async target => {
    if (needsPhoto(target)) return blockPhoto();
    if (target === "under_loading" && !allocs.some(a => a.reached_at)) {   // Under loading starts only at a sawmill
      if (!allocs.length) return toast("Add the sawmill the truck has reached first.", true);
      const w = await sheet({title:"Which sawmill has the truck reached?", fields:[{id:"a", label:"Sawmill", type:"select", options:allocs.map(a => [a.id, a.sawmill_name])}], ok:"Next"});
      if (!w) return; return markReached(allocs.find(a => a.id === Number(w.a)));
    }
    if (target === "loaded" && slipRequired()) { const miss = allocs.filter(a => !files.some(f => f.kind === "Weigh slip" && f.allocation_id === a.id)); if (miss.length) return toast("Upload the weigh slip for: " + miss.map(a => a.sawmill_name).join(", "), true); }
    const v = await sheet({title: "Move to " + STAGE[target], intro: `From <b>${esc(STAGE[L.truck_stage])}</b> to <b>${esc(STAGE[target])}</b>.`, fields: target === "loaded" ? [kataField(), reasonField(true)] : [reasonField(true)], ok:"Move"});
    if (!v) return;
    try { await q(sb.from("loads").update(stageRec(target, v)).eq("id", id)); toast("Stage updated."); reload(); }
    catch(e) { toast(errText(e), true); }
  };
  const ns = $("nextStage"); if (ns) ns.onclick = () => moveTo(next[0]);
  $("setStage").onclick = async () => {
    const opts = [...stages, ...(can("plan") ? [["cancelled","Cancelled"]] : [])];
    const v = await sheet({title:"Change stage", fields:[{id:"stage", label:"New stage", type:"select", value:L.truck_stage, options:opts}, reasonField(true)], ok:"Change"});
    if (!v || v.stage === L.truck_stage) return;
    if (needsPhoto(v.stage)) return blockPhoto();
    if (v.stage === "under_loading" && !allocs.some(a => a.reached_at)) return moveTo("under_loading");
    if (v.stage === "loaded" && !L.net_weight_t) { const w = await sheet({title:"Kata net weight", intro:"Optional: leave empty if the slip is not here yet.", fields:[kataField()], ok:"Continue"}); if (!w) return; v.net_weight_t = w.net_weight_t; }
    try { await q(sb.from("loads").update(stageRec(v.stage, v)).eq("id", id)); toast("Stage updated."); reload(); } catch(e) { toast(errText(e), true); }
  };
  // documents
  document.querySelectorAll("input[data-kind]").forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { toast("Uploading…"); await uploadFile(id, f, inp.dataset.kind); toast(inp.dataset.kind + " saved."); reload(); } catch(e) { toast(errText(e), true); inp.value = ""; }
  });
  // truck reached a sawmill: record it; the first arrival starts Under loading
  const markReached = async a => {
    const v = await sheet({title:"Truck reached " + a.sawmill_name, intro:"Loading starts here. The truck moves to <b>Under loading</b>.", fields:[reasonField(false, "Truck reached " + a.sawmill_name)], ok:"Yes, truck is here"});
    if (!v) return;
    try {
      await q(sb.from("load_allocations").update({reached_at: new Date().toISOString(), change_reason: v.change_reason || "Truck reached " + a.sawmill_name}).eq("id", a.id));
      if (["going_to_load"].includes(L.truck_stage)) await q(sb.from("loads").update({truck_stage:"under_loading", change_reason: v.change_reason || "Truck reached " + a.sawmill_name}).eq("id", id));
      toast("Truck reached " + a.sawmill_name + "."); reload();
    } catch(e) { toast(errText(e), true); }
  };
  document.querySelectorAll("[data-reached]").forEach(b => b.onclick = () => markReached(allocs.find(a => a.id === Number(b.dataset.reached))));
  // loading finished at a sawmill: weigh slip (+ optional net weight), all its items done
  document.querySelectorAll("[data-ldone]").forEach(b => b.onclick = async () => {
    const a = allocs.find(x => x.id === Number(b.dataset.ldone)), its = lines.filter(x => x.allocation_id === a.id);
    const hasSlip = files.some(f => f.kind === "Weigh slip" && f.allocation_id === a.id);
    const v = await sheet({title:"Loading done · " + a.sawmill_name, intro:`${its.length} item(s) will be marked done with their current quantities. Edit any quantity first if it changed.`, fields:[
      {id:"slip", label: hasSlip ? "Another weigh slip (optional)" : "Weigh slip photo" + (slipRequired() ? "" : " (optional)"), type:"file", required: slipRequired() && !hasSlip},
      {id:"slip_net_weight_t", label:"Net weight on this slip (T, optional)", type:"number", value:a.slip_net_weight_t ?? "", min:0.001},
      reasonField(false, "Loading done at " + a.sawmill_name)], ok:"Save"});
    if (!v) return;
    try {
      if (v.slip) await uploadFile(id, v.slip, "Weigh slip", a.id);
      for (const ln of its.filter(x => x.line_status !== "done")) await q(sb.from("load_lines").update({line_status:"done", loaded_on: today(), change_reason: v.change_reason || "Loading done at " + a.sawmill_name}).eq("id", ln.id));
      await q(sb.from("load_allocations").update({loading_done_at: new Date().toISOString(), slip_net_weight_t: num(v.slip_net_weight_t), change_reason: v.change_reason || "Loading done at " + a.sawmill_name}).eq("id", a.id));
      toast("Loading done at " + a.sawmill_name + "."); reload();
    } catch(e) { toast(errText(e), true); }
  });
  // sawmills and items
  $("addAlloc").onclick = () => photoGate ? blockPhoto() : allocForm(L, null, reload);
  document.querySelectorAll("[data-alloc]").forEach(b => { if (b.tagName === "BUTTON") b.onclick = () => allocForm(L, allocs.find(a => a.id === Number(b.dataset.alloc)), reload); });
  document.querySelectorAll("[data-additem]").forEach(b => b.onclick = () => itemForm(allocs.find(a => a.id === Number(b.dataset.additem)), null, reload));
  document.querySelectorAll("[data-item]").forEach(b => b.onclick = () => { const ln = lines.find(x => x.id === Number(b.dataset.item)); itemForm(allocs.find(a => a.id === ln.allocation_id), ln, reload); });
  document.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => {
    const ln = lines.find(x => x.id === Number(b.dataset.done));
    if (ln.tally_id) {
      const w = await sheet({title:"Mark done · " + ln.sawmill_name, intro: esc(`${ln.wood_type} · ${GRADES[ln.size_grade] || ""} · ${cft2(ln.quantity)} CFT · ${pcsTxt(ln.pieces)} pcs (from the piece tally)`), fields:[reasonField(false, "Loading finished")], ok:"Mark done"});
      if (!w) return;
      try { await q(sb.from("load_lines").update({line_status:"done", loaded_on: today(), change_reason: w.change_reason || "Loading finished"}).eq("id", ln.id)); toast("Item done."); reload(); } catch(e) { toast(errText(e), true); }
      return;
    }
    const v = await sheet({title:"Mark done · " + ln.sawmill_name, intro: esc(ln.wood_type + (ln.dimensions ? " " + ln.dimensions : "")), fields:[{id:"quantity", label:"Final quantity (" + ln.unit + ")", type:"number", value:ln.quantity ?? "", required:true, min:0}, {id:"pieces", label:"Pieces (optional)", type:"number", value:ln.pieces ?? "", min:0, step:"1"}, {id:"loaded_on", label:"Loaded on", type:"date", value:ln.loaded_on || today()}, reasonField(false, "Loading finished at this sawmill")], ok:"Mark done"});
    if (!v) return;
    try { await q(sb.from("load_lines").update({line_status:"done", quantity:num(v.quantity), pieces: v.pieces === "" ? null : Math.round(num(v.pieces)), loaded_on:v.loaded_on || null, change_reason:v.change_reason || "Loading finished"}).eq("id", ln.id)); toast("Item done."); reload(); } catch(e) { toast(errText(e), true); }
  });
  document.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rateForm(L, lines.find(x => x.id === Number(b.dataset.rate)), reload));
  // PDF
  $("pdfBtn").onclick = async () => { const b = $("pdfBtn"); b.disabled = true; b.textContent = "Preparing PDF…"; try { await exportStaffPdf(L, allocs, lines, files, tallies); toast("PDF ready."); } catch(e) { toast(errText(e), true); } b.disabled = false; b.textContent = "Export Staff PDF"; };
  // weigh slips: each upload goes to its own sawmill
  document.querySelectorAll("input[data-alloc]").forEach(inp => inp.onchange = async () => {
    const list = [...inp.files]; if (!list.length) return;
    try { for (const f of list) await uploadFile(id, f, "Weigh slip", Number(inp.dataset.alloc)); toast(list.length > 1 ? list.length + " weigh slips saved." : "Weigh slip saved."); reload(); } catch(e) { toast(errText(e), true); inp.value = ""; }
  });
  // expenses
  const ax = $("addExp"); if (ax) ax.onclick = () => expenseForm(L, allocs, null, reload);
  document.querySelectorAll("[data-cost]").forEach(b => b.onclick = () => expenseForm(L, allocs, costs.find(x => x.id === Number(b.dataset.cost)), reload));
  document.querySelectorAll("[data-receipt]").forEach(a => a.onclick = async e => { e.preventDefault(); try { const u = await signedUrl(a.dataset.receipt); window.open(u, "_blank", "noopener"); } catch(er) { toast(errText(er), true); } });
  // money
  const eb = $("editBill"); if (eb) eb.onclick = () => billForm(L, bill, reload, lines);
  const ap = $("addPay"); if (ap) ap.onclick = () => payForm({load: L, lines}, null, reload);
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => payForm({load: L, lines}, pays.find(x => x.id === Number(b.dataset.pay)), reload));
  if (files.length) showFileLinks(files);
  $("fPick").onchange = async () => {
    const f = $("fPick").files[0]; if (!f) return;
    const btn = $("fPickBtn"); btn.textContent = "Uploading…";
    try { await uploadFile(id, f, $("fKind").value); toast("Photo saved."); reload(); } catch(e) { toast(errText(e), true); btn.textContent = "+ Add photo"; $("fPick").value = ""; }
  };

/* One history entry: exact time, who, the load's stage then, what changed, and why. */
function describe(a, lines){
  const ch = a.changes || {};
  const fmt = (k, v) => {
    if (v === null || v === undefined || v === "") return "—";
    if (k === "truck_stage") return STAGE[v] || v;
    if (k === "line_status") return LINE_ST[v] || v;
    if (k === "size_grade") return GRADES[v] || v;
    if (k === "sawmill_id") return millName(v);
    if (k === "party_id" || k === "transporter_id") return partyName(v);
    if (k === "mode") return MODES[v] || v;
    if (/amount|rate|adjustment|gst/.test(k)) return inr(v);
    if (/_at$/.test(k)) return dExact(v);
    if (/date|_on$/.test(k)) return dDay(v);
    return String(v);
  };
  const ent = ENTITY[a.entity] || a.entity;
  const lineLabel = () => { const ln = (lines || []).find(x => String(x.id) === String(a.entity_id)); return ln ? " (" + ln.sawmill_name + " · " + ln.wood_type + ")" : ""; };
  if (a.action === "note") return `<b>${esc(person(a.actor))}:</b> ${esc(a.reason)}`;
  if (a.action === "stage") return `Stage: <b>${esc(fmt("truck_stage", ch.truck_stage?.[0]))} → ${esc(fmt("truck_stage", ch.truck_stage?.[1]))}</b>` + Object.entries(ch).filter(([k]) => k !== "truck_stage").map(([k, v]) => `<br>${esc(FIELD[k] || k)}: ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join("");
  if (a.entity === "load_tallies") {
    const tt = c => { const t = tallyTotals(c); return `${cft2(t.cft)} CFT · ${pcsTxt(t.pcs)} pcs`; };
    if (a.action === "update") {
      const parts = [];
      if (ch.counts) parts.push(`${esc(tt(ch.counts[0]))} → <b>${esc(tt(ch.counts[1]))}</b>`);
      if (ch.wood_type) parts.push(`Wood: ${esc(fmt("wood_type", ch.wood_type[0]))} → <b>${esc(fmt("wood_type", ch.wood_type[1]))}</b>`);
      if (ch.notes) parts.push(`Notes: ${esc(fmt("notes", ch.notes[0]))} → <b>${esc(fmt("notes", ch.notes[1]))}</b>`);
      return "Piece tally changed:" + parts.map(x => "<br>" + x).join("");
    }
    return `${a.action === "insert" ? "Added" : "Removed"} piece tally${ch.wood_type ? " (" + esc(ch.wood_type) + ")" : ""}: <b>${esc(tt(ch.counts || {}))}</b>`;
  }
  if (a.action === "update") return `${esc(ent)}${a.entity === "load_lines" || a.entity === "line_prices" ? esc(lineLabel()) : ""} changed:` + Object.entries(ch).map(([k, v]) => `<br>${esc(FIELD[k] || k)}: ${esc(fmt(k, v[0]))} → <b>${esc(fmt(k, v[1]))}</b>`).join("");
  const keyBits = {loads: ["vehicle_no","truck_stage"], load_allocations:["sawmill_id","owner_name"], sawmill_rates:["sawmill_id","wood_type","rate","unit","effective_from"], load_lines:["sawmill_id","wood_type","size_grade","quantity","unit"], line_prices:["rate","adjustment"], load_costs:["cost_type","amount"], load_billing:["invoice_no","sale_rate","gst_amount"], payments:["party_kind","amount","mode"], load_files:["kind"]}[a.entity] || [];
  const bits = keyBits.filter(k => ch[k] !== undefined && !(k === "adjustment" && !Number(ch[k]))).map(k => k === "unit" ? "" : (k === "quantity" ? fmt(k, ch[k]) + " " + (ch.unit || "") : fmt(k, ch[k]))).filter(Boolean).join(" · ");
  return `${a.action === "insert" ? (a.entity === "load_files" ? "Uploaded" : "Added") : "Removed"} ${esc(ent.toLowerCase())}${a.entity === "line_prices" ? esc(lineLabel()) : ""}${bits ? ": <b>" + esc(bits) + "</b>" : ""}`;
}
function tlItem(a, since, lines, allocs){
  const isNew = since && a.at > since && a.actor !== S.user.id;
  return `<div class="tl ${isNew ? "new" : ""} ${a.action === "note" ? "note" : ""} ${a.visibility !== "all" ? "adm" : ""}"><div class="when">${avatar(a.actor)}<b>${esc(dExact(a.at))}</b> · ${esc(person(a.actor))} · ${stagePill(a.truck_stage)}</div>
    <div class="what">${describe(a, lines)}</div>${a.reason && a.action !== "note" ? `<div class="why">Reason: ${esc(a.reason)}</div>` : ""}</div>`;
}

async function shrink(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.75));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", {type:"image/jpeg"}) : file;
  } catch(e) { return file; }
}
async function uploadObject(original, folder){
  const file = await shrink(original);
  if (file.size > 10 * 1024 * 1024) throw new Error("File is bigger than 10 MB.");
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, file.type === "application/pdf" ? "pdf" : "jpg"])[1].toLowerCase();
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const up = await sb.storage.from(BUCKET).upload(path, file, {contentType:file.type || undefined, upsert:false});
  if (up.error) throw up.error;
  return path;
}
/* Upload a document to a load (optionally to one sawmill allocation, for weigh slips). */
async function uploadFile(loadId, original, kind, allocationId){
  const path = await uploadObject(original, `v2/${loadId}`);
  const file = {name: original.name, type: original.type};
  try { await q(sb.from("load_files").insert({load_id:loadId, allocation_id: allocationId || null, kind, storage_path:path, file_name:file.name, mime_type:/^image\//.test(file.type) ? "image/jpeg" : (file.type || null), size_bytes:original.size})); }
  catch(e) { await sb.storage.from(BUCKET).remove([path]); throw e; }
}
async function signedUrl(path){
  if (CFG.fileUrl) return CFG.fileUrl(path);
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if (error) throw error; return data.signedUrl;
}

    await loadMasters();   // size bands, grid and wood list may have changed on another phone
    A = await q(sb.from("v_allocations").select("*").eq("id", allocId).maybeSingle());
    if (A) L = await q(sb.from("v_loads").select("*").eq("id", A.load_id).maybeSingle());
    if (A && tallyId) T = await q(sb.from("load_tallies").select("*").eq("id", tallyId).eq("allocation_id", allocId).maybeSingle());
  } catch(e) { if (here() !== h0) return; $("app").innerHTML = `<div class="empty">${esc(errText(e))}</div>`; return; }
  if (here() !== h0) return;
  if (!A || !L || (tallyId && !T)) { $("app").innerHTML = `<div class="empty">This tally is not available to you, or it was removed.</div>`; return; }
  chrome("Piece tally · " + A.sawmill_name, {back:true, nav:"loads", sub: L.load_no + (L.vehicle_no ? " · " + L.vehicle_no : "")});
  const locked = ["loaded","in_transit","delivered","cancelled"].includes(L.truck_stage);
  const dk = "at3_tally_" + allocId + "_" + (tallyId || "new");
  const draft = locked ? null : lsGet(dk);
  let counts = JSON.parse(JSON.stringify((draft && draft.counts) || (T && T.counts) || {}));
  let th = String((draft && draft.th) || Object.keys((T && T.counts) || {}).sort((x, y) => x - y)[0] || "1");
  let active = null;
  const woods = [...new Set([...(T ? [T.wood_type] : []), ...S.woods])];
  const wood0 = (draft && draft.wood) || (T && T.wood_type) || (S.woods.includes("Mango") ? "Mango" : "");
  // grid: the owner's range, widened to any saved counts outside it
  const cells = Object.values(counts).flatMap(c => Object.keys(c)).map(k => k.split("|").map(Number));
  const lenMax = Math.max(Number(S.settings.tally_len_max_ft ?? 8.5), ...cells.map(c => c[0]));
  const wMin = Math.min(Number(S.settings.tally_width_min_in ?? 4), ...cells.map(c => c[1])), wMax = Math.max(Number(S.settings.tally_width_max_in ?? 11), ...cells.map(c => c[1]));
  const LENS = []; for (let x = 1.5; x <= lenMax + 1e-9; x += 0.25) LENS.push(Math.round(x * 100) / 100);
  const WS = []; for (let w = wMin; w <= wMax; w++) WS.push(w);
  const lo = Number(S.settings.size_small_below_ft ?? 3), hi = Number(S.settings.size_large_from_ft ?? 5);
  const rid = len => "rp-" + String(len).replace(".", "_");

  const gridHtml = () => {
    const cur = counts[th] || {};
    return `<table><thead><tr><th>Length</th>${WS.map(w => `<th>${w}"</th>`).join("")}<th>Pcs</th></tr></thead><tbody>${LENS.map(len => {
      let rp = 0;
      const tds = WS.map(w => { const n = Number(cur[len + "|" + w] || 0); rp += n; return `<td class="${n ? "has" : ""}"><input inputmode="numeric" pattern="[0-9]*" maxlength="5" data-k="${len}|${w}" value="${n || ""}" aria-label="${ftIn(len)} by ${w} inch" ${locked ? "disabled" : ""}></td>`; }).join("");
      return `<tr class="${len === lo || len === hi ? "band" : ""}"><th>${ftIn(len)}<small>${paperLen(len)}</small></th>${tds}<td class="rt" id="${rid(len)}">${rp ? pcsTxt(rp) : ""}</td></tr>`;
    }).join("")}</tbody></table>`;
  };
  const sumHtml = () => {
    const tt = tallyTotals(counts);
    const thLine = o => Object.keys(o.th).sort((x, y) => x - y).map(t => `${thTxt(t)} ${cft2(o.th[t].cft)}`).join(" · ");
    return `<h3>Total</h3><table class="t tsum"><tr><th>Size</th><th class="r">Pieces</th><th class="r">CFT</th></tr>
      ${["small","medium","large"].map(g => { const o = tt.size[g]; return `<tr><td><b>${GRADES[g]}</b> <span class="tiny mut">${esc(sizeBand(g))}</span>${o.pcs ? `<div class="tiny mut">${esc(thLine(o))}</div>` : ""}</td><td class="r num">${pcsTxt(o.pcs)}</td><td class="r num">${cft2(o.cft)}</td></tr>`; }).join("")}
      <tr><td><b>Total</b>${tt.pcs ? `<div class="tiny mut">${esc(thLine(tt))}</div>` : ""}</td><td class="r num"><b>${pcsTxt(tt.pcs)}</b></td><td class="r num"><b id="tTotal">${cft2(tt.cft)}</b></td></tr></table>
      <p class="small mut" style="margin-bottom:0">= ${(tt.cft / 35.3147).toLocaleString("en-IN", {minimumFractionDigits:2, maximumFractionDigits:2})} CBM (CFT ÷ 35.3147, as in the workbook). CFT = thickness × width × length × pieces ÷ 144.${locked ? "" : " Saving makes the Small, Medium and Large wood items for this sawmill, in CFT."}</p>`;
  };
  const chipsHtml = () => { const tt = tallyTotals(counts); return TALLY_TH.map(t => `<button class="chip" data-th="${t}" aria-pressed="${String(t) === th}">${t}" thick<span class="c">${tt.th[t] ? pcsTxt(tt.th[t].pcs) : 0}</span></button>`).join(""); };

  $("app").innerHTML = `${draft ? `<div class="banner amber"><span class="grow">Unsaved counts from this phone were brought back.</span><button class="btn sm" id="tDiscard">Discard</button></div>` : ""}
    ${locked ? `<div class="banner amber"><span class="grow">This load is ${esc(STAGE[L.truck_stage])}. The tally can be changed only after moving it back to Under loading.</span></div>` : ""}
    <div class="card"><label class="f" style="margin:0"><span>Wood</span><select class="in" id="tWood" ${locked ? "disabled" : ""}><option value="">— choose wood —</option>${woods.map(w => `<option ${w === wood0 ? "selected" : ""}>${esc(w)}</option>`).join("")}</select></label>
      <p class="small mut" style="margin:8px 0 0">Count each piece once: pick the thickness, then the box for its length (down) and width (across). A piece between two sizes goes under the smaller one.</p></div>
    <div class="chips" id="tTh" role="group" aria-label="Thickness">${chipsHtml()}</div>
    <div class="tgrid" id="tGrid">${gridHtml()}</div>
    ${locked ? "" : `<div class="tqa"><span class="cell" id="tCell">Tap a box, then type the count or add pieces.</span><button class="btn sm" data-add="-1" aria-label="Remove one">−1</button><button class="btn sm" data-add="1">+1</button><button class="btn sm" data-add="5">+5</button><button class="btn sm" data-add="10">+10</button></div>`}
    <div class="card" id="tSum">${sumHtml()}</div>
    ${locked ? "" : `<div class="card"><label class="f"><span>Notes (optional)</span><input class="in" id="tNotes" value="${esc((T && T.notes) || "")}"></label>
      <label class="f"><span>Reason for this entry${T ? " (required)" : ""}</span><input class="in" id="tReason" placeholder="${T ? "e.g. Recounted 2 inch pieces" : "e.g. Tally from the paper sheet"}"></label>
      <button class="btn pri block" id="tSave">${T ? "Save tally" : "Save tally and make wood items"}</button>
      ${T ? `<button class="btn red block" id="tDel" style="margin-top:8px">Remove this tally</button>` : ""}</div>`}`;

  const keep = () => lsSet(dk, {counts, th, wood: $("tWood").value, at: new Date().toISOString()});
  const refresh = () => { $("tSum").innerHTML = sumHtml(); const ch = $("tTh"); ch.innerHTML = chipsHtml(); bindChips(); };
  const label = k => { const [len, w] = k.split("|").map(Number); return `${ftIn(len)} long × ${w}" wide · ${th}" thick`; };
  const setCount = (k, n, inp) => {
    n = Math.max(0, Math.min(100000, Math.floor(Number(n) || 0)));
    counts[th] = counts[th] || {};
    if (n) counts[th][k] = n; else delete counts[th][k];
    if (!Object.keys(counts[th]).length) delete counts[th];
    if (inp) { inp.value = n || ""; inp.parentElement.classList.toggle("has", !!n); }
    const len = Number(k.split("|")[0]), cur = counts[th] || {};
    const rp = WS.reduce((a, w) => a + Number(cur[len + "|" + w] || 0), 0); const cell = $(rid(len)); if (cell) cell.textContent = rp ? pcsTxt(rp) : "";
    keep(); refresh();
  };
  const bindGrid = () => document.querySelectorAll("#tGrid input").forEach(inp => {
    inp.onfocus = () => { active = inp; const c = $("tCell"); if (c) c.textContent = label(inp.dataset.k); };
    inp.oninput = () => { const d = inp.value.replace(/\D/g, ""); if (d !== inp.value) inp.value = d; setCount(inp.dataset.k, d, inp); };
  });
  const bindChips = () => document.querySelectorAll("#tTh [data-th]").forEach(b => b.onclick = () => { th = b.dataset.th; active = null; $("tGrid").innerHTML = gridHtml(); bindGrid(); refresh(); keep(); const c = $("tCell"); if (c) c.textContent = "Tap a box, then type the count or add pieces."; });
  bindGrid(); bindChips();
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    if (!active || !document.body.contains(active)) return toast("Tap a box in the grid first.", true);
    setCount(active.dataset.k, Number(active.value || 0) + Number(b.dataset.add), active);
  });
  if (locked) return;
  $("tWood").onchange = keep;
  const dc = $("tDiscard"); if (dc) dc.onclick = () => { lsSet(dk, null); renderTally(allocId, tallyId); };
  $("tSave").onclick = async () => {
    const wood = $("tWood").value, reason = $("tReason").value.trim(), tt = tallyTotals(counts);
    if (!wood) return toast("Choose the wood.", true);
    if (!tt.pcs) return toast("Enter at least one piece.", true);
    if (T && !reason) return toast("Write the reason for the change.", true);
    const b = $("tSave"); b.disabled = true;
    const rec = {allocation_id: allocId, wood_type: wood, counts, notes: $("tNotes").value.trim() || null, change_reason: reason || "Piece tally entered"};
    try {
      if (T) await q(sb.from("load_tallies").update(rec).eq("id", T.id));
      else await q(sb.from("load_tallies").insert(rec));
      lsSet(dk, null); toast(`Tally saved: ${cft2(tt.cft)} CFT, ${pcsTxt(tt.pcs)} pieces.`); loadLoads(true); location.hash = "#/load/" + L.id;
    } catch(e) { b.disabled = false; toast(/duplicate|unique/i.test(String(e.message || e)) ? `${A.sawmill_name} already has a ${wood} tally on this truck. Open it from the load page.` : errText(e), true); }
  };
  const del = $("tDel"); if (del) del.onclick = async () => {
    const reason = $("tReason").value.trim();
    if (!reason) return toast("Write the reason for removing the tally.", true);
    if (!confirm(`Remove the ${T.wood_type} tally and its wood items from ${A.sawmill_name}?`)) return;
    try { await q(sb.from("load_tallies").update({change_reason: reason}).eq("id", T.id)); await q(sb.from("load_tallies").delete().eq("id", T.id)); lsSet(dk, null); toast("Tally removed."); loadLoads(true); location.hash = "#/load/" + L.id; }
    catch(e) { toast(errText(e), true); }
  };
}

/* =====================================================================
   Staff PDF: TRUCK LOADING / DISPATCH DETAILS
   Operational only. Built from an explicit list of non-money fields, so a
   rate, amount, tax, freight, expense or payment can never reach it.
   Columns: Sl. No. | Saw Mill Name | Name of Product | Size | Quantity | Unit
   ===================================================================== */
async function exportStaffPdf(L, allocs, lines, files, tallies){
  await loadJs(JSPDF_URL, () => window.jspdf && window.jspdf.jsPDF);
  await loadJs(AUTOTABLE_URL, () => window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const M = 12, W = 210 - 2 * M;
  const plain = t => String(t ?? "").replace(/[–—]/g, "-").replace(/×/g, "x").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x20-\x7E\n]/g, "");
  const dd = d => d ? new Date(String(d).length === 10 ? d + "T00:00:00+05:30" : d).toLocaleDateString("en-GB", {timeZone:"Asia/Kolkata"}).replace(/\//g, "-") : "-";
  const nf = v => v === null || v === undefined || v === "" ? "-" : Number(v).toLocaleString("en-IN", {maximumFractionDigits:3});
  const loadedOn = lines.map(x => x.loaded_on).filter(Boolean).sort().pop();
  const cap = [L.capacity_t ? nf(L.capacity_t) + " T" : "", L.capacity_cft ? nf(L.capacity_cft) + " CFT" : ""].filter(Boolean).join(" / ") || "-";
  const grid = {theme:"grid", styles:{font:"helvetica", fontSize:9, cellPadding:1.8, lineColor:[60, 60, 60], lineWidth:0.2, textColor:[20, 20, 20]}, margin:{left:M, right:M}};

  doc.setFont("helvetica", "bold"); doc.setFontSize(15);
  doc.text("TRUCK LOADING / DISPATCH DETAILS", 105, 15, {align:"center"});
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
  doc.text("Operational document - not a tax invoice", 105, 20, {align:"center"});

  // Header details (two columns of label / value)
  const left = [["Load reference", L.load_no], ["Document date", dd(today())], ["Loading date", dd(loadedOn || L.load_date)], ["Destination", [L.destination, L.destination_state].filter(Boolean).join(", ") || "-"]];
  const right = [["Truck number", L.vehicle_no || "-"], ["Truck capacity", cap], ["Driver name", L.driver_name || "-"], ["Kata net weight", L.net_weight_t ? nf(L.net_weight_t) + " T" : "-"]];
  doc.autoTable({...grid, startY:24, body:left.map((x, i) => [x[0], plain(x[1]), right[i][0], plain(right[i][1])]),
    columnStyles:{0:{fontStyle:"bold", cellWidth:32, fillColor:[244, 241, 236]}, 1:{cellWidth:W / 2 - 32}, 2:{fontStyle:"bold", cellWidth:32, fillColor:[244, 241, 236]}, 3:{cellWidth:W / 2 - 32}}});
  // Dispatch from / consignee
  const buyer = S.parties.find(p => p.id === L.party_id);
  const mills = allocs.map(a => a.sawmill_name + (a.sawmill_place ? " (" + a.sawmill_place + ")" : "")).join(", ");
  doc.autoTable({...grid, startY:doc.lastAutoTable.finalY + 3, head:[["Dispatch From (Consignor)", "Consignee / Party"]],
    headStyles:{fillColor:[27, 67, 50], textColor:255, fontStyle:"bold"},
    body:[[plain("ADITYA TRADERS\nLoaded at: " + (mills || "-")), plain(buyer ? [buyer.name, [buyer.city, buyer.state].filter(Boolean).join(", ")].filter(Boolean).join("\n") : (L.party_name || "-"))]],
    columnStyles:{0:{cellWidth:W / 2}, 1:{cellWidth:W / 2}}});

  // Item table — Sl. No. first, Saw Mill Name second. Same sawmill may repeat on several rows.
  const rows = [];
  allocs.forEach(a => lines.filter(x => x.allocation_id === a.id).forEach(x => {
    const product = [x.wood_type, x.dimensions, x.length_ft ? nf(x.length_ft) + " ft long" : "", x.pieces ? nf(x.pieces) + " pcs" : ""].filter(Boolean).join(" - ");
    rows.push([String(rows.length + 1), plain(a.sawmill_name + (a.owner_name ? "\nOwner: " + a.owner_name : "")), plain(product), GRADES[x.size_grade] || "-", x.tally_id ? cft2(x.quantity) : nf(x.quantity), x.unit]);
  }));
  doc.autoTable({...grid, startY:doc.lastAutoTable.finalY + 3, showHead:"everyPage",
    head:[["Sl. No.", "Saw Mill Name", "Name of Product / Wood Details", "Size", "Quantity", "Unit"]],
    headStyles:{fillColor:[27, 67, 50], textColor:255, fontStyle:"bold", halign:"center"},
    body:rows,
    columnStyles:{0:{cellWidth:17, halign:"center"}, 1:{cellWidth:45}, 2:{cellWidth:65}, 3:{cellWidth:19, halign:"center"}, 4:{cellWidth:22, halign:"right"}, 5:{cellWidth:18, halign:"center"}}});

  // Piece tally summary (operational numbers only): CFT and pieces by size and thickness
  if ((tallies || []).length) {
    const trow = [];
    tallies.forEach(t => {
      const a = allocs.find(x => x.id === t.allocation_id) || {}, tt = tallyTotals(t.counts);
      const cell = (o, k) => o.th[k] ? nf(Math.round(o.th[k].cft * 100) / 100) + " CFT\n" + nf(o.th[k].pcs) + " pcs" : "-";
      Object.keys(tt.th).sort((x, y) => x - y).forEach(k => trow.push([plain(a.sawmill_name || ""), plain(t.wood_type), k + '"', cell(tt.size.small, k), cell(tt.size.medium, k), cell(tt.size.large, k), nf(Math.round(tt.th[k].cft * 100) / 100) + " CFT\n" + nf(tt.th[k].pcs) + " pcs"]));
      trow.push([{content: plain((a.sawmill_name || "") + " - " + t.wood_type + ", all thicknesses"), colSpan:3, styles:{fontStyle:"bold"}}, ...["small", "medium", "large"].map(g => tt.size[g].pcs ? nf(Math.round(tt.size[g].cft * 100) / 100) + " CFT\n" + nf(tt.size[g].pcs) + " pcs" : "-"), {content: nf(Math.round(tt.cft * 100) / 100) + " CFT\n" + nf(tt.pcs) + " pcs", styles:{fontStyle:"bold"}}]);
    });
    doc.autoTable({...grid, startY:doc.lastAutoTable.finalY + 3, showHead:"everyPage",
      head:[[{content: plain("Piece tally - Small " + sizeBand("small") + ", Medium " + sizeBand("medium") + ", Large " + sizeBand("large")), colSpan:7, styles:{halign:"left"}}],
            ["Saw Mill Name", "Wood", "Thick", "Small", "Medium", "Large", "All sizes"]],
      headStyles:{fillColor:[27, 67, 50], textColor:255, fontStyle:"bold", halign:"center"},
      body:trow,
      columnStyles:{0:{cellWidth:38}, 1:{cellWidth:24}, 2:{cellWidth:14, halign:"center"}, 3:{cellWidth:27, halign:"right"}, 4:{cellWidth:27, halign:"right"}, 5:{cellWidth:27, halign:"right"}, 6:{cellWidth:29, halign:"right"}}});
  }
  // Operational summary: quantity per unit (units are never added together), weigh slips, remarks
  const byUnit = {}; lines.forEach(x => { if (x.quantity != null) byUnit[x.unit] = (byUnit[x.unit] || 0) + Number(x.quantity); });
  const slips = allocs.map(a => { const n = files.filter(f => f.kind === "Weigh slip" && f.allocation_id === a.id).length; return a.sawmill_name + ": " + (n ? n + " uploaded" : "not uploaded") + (a.slip_net_weight_t ? " (net " + nf(a.slip_net_weight_t) + " T)" : ""); }).join("; ");
  doc.autoTable({...grid, startY:doc.lastAutoTable.finalY + 3,
    body:[["Quantity by unit", plain(Object.keys(byUnit).sort().map(u => nf(byUnit[u]) + " " + u).join(" + ") || "-")],
          ["Weigh slips", plain(slips || "-")],
          ["Driver photo", files.some(f => f.kind === "Driver with truck") ? "On record" : "Not Provided"],
          ["Remarks", plain(L.notes || "-")]],
    columnStyles:{0:{fontStyle:"bold", cellWidth:36, fillColor:[244, 241, 236]}, 1:{cellWidth:W - 36}}});

  // Footer: prepared by and signatures
  doc.autoTable({...grid, startY:doc.lastAutoTable.finalY + 6, head:[["Prepared by", "Driver acknowledgement", "Loading confirmation"]],
    headStyles:{fillColor:[244, 241, 236], textColor:20, fontStyle:"bold"},
    body:[[plain((S.me.full_name || "") + "\n" + dExact(new Date().toISOString())), "\n\n\nSignature", "\n\n\nSignature"]],
    bodyStyles:{minCellHeight:24}, columnStyles:{0:{cellWidth:W / 3}, 1:{cellWidth:W / 3}, 2:{cellWidth:W / 3}}});

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(110); doc.text(plain(`Aditya Traders - ${L.load_no} - page ${i} of ${n}`), 105, 290, {align:"center"}); }
  doc.save(`${L.load_no}_loading_details.pdf`);
}
/* WhatsApp message asking the driver for his live location (idea from the Grok build). */
function locText(L){
  return `Namaskaram ${L.driver_name || ""}, Aditya Traders here. Please share your live location on WhatsApp for truck ${L.vehicle_no || ""} (${L.load_no})${L.destination ? " going to " + L.destination : ""}. Thank you.`.replace(/\s+/g, " ");
}
function waText(L, lines){
  const out = [`*Aditya Traders · ${L.load_no}*`, `Stage: ${STAGE[L.truck_stage]}`];
  if (L.vehicle_no) out.push(`Truck: ${L.vehicle_no}${L.capacity_t ? " (" + Number(L.capacity_t) + " T)" : ""}`);
  if (L.driver_name || L.driver_phone) out.push(`Driver: ${[L.driver_name, L.driver_phone].filter(Boolean).join(", ")}`);
  if (L.party_name) out.push(`Buyer: ${L.party_name}${L.destination ? ", " + L.destination : ""}`);
  (lines || []).forEach(ln => out.push(`• ${ln.sawmill_name}: ${ln.wood_type}${ln.size_grade ? " " + GRADES[ln.size_grade] : ""} ${qty(ln.quantity, ln.unit)}${ln.pieces ? " (" + ln.pieces + " pcs)" : ""} (${LINE_ST[ln.line_status]})`));
  if (L.net_weight_t) out.push(`Kata net weight: ${Number(L.net_weight_t)} T`);
  if (L.eway_bill_no) out.push(`E-way bill: ${L.eway_bill_no}`);
  out.push(`Updated: ${dExact(L.last_at || L.created_at)}`);
  return out.join("\n");
}

/* =====================================================================
   New / edit load

  if (register) await loadMasters();
  if (here() !== h0) return;   // the owner may have changed the photo rule on another phone
  chrome(id ? "Edit load" : register ? "Register truck" : "New load (planning)", {back:true, nav:"loads"});
  let L = null;
  if (id) { try { L = await q(sb.from("loads").select("*").eq("id", id).maybeSingle()); if (here() !== h0) return; } catch(e) { $("app").innerHTML = `<div class="empty">${esc(errText(e))}</div>`; return; } if (!L) { $("app").innerHTML = `<div class="empty">This load is not available to you, or it was deleted.</div>`; return; } }

     <div class="thumbs" style="justify-content:center" id="reg-${key}-prev"></div>
     <label class="btn sm ${must ? "pri" : ""}" for="reg-${key}-in">${must ? "Take photo" : "Upload"}</label>
     <input type="file" id="reg-${key}-in" accept="image/*${must ? "" : ",application/pdf"}" ${must ? 'capture="environment"' : ""} hidden></div>`;
  $("app").innerHTML = `<form id="lf" novalidate>
   <div class="card"><h3>${register ? '<span class="stepno">1</span>Truck and driver details' : "Truck"}</h3>

       <p class="small mut">${photoRequired() ? "Driving licence and C-Book are optional. The driver photo is compulsory." : "All three are optional. Add them if you have them."}</p>` : ""}
   </div>
   ${register ? "" : `<div class="card"><h3>Party and destination</h3>
     <label class="f"><span>Party / consignee (buyer)</span>${sel("party_id", buyers, L.party_id, p => p.name + (p.city ? ", " + p.city : ""))}</label>
     <div class="two"><label class="f"><span>Destination</span><input class="in" name="destination" value="${esc(L.destination || "")}"></label>
