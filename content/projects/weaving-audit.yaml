title: Weaving production intelligence
kind: factory
also_in: [lab]         # the public repo is also an open case study
status: prototype      # the repo calls it a "working prototype"
featured: true         # the banner on the Factory page
order: 1
client: A ribbon manufacturer (employer)
period: Jan–Aug 2026 data
updated: 2026-09-30
summary: >-
  Eight months of hand-kept weaving workbooks that disagreed with each other, rebuilt
  into one reconciled record, a PostgreSQL platform and a dashboard the plant can read.
why: >-
  Management couldn't answer how much was made, against what target, by which loom and
  shift. Overwritten stop reasons and line counts hid how much each breakdown cost.
highlights:
  - Walked every production floor and read the logs before opening a spreadsheet
  - Found metres switched to yards mid-year, gross switched to net, and a formula silently zeroing output
  - Rebuilt the record at one grain, loom × day × shift, with a confidence label on every row
  - Logged every correction with its effect in yards, in an audit trail
  - Built a PostgreSQL platform with validating ETL, 16 views and an 8-screen dashboard
  - Added a Telugu and English floor board for the shift supervisors
my_role: "Sole engineer: audit, data model, ETL, tests and dashboard"
stack: [Python, SQL, PostgreSQL, Streamlit, Plotly, pandas]
tags: [data audit, reconciliation, star schema, idempotent ETL, manufacturing]

