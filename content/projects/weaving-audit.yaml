flow:
  - Clerk's monthly Excel workbooks
  - Validate and reshape in Python
  - Audit trail of every fix
  - PostgreSQL, 16 views
  - Dashboard and Telugu floor board

case_study:
  problem: >-
    Weaving production for 70 looms lived in hand-kept monthly Excel workbooks, and they
    disagreed. Units changed from metres to yards in April without conversion, the basis
    changed from gross to net in mid-April, line counts were overwritten as the month went
    on, and a formula fault silently zeroed real production. Nobody could say how much
    breakdown each machine had caused, or why, so the MD's questions about the worst shift,
    the worst loom and how much was recoverable had no answer.
  steps:
    - >-
      Started on the floor: visited every production floor, read the logs and SOPs, and
      talked to the heads of department before opening a spreadsheet.
    - >-
      Audited forensically: rebuilt each month by back-solving line counts from the sheets'
      own arithmetic, recovered production the formulas had zeroed, and logged every
      correction with its effect in yards.
    - >-
      Re-modelled eight months into one grain, loom × day × shift: 29,531 rows, each with a
      confidence label.
    - >-
      Built a first version to learn what the MD's questions really needed, then a second
      on PostgreSQL with a validating ETL, 16 views, 66 automated checks and an 8-screen
      dashboard, because the first couldn't be run every day.
    - >-
      Fixed the source: a shift-wise entry workbook that flags impossible readings, and a
      paper log in English and Telugu that records stop time, restart time and a reason.
  decisions:
    - choice: Long format before any chart
      why: >-
        Wide sheets can't be totalled by machine, shift or reason without copying formulas,
        which is how the errors got in. With one row per machine-shift, every question
        becomes a simple group-by.
    - choice: An audit trail instead of silent fixes
      why: >-
        Each corrected number traces back to the cell it came from, so the department can
        check the work rather than take it on trust.
    - choice: Reloading a month replaces it
      why: >-
        The load is idempotent: running it again after a correction replaces that month
        instead of adding to it, so nothing is ever counted twice.
    - choice: Say what the data can't say
      why: >-
        Downtime can't be measured from a once-a-day meter reading, so the dashboard says
        so instead of guessing.
  outcome: >-
    The rebuilt record reproduces 43,645,373 yards for January to August exactly, and
    February matches the plant's own summary on all 24 days. I suspected the targets were
    unreachable; they weren't. 18% of the shortfall is target-setting and 82% is machines
    not running. Changeovers were priced for the first time: across 83 dated events, about
    476,916 yards over the event day and the day before.
  next: >-
    Daily use on the plant's network, and the stoppage log feeding real downtime reasons
    into the dashboard.
