title: Sri Ratna's Homoeo Clinic — website & booking
kind: client
status: delivered
featured: true
order: 2
client: Sri Ratna's Homoeo Clinic, Anakapalle & Yelamanchili
updated: 2026-10-31
why: >-
  Patients booked by phone, often when the clinic was busy. A website gives them hours,
  both branches and online booking in one place, any time of day.
summary: >-
  Live website for a two-branch homoeopathy clinic on its own domain, with online
  hourly-slot booking stored in Postgres, a staff dashboard and a waiting-room TV view.
  The WhatsApp booking bot is built and goes live once Meta approves the business.
highlights:
  - Online booking for both branches, with hourly slots saved in Postgres (Supabase)
  - Staff dashboard with Google sign-in, a waiting-room TV view and branch holiday closures
  - WhatsApp Cloud API bot on the same booking logic, built and tested; waiting on Meta's verification
  - Live "open now" status for both branches, plus FAQ, feedback and privacy pages
  - Copy kept within homoeopathy advertising rules, with no cure claims or patient testimonials
my_role: Discovery, design and build
stack: [Astro, Tailwind CSS, Supabase (Postgres), WhatsApp Cloud API, Vercel]
tags: [client work, healthcare, booking, WhatsApp]
