case_study:
  problem: >-
    The trader sends 30 and 35-ton trucks from sawmills in Andhra Pradesh to buyers in
    Rajasthan. One truck often loads at two or three sawmills. Staff counted pieces on paper,
    someone typed the counts into an Excel workbook for the CFT, and freight, rates and payments
    lived with the owner. Staff, owner and accountant phoned each other for every detail, and a
    change made in the morning was easy to miss by the evening.
  steps:
    - >-
      Interviewed the owner and staff about how wood is counted, tallied, weighed, loaded and paid
      for, and wrote it down as a calculation and process spec before building anything.
    - >-
      Modelled one truck trip with several sawmills, each with its own wood items, weigh slips and
      charges, and the stages from Planning to Delivered.
    - >-
      Put every rule in Supabase Postgres: row-level security, per-person permission flags,
      triggers for stage rules and history, and views that return blank money columns to staff.
    - >-
      Built the app as one phone-first HTML file, with a compulsory driver photo, arrival at the
      sawmill before Under loading, a weigh slip per sawmill, and a loading PDF without money.
    - >-
      Took the CFT formula from the owner's Excel workbook and moved it into the database, then
      typed the workbook's own counts in to prove the totals match to the cent.
    - >-
      Tested it as each person: 181 database checks and 92 browser checks on a phone-sized screen,
      plus a public demo whose sample data was made through the real rules.
  decisions:
    - choice: Rules in the database, not only on the screen
      why: >-
        Hiding a button is not security. Staff phones never receive a rate, freight or payment,
        even if someone calls the API directly.
    - choice: Piece tally computed in Postgres
      why: >-
        The CFT can't drift between phones, and it matches the workbook the owner already trusts,
        without copying the workbook's two formula mistakes.
    - choice: One shared owner login
      why: >-
        Aditya and Bharat run the business together and asked for one owner profile. Permission
        flags make it easy to give rates or freight to someone else later.
  outcome: >-
    Live since 27 Nov 2026 on a shared database, with trial logins for the owner, the accountant
    and staff.
  next: >-
    Confirm the PDF fields, the weigh-slip weights and the rate basis with the owner, then move
    from trial logins to daily use.
