title: TimberTrack — timber trucking operations app
kind: client
also_in: [lab]
status: delivered
order: 1
client: Aditya Traders, a timber trader in Andhra Pradesh
period: Nov 2026
updated: 2026-11-27
why: >-
  One truck loads at several sawmills, pieces are counted on paper and typed into Excel later,
  and money must stay with the owner. One shared record replaces the phone calls between staff,
  owner and accountant.
summary: >-
  A phone-first app for a trader who trucks wood from Andhra Pradesh sawmills to buyers in
  Rajasthan. Staff register trucks, sawmills, piece tallies and weigh slips; the owner enters
  rates and freight; the accountant bills and tracks payments.
highlights:
  - One truck, several sawmills, several wood items each; units never mixed
  - Piece tally works out CFT exactly as the owner's Excel workbook (1,350.00 CFT to the cent)
  - Compulsory driver photo, and a weigh slip for every sawmill before a truck is Loaded
  - Loading PDF for staff with no rates, amounts, GST or freight in it
  - Money rules enforced in Postgres, so a staff phone never receives a rate or a payment
  - Every change keeps who, when, why and the stage, with red flags per person
my_role: Discovery, design, build and tests
stack: [Supabase (Postgres, Auth, Storage, Edge Functions), JavaScript, jsPDF, SheetJS, Python, Playwright]
tags: [client work, logistics, operations, Supabase, row-level security]
