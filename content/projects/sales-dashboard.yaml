title: Sales & order-to-cash analytics
kind: factory
also_in: [lab]
status: implemented
order: 2
client: A ribbon and bow manufacturer (employer)
period: Jan 2025 – Sep 2026 data
updated: 2026-10-01
summary: >-
  One trusted view of orders, sales, the open order book and on-time delivery, built from
  three Excel sources that disagreed, with every KPI defined, tested and reconciled to the
  accounts report.
why: >-
  Management couldn't say from one place how much was sold, to whom, what was still open
  and whether deliveries were on time. Stock transfers looked like sales, and charges were
  easy to double count.
highlights:
  - Linked 22,615 invoice lines to 20,241 order lines, with 0 left unmatched
  - Compares every period two ways, against the previous period and the same days last year
  - Defined each KPI once and tested it in two implementations that must agree
  - States what the data covers (80% of the accounts report) instead of hiding it
  - Customers and staff are aliased so the real data can be shown in public
my_role: Built it end to end, from number definitions to the live dashboard
stack: [Python, pandas, JavaScript, Plotly, pytest]
tags: [sales analytics, reconciliation, KPI definitions]

# What the dashboard surfaced for management. Findings, not my own results.
metrics:
  - value: "72%"
    label: of sales from the top 3 customers, a risk it surfaced
    evidence: sales-analytics-dashboard README, Key insights (top 3 customers = 72 %).
  - value: "58%"
