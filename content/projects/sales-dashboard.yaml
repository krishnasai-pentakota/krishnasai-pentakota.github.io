    evidence: sales-analytics-dashboard README, Key insights (on-time 58 % in September).
  - value: "₹20.3 L"
    label: of the open order book past its promised date
    evidence: sales-analytics-dashboard README, Key insights (₹20.3 L past the promised date).
  - value: "34"
