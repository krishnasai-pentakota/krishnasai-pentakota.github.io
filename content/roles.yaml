# The five tiles on the opening screen, in the order they appear.
# Each one opens its own page: factory.html, hire.html, client.html, lab.html, studio.html.
# icon: loom | badge | briefcase | flask | clapper      color: the tile's colour
# photos: one or two photos for the tile (under static/), each with the photographer's name and
#         the photo's page. Two photos = the tile slowly cross-fades between them.
#         All are free to use under the Unsplash License (never Unsplash+).

- id: factory
  name: Factory
  tagline: Systems I built inside a ribbon plant
  intro: >-
    I work inside a ribbon manufacturer as its only AI and data engineer: weaving, stores,
    sales and accounts. These are the systems I've built there, with the dashboards and the
    numbers behind them.
  icon: loom
  color: "#C6F36B"
  photos:
    - src: img/roles/factory.webp
      credit: Mick Haupt
      link: https://unsplash.com/photos/a-close-up-of-a-colorful-weaving-machine-5EUy6c3e1bM

- id: hire
  name: Hire me
  tagline: Resume, cover letter and profiles
