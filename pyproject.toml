[project]
name = "portfolio"
version = "0.1.0"
description = "Pentakota Krishna Sai's portfolio: validated content built into a static site"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Only functions named test_* are tests. Without this, pytest tries to collect
# the `Testimonial` model because its name starts with "Test".
python_classes = []
