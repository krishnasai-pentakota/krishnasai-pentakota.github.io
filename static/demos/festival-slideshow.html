:root {
  /* Layout: a fixed 1920x1080 stage scaled to fit the projector; a marigold garland frames the top,
     content sits in a 110px safe area, a ribbon progress strip runs along the bottom edge. */
  --ivory: #fff3dc;
  --ivory-soft: rgba(255, 243, 220, .80);
  --ivory-faint: rgba(255, 243, 220, .55);
  --gold-1: #fff6d6;
  --gold-2: #f2c25a;
  --gold-3: #b9832b;
  --marigold: #f7a224;
  --ground-glow: #7d1426;
  --ground: #4c0a17;
  --ground-edge: #170308;
  --accent: #f7a224;
  --stitch: rgba(255, 226, 160, .55);
  --f-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --f-script: "Great Vibes", "Segoe Script", "Brush Script MT", cursive;
  --f-body: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-te: "Noto Sans Telugu", "Poppins", "Nirmala UI", "Gautami", sans-serif;
  --f-te-display: "Ramabhadra", "Noto Sans Telugu", "Nirmala UI", "Gautami", sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: #0c0205; color: var(--ivory); overflow: hidden; font-family: var(--f-body); }
[hidden] { display: none !important; }

.app { height: 100%; box-sizing: border-box; }
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0c0205; outline: none; }
#viewport.idle { cursor: none; }
#viewport:fullscreen { background: #000; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: 50% 50%; overflow: hidden; background: #12030a;
  font-family: var(--f-body); color: var(--ivory);
}
#stage canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
#bg { z-index: 1; }
.grounds { position: absolute; inset: 0; z-index: 0; }
.ground {
  position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease;
  background: radial-gradient(ellipse 72% 62% at 50% 44%, var(--gg) 0%, var(--g) 48%, var(--ge) 100%);
}
.ground.on { opacity: 1; }
.no-motion .ground { transition: none; }
.weave {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background:
    repeating-linear-gradient(45deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 8px),
    repeating-linear-gradient(-45deg, rgba(0, 0, 0, .07) 0 2px, transparent 2px 8px);
}
#slides { position: absolute; inset: 0; z-index: 3; }
#fx { z-index: 4; }
#chrome { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
#wipe { z-index: 6; }

.slide { position: absolute; inset: 0; }
.slide p, .slide h1, .slide h2 { margin: 0; }
.slide, .slide * { box-sizing: border-box; }

/* ---------- shared type ---------- */
.gold-text {
  background: linear-gradient(180deg, var(--gold-1) 0%, #f6cf6a 40%, #d99b34 70%, #fbe3a0 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .5));
  text-shadow: none !important;
}
.te { font-family: var(--f-te); font-weight: 600; }
.shadowed, .slide p, .slide h2 { text-shadow: 0 3px 16px rgba(0, 0, 0, .45); }
.eyebrow {
  font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .28em;
  text-transform: uppercase; color: var(--marigold); display: flex; align-items: center; gap: 18px;
}
.eyebrow::before { content: ""; width: 64px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold-2)); }
.h-title { font-weight: 700; font-size: 64px; line-height: 1.12; letter-spacing: -.005em; text-wrap: balance; color: var(--ivory); }
.te-sub { font-size: 36px; color: var(--ivory-soft); line-height: 1.4; }

.title-block { position: absolute; left: 110px; top: 160px; width: 1240px; display: flex; flex-direction: column; gap: 14px; }

/* ---------- logo plaques ---------- */
.plaque {
  display: flex; align-items: center; gap: 34px; padding: 26px 40px;
  background: linear-gradient(160deg, #ffffff 0%, #fdf8ee 55%, #f5e8cc 100%);
  border-radius: 24px;
  box-shadow: 0 0 0 3px #d9a646, 0 0 0 9px rgba(217, 166, 70, .22), 0 22px 50px rgba(0, 0, 0, .5);
}
.plaque img { display: block; height: var(--logo-h, 120px); width: auto; max-width: none; }
.plaque-div { width: 2px; align-self: stretch; background: linear-gradient(180deg, transparent, #d9a646, transparent); }
.plaque-hero { position: absolute; left: 0; right: 0; top: 270px; margin-inline: auto; width: max-content; --logo-h: var(--logo-hero); }

/* ---------- diyas ---------- */

  25% { transform: scale(.94, 1.07) skewX(2.5deg); }
  55% { transform: scale(1.05, .95) skewX(-2deg); }

}

.controls {
  position: absolute; z-index: 10; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 14px;
  background: rgba(20, 6, 10, .72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 0 0 1px rgba(255, 226, 160, .18), 0 10px 30px rgba(0, 0, 0, .45);
  transition: opacity .35s, transform .35s; font: 500 13px/1 "Poppins", "Segoe UI", system-ui, sans-serif; color: #fff3dc;
}

.controls button {
  appearance: none; border: 0; background: transparent; color: inherit; width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; padding: 0;
}

.pill {
  position: absolute; z-index: 10; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  padding: 9px 16px; border-radius: 999px; background: rgba(20, 6, 10, .78); color: #fff3dc;
  font: 500 14px/1.2 "Poppins", "Segoe UI", system-ui, sans-serif; box-shadow: 0 0 0 1px rgba(255, 226, 160, .25);
  white-space: nowrap;
}
@media (max-width: 720px) {
  .controls .keys, .controls .sep.k { display: none; }
  .controls button { width: 36px; height: 36px; }
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
/* Dussehra Bonus slideshow.
   One engine plays the deck(s) back to back. Each deck's words, numbers,
   names, logos and colours arrive as JSON in #deck-data, so nothing is typed into the layout. */
(function () {
  'use strict';

  const SHOW = JSON.parse(document.getElementById('deck-data').textContent);
  const DECKS = SHOW.decks;
  const W = 1920, H = 1080, TAU = Math.PI * 2;
  const A = window.anime || null;
  const reduceQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  let motion = !!A && !reduceQuery.matches;

  /* ---------------------------------------------------------------- helpers */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeIn = (t) => t * t * t;
  const rgb = (hex) => { const v = parseInt(hex.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Indian digit grouping: 121576 -> 1,21,576
  function groupIN(n) {
    const s = String(Math.round(n));
    if (s.length <= 3) return s;
    let rest = s.slice(0, -3);
    const parts = [];
    while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
    if (rest) parts.unshift(rest);
    return parts.join(',') + ',' + s.slice(-3);
  }
  const inr = (n) => '₹' + groupIN(n);
  const stagger = (ms) => (motion && A ? A.stagger(ms) : 0);

  /* ------------------------------------------------- 3D satin ribbon renderer
     A ribbon is a centre line path(s, t) for s in [0, 1], a width, and a twist angle around
     that centre line. Each slice is projected (its visible width shrinks as it turns edge-on)
     and lit with a diffuse + specular model, which is what makes flat strips read as satin. */
  const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]); return v.map((x) => x / l); };
  const LIGHT = norm3([-0.42, -0.62, 0.66]);
  const HALF = norm3([LIGHT[0], LIGHT[1], LIGHT[2] + 1]);
  const c255 = (v) => (v < 0 ? 0 : v > 255 ? 255 : v | 0);

  function drawRibbon(ctx, R, t) {
    const from = R.from == null ? 0 : R.from;
    const to = R.to == null ? 1 : R.to;
    const alpha = R.alpha == null ? 1 : R.alpha;
    if (to - from < 0.002 || alpha <= 0.01) return;
    const n = Math.max(6, Math.round((R.seg || 120) * (to - from)));
    const X = new Float32Array(n + 1), Y = new Float32Array(n + 1);
    for (let i = 0; i <= n; i++) {
      const p = R.path(from + (to - from) * (i / n), t);
      X[i] = p.x; Y[i] = p.y;
    }
    const front = R.front, back = R.back || R.front.map((c) => c * 0.68);
    const Ax = new Float32Array(n + 1), Ay = new Float32Array(n + 1), Bx = new Float32Array(n + 1), By = new Float32Array(n + 1);
    const TX = new Float32Array(n + 1), TY = new Float32Array(n + 1);
    const cols = new Array(n + 1);
    const shine = R.shine || 26, specK = R.specK == null ? 0.85 : R.specK;
    for (let i = 0; i <= n; i++) {
      const i0 = i > 0 ? i - 1 : 0, i1 = i < n ? i + 1 : n;
      let tx = X[i1] - X[i0], ty = Y[i1] - Y[i0];
      const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      TX[i] = tx; TY[i] = ty;
      const nx = -ty, ny = tx;
      const s = from + (to - from) * (i / n);
      const th = R.twist ? R.twist(s, t) : 0;
      const c = Math.cos(th), sn = Math.sin(th);
      const hw = (typeof R.width === 'function' ? R.width(s, t) : R.width) / 2;
      const pw = (c >= 0 ? 1 : -1) * Math.max(1.2, hw * Math.abs(c));
      Ax[i] = X[i] + nx * pw; Ay[i] = Y[i] + ny * pw;
      Bx[i] = X[i] - nx * pw; By[i] = Y[i] - ny * pw;
      let Nx = -nx * sn, Ny = -ny * sn, Nz = c, base = front;
      if (Nz < 0) { Nx = -Nx; Ny = -Ny; Nz = -Nz; base = back; }
      const dif = Math.max(0, Nx * LIGHT[0] + Ny * LIGHT[1] + Nz * LIGHT[2]);
      const spec = Math.pow(Math.max(0, Nx * HALF[0] + Ny * HALF[1] + Nz * HALF[2]), shine) * specK * 255;
      const k = 0.36 + 0.78 * dif;
      cols[i] = 'rgb(' + c255(base[0] * k + spec) + ',' + c255(base[1] * k + spec) + ',' + c255(base[2] * k + spec) + ')';
    }
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 1.2;
    const notch = R.vcut && to > 0.995;
    // Opaque ribbons: each slice reaches one step into the next, which paints over it, so no
    // hairline seams appear and no extra stroke pass is needed. Fading ribbons use plain slices.
    const overlap = alpha >= 0.999;
    for (let i = 1; i <= n; i++) {
      const j = overlap && i < n ? i + 1 : i;
      ctx.beginPath();
      ctx.moveTo(Ax[i - 1], Ay[i - 1]);
      ctx.lineTo(Ax[j], Ay[j]);
      if (notch && i === n) {
        const w2 = Math.hypot(Ax[i] - Bx[i], Ay[i] - By[i]) * 0.55;
        ctx.lineTo(X[i] - TX[i] * w2, Y[i] - TY[i] * w2);
      }
      ctx.lineTo(Bx[j], By[j]);
      ctx.lineTo(Bx[i - 1], By[i - 1]);
      ctx.closePath();
      ctx.fillStyle = cols[i];
      ctx.fill();
    }
    if (R.edge !== false) {
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(Ax[0], Ay[0]); for (let i = 1; i <= n; i++) ctx.lineTo(Ax[i], Ay[i]); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(Bx[0], By[0]); for (let i = 1; i <= n; i++) ctx.lineTo(Bx[i], By[i]); ctx.stroke();
    }
    ctx.restore();
  }

  /* A bow: two loops traced as a lifted figure-eight, two notched tails, and a knot.
     Animating loops 0 -> 1 draws the loops out from the knot, which reads as tying. */
  function makeBow(o) {
    const front = rgb(o.color), back = front.map((v) => v * 0.66);
    const a = o.a, w = o.w;
    const st = { loops: 1, tails: 1, knot: 1, alpha: 1 };
    const lem = (s) => {
      const u = Math.PI / 2 + s * TAU;
      const d = 1 + Math.sin(u) * Math.sin(u);
      const x = (a * Math.cos(u)) / d;
      let y = (a * Math.sin(u) * Math.cos(u)) / d;
      y = y * 1.25 - Math.abs(x) * 0.42;
      return { x: o.x + x, y: o.y + y };
    };
    const loops = {
      seg: 240, front, back, specK: 0.95, shine: 20, path: lem,
      width: (s) => { const p = lem(s); const r = Math.hypot(p.x - o.x, p.y - o.y) / a; return w * (0.38 + 0.62 * clamp(r / 0.34)); },
      twist: (s) => { const u = Math.PI / 2 + s * TAU; return 0.7 * Math.sin(2 * u) + 0.15; },
    };
    const tail = (side) => ({
      seg: 70, front, back, specK: 0.8, vcut: true, width: w * 0.88,
      path: (s) => ({ x: o.x + side * (a * 0.04 + s * a * 0.5) + Math.sin(s * 3.2) * a * 0.04 * side, y: o.y + w * 0.12 + s * a * 0.55 }),
      twist: (s) => side * (0.2 + s * 0.85),
    });
    const tails = [tail(-1), tail(1)];
    return {
      st,
      draw(ctx, t) {
        const al = st.alpha;
        tails.forEach((r) => { r.to = st.tails; r.alpha = al; drawRibbon(ctx, r, t); });
        loops.to = st.loops; loops.alpha = al; drawRibbon(ctx, loops, t);
        if (st.knot > 0.01) {
          const kw = w * 0.86 * st.knot, kh = w * 1.02 * st.knot;
          ctx.save();
          ctx.globalAlpha = al;
          const g = ctx.createLinearGradient(o.x - kw / 2, 0, o.x + kw / 2, 0);
          const f = (k) => 'rgb(' + front.map((v) => c255(v * k)).join(',') + ')';
          g.addColorStop(0, f(0.55)); g.addColorStop(0.35, f(1.15)); g.addColorStop(0.55, f(1.0)); g.addColorStop(1, f(0.5));
          ctx.fillStyle = g;
          const x = o.x - kw / 2, y = o.y - kh / 2, r = kw * 0.32;
          ctx.beginPath();
          ctx.moveTo(x + r, y); ctx.arcTo(x + kw, y, x + kw, y + kh, r); ctx.arcTo(x + kw, y + kh, x, y + kh, r);
          ctx.arcTo(x, y + kh, x, y, r); ctx.arcTo(x, y, x + kw, y, r); ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.4; ctx.stroke();
          ctx.restore();
        }
      },
    };
  }

  /* ---------------------------------------------------------------- canvases */
  const viewport = $('#viewport');
  const stage = $('#stage');
  const cv = { bg: $('#bg'), fx: $('#fx'), wipe: $('#wipe') };
  const cx = { bg: cv.bg.getContext('2d'), fx: cv.fx.getContext('2d'), wipe: cv.wipe.getContext('2d') };
  let res = 1;
  function sizeCanvases(k) {
    const dpr = window.devicePixelRatio || 1;
    res = clamp(k * dpr, 0.5, 1.25);
    for (const key in cv) {
      cv[key].width = Math.round(W * res);
      cv[key].height = Math.round(H * res);
      cx[key].setTransform(res, 0, 0, res, 0, 0);
    }
  }

  /* --------------------------------------------------------- background scene */
  const bgShift = { y: 0 }; // pushes the two bottom ribbons off-screen, clearing the lower part of a slide
  const bgFade = { a: 1 };  // background ribbons fade away on the credits HUD
  const BG_CFG = [
    { y: 968, tilt: -0.1, a1: 46, f1: 0.75, v1: 0.32, a2: 16, f2: 2.1, v2: -0.45, ph: 0.4, w: 98, tk: 1.25, tv: 0.38, ci: 0, k: 0.78 },
    { y: 1040, tilt: 0.05, a1: 26, f1: 1.05, v1: -0.26, a2: 10, f2: 2.6, v2: 0.55, ph: 2.2, w: 62, tk: 1.7, tv: -0.5, ci: 1, k: 0.85 },
    { y: 560, tilt: -0.62, a1: 70, f1: 0.55, v1: 0.18, a2: 22, f2: 1.7, v2: -0.3, ph: 4.1, w: 96, tk: 0.9, tv: 0.22, ci: 2, k: 0.15 },
  ];
  const BG = BG_CFG.map((o, j) => ({
    seg: 200, width: o.w, front: [0, 0, 0], back: [0, 0, 0], specK: 0.55 * o.k, edge: false,
    path: (s, t) => ({
      x: -280 + s * (W + 560),
      y: (j < 2 ? bgShift.y : 0) + o.y + o.tilt * (s - 0.5) * H + o.a1 * Math.sin(TAU * o.f1 * s + o.v1 * t + o.ph) + o.a2 * Math.sin(TAU * o.f2 * s + o.v2 * t + o.ph * 1.7),
    }),
    twist: (s, t) => o.tk * TAU * s + o.tv * t + o.ph,
  }));
  // ribbon colours are toned into the deck's ground colour, and blend over when the deck changes
  function bgColorsFor(deck) {
    const g = rgb(deck.palette.ground);
    return BG_CFG.map((o) => {
      const c = rgb(deck.palette.ribbons[o.ci]);
      return { f: c.map((v, i) => g[i] * (1 - o.k) + v * o.k), b: c.map((v, i) => g[i] * (1 - o.k * 0.6) + v * o.k * 0.6) };
    });
  }
  const mixArr = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const bgMix = { t: 1 };
  let bgFrom = null, bgTo = null;
  function setBgColors(deck, animate) {
    const target = bgColorsFor(deck);
    if (!animate || !bgTo) { bgFrom = bgTo = target; bgMix.t = 1; return; }
    bgFrom = BG.map((R) => ({ f: R.front.slice(), b: R.back.slice() }));
    bgTo = target; bgMix.t = 0;
    A({ targets: bgMix, t: 1, duration: 1400, easing: 'easeInOutQuad' });
  }
  function tickBgColors() {
    if (!bgTo) return;
    BG.forEach((R, j) => { R.front = mixArr(bgFrom[j].f, bgTo[j].f, bgMix.t); R.back = mixArr(bgFrom[j].b, bgTo[j].b, bgMix.t); });
  }

  // falling marigold petals
  const PETAL = ['#f7a224', '#ffc93c', '#e8610f', '#ffb347', '#d94b2b'];
  const petals = [];
  let petalsOn = false;
  function newPetal(anywhere) {
    return {
      x: Math.random() * W, y: anywhere ? Math.random() * H : -20 - Math.random() * 120,
      vy: 45 + Math.random() * 60, sw: 18 + Math.random() * 36, ph: Math.random() * TAU,
      r: Math.random() * TAU, vr: (Math.random() - 0.5) * 2.6, sz: 7 + Math.random() * 8,
      c: PETAL[(Math.random() * PETAL.length) | 0], a: 0,
    };
  }
  for (let i = 0; i < 46; i++) petals.push(newPetal(true));
  function drawPetals(ctx, dt, t) {
    let any = false;
    for (const p of petals) {
      p.a = clamp(p.a + (petalsOn ? dt * 0.8 : -dt * 1.5));
      if (p.a <= 0 && !petalsOn) continue;
      any = true;
      p.y += p.vy * dt; p.x += Math.sin(t * 0.9 + p.ph) * p.sw * dt; p.r += p.vr * dt;
      if (p.y > H + 30) Object.assign(p, newPetal(false), { a: p.a });
      ctx.save();
      ctx.globalAlpha = p.a * 0.9;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath(); ctx.ellipse(-p.sz * 0.2, -p.sz * 0.12, p.sz * 0.45, p.sz * 0.18, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    return any;
  }

  /* ------------------------------------------------------------------ heroes
     Slide-owned canvas pieces (bows, trails, timelines). Each has a layer and a draw(). */
  const heroes = [];
  function addHero(owner, layer, draw) { const hh = { owner, layer, draw, alpha: 1 }; heroes.push(hh); return hh; }
  function ribbonHero(owner, layer, R) {
    R.front = R.front || rgb(R.color);
    if (R.alpha == null) R.alpha = 1;
    addHero(owner, layer, (ctx, t) => drawRibbon(ctx, R, t)).ref = R;
    return R;
  }
  function bowHero(owner, layer, o) {
    const b = makeBow(o);
    addHero(owner, layer, (ctx, t) => b.draw(ctx, t)).ref = b.st;
    return b;
  }
  function releaseHeroes(owner, fade) {
    const mine = heroes.filter((hh) => hh.owner === owner);
    const drop = () => mine.forEach((hh) => { const i = heroes.indexOf(hh); if (i >= 0) heroes.splice(i, 1); });
    if (!fade || !motion) { drop(); return; }
    const refs = mine.map((hh) => hh.ref).filter(Boolean);
    let done = false;
    const once = () => { if (!done) { done = true; drop(); } };
    if (refs.length) A({ targets: refs, alpha: 0, duration: 420, easing: 'easeInQuad', complete: once });
    setTimeout(once, 600); // never leave a piece behind, even if the tween is cut short
  }

  /* ------------------------------------------------------- slide transitions
     Three wide satin ribbons sweep corner to corner while the slides cross-fade beneath. */
  const WIPE = [
    { w: 150, off: -170 },
    { w: 190, off: 0 },
    { w: 120, off: 175 },
  ].map((o, j) => {
    const R = {
      seg: 170, width: o.w, front: rgb(DECKS[0].palette.wipe[j]), specK: 0.95, shine: 18, dir: 1,
      path: (s, t) => {
        const u = R.dir > 0 ? s : 1 - s;
        const x0 = -340, y0 = 1300, x1 = 2260, y1 = -220;
        const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
        const nx = -dy / L, ny = dx / L;
        const wave = 60 * Math.sin(TAU * 1.05 * u + j * 1.3 + t * 0.8);
        return { x: x0 + dx * u + nx * (o.off + wave), y: y0 + dy * u + ny * (o.off + wave) };
      },
      twist: (s, t) => 2.1 * TAU * s + t * 2 + j,
    };
    return R;
  });
  let wipeStart = -1;
  const setWipeColors = (deck) => WIPE.forEach((R, j) => { R.front = rgb(deck.palette.wipe[j]); R.back = null; });
  function drawWipe(ctx, now, t) {
    if (wipeStart < 0) return false;
    const p = (now - wipeStart) / 1250;
    if (p > 1.4) { wipeStart = -1; return false; }
    WIPE.forEach((R, j) => {
      const q = clamp((p - j * 0.09) / 0.95);
      R.from = clamp(easeIn(q) * 1.3 - 0.3);
      R.to = clamp(easeInOut(q) * 1.3);
      drawRibbon(ctx, R, t);
    });
    return true;
  }

  /* ------------------------------------------------------------ animation sequence
     With motion on, steps play on an anime.js timeline from a prepared start state.
     With motion off (or no anime.js), every element simply stays at its finished state. */
  function Seq() {
    const live = motion && !!A;
    const tl = live ? A.timeline({ easing: 'easeOutCubic', autoplay: false }) : null;
    const seen = new Map(); // target -> props whose start state is already set
    const flat = (tg) => (tg instanceof NodeList || Array.isArray(tg) ? Array.from(tg) : [tg]);
    const api = {
      tl,
      add(targets, props, offset, opts) {
        if (live) {
          flat(targets).forEach((tg) => {
            if (!seen.has(tg)) seen.set(tg, new Set());
            const done = seen.get(tg);
            const start = {};
            for (const k in props) if (Array.isArray(props[k]) && !done.has(k)) { start[k] = props[k][0]; done.add(k); }
            if (Object.keys(start).length) A.set(tg, start);
          });
          tl.add(Object.assign({ targets }, props, opts || {}), offset);
        } else {
          [].concat(targets).forEach((tg) => {
            if (tg && !tg.nodeType && !(tg instanceof NodeList)) {
              for (const k in props) tg[k] = Array.isArray(props[k]) ? props[k][1] : props[k];
            }
          });
        }
        return api;
      },
      count(el, to, offset, fmt, dur) {
        const f = fmt || inr;
        if (live) {
          const o = { v: 0 };
          el.textContent = f(0);
          tl.add({ targets: o, v: to, duration: dur || 1500, easing: 'easeOutExpo', update: () => { el.textContent = f(o.v); } }, offset);
        } else el.textContent = f(to);
        return api;
      },
      play() { if (live) tl.play(); },
    };
    return api;
  }

  function toranSVG() {
    const hooks = [];
    for (let x = 0; x <= W; x += 240) hooks.push(x);
    let out = '';
    for (let k = 0; k < hooks.length - 1; k++) {
      const x0 = hooks[k], x1 = hooks[k + 1], sag = 52;
      const mx = (x0 + x1) / 2, my = 20 + sag;
      [[-24, 16], [0, 0], [24, -16]].forEach(([dx, rot]) => {
        out += `<use href="#leaf" x="-14" y="0" width="28" height="74" transform="translate(${mx + dx} ${my - 8}) rotate(${rot})"/>`;
      });
      for (let i = 0; i <= 9; i++) {
        const u = i / 9, x = lerp(x0, x1, u), y = 20 + sag * 4 * u * (1 - u), r = i % 3 === 1 ? 19 : 17;
        out += `<use href="#${i % 2 ? 'mg-y' : 'mg-o'}" x="${(x - r).toFixed(1)}" y="${(y - r).toFixed(1)}" width="${2 * r}" height="${2 * r}"/>`;
      }

    for (let x = 0; x <= W; x += 30) out += `<use href="#${(x / 30) % 2 ? 'mg-y' : 'mg-o'}" x="${x - 16}" y="-14" width="32" height="32"/>`;

      return s + `<use href="#bell" x="${x - 14}" y="${46 + 8 * 33 - 12}" width="28" height="40"/></g>`;

  function fitText(nodes, minPx) {

  /* ------------------------------------------------------- closing credits (HUD)
     A holographic heads-up display: tick rings and arc segments turning in the plane, three rings
     spinning in 3D with perspective, a rotating point-cloud globe, a radar sweep, and text that
     decodes into place character by character. */
  const CREDITS = Object.assign({ id: 'credits', logos: [], logoHeights: { hero: 0, mini: 0, end: 0, duo: 0 } }, SHOW.credits);
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&@$';

  // Text that resolves left to right: settled letters, a few scrambling ones, then invisible ones
  // that still hold their space, so the line never shifts while it decodes.
  function decodeHTML(target, p) {
    const n = target.length, head = Math.floor(p * (n + 5));
    let html = '', run = '', kind = '';
    const flush = () => {
      if (!run) return;
      html += kind === 'done' ? esc(run) : `<span class="dec-${kind}">${esc(run)}</span>`;
      run = '';
    };
    for (let i = 0; i < n; i++) {
      const ch = target[i];
      let k, out = ch;
      if (i >= head) k = 'rest';
      else if (i < head - 5 || ch === ' ') k = 'done';
      else { k = 'live'; out = GLYPHS[(Math.random() * GLYPHS.length) | 0]; }
      if (k !== kind) { flush(); kind = k; }
      run += out;
    }
    flush();
    return html;
  }

  function hudHero(owner, X, Y) {
    const st = { boot: 1, alpha: 1 };
    const C = rgb(CREDITS.palette.accent);
    const col = (a) => `rgba(${C[0]},${C[1]},${C[2]},${a})`;
    const white = (a) => `rgba(225,250,255,${a})`;
    const N = 240, globe = [];
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963;
      globe.push([Math.cos(th) * r, y, Math.sin(th) * r]);
    }
    const gyros = [{ r: 222, ax: 1.15, ay: 0.2, sp: 0.42 }, { r: 200, ax: 0.35, ay: 1.2, sp: -0.55 }, { r: 178, ax: 1.4, ay: 0.75, sp: 0.75 }];
    const rot = (p, a, b) => {
      let [x, y, z] = p;
      let c = Math.cos(a), s2 = Math.sin(a);
      [y, z] = [y * c - z * s2, y * s2 + z * c];
      c = Math.cos(b); s2 = Math.sin(b);
      [x, z] = [x * c + z * s2, -x * s2 + z * c];
      return [x, y, z];
    };
    const proj = (p) => { const f = 950 / (950 + p[2]); return [X + p[0] * f, Y + p[1] * f, f]; };
    const glowStroke = (ctx, w, a) => {
      ctx.lineWidth = w * 3.2; ctx.strokeStyle = col(a * 0.18); ctx.stroke();
      ctx.lineWidth = w; ctx.strokeStyle = col(a); ctx.stroke();
    };
    addHero(owner, 'bg', (ctx, t) => {
      const b = st.boot;
      if (b <= 0.001 || st.alpha <= 0.01) return;
      ctx.save();
      ctx.globalAlpha = st.alpha;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      // radar sweep
      if (ctx.createConicGradient) {
        const g = ctx.createConicGradient(t * 1.1, X, Y);
        g.addColorStop(0, col(0.22 * b)); g.addColorStop(0.07, col(0.05 * b)); g.addColorStop(0.12, col(0)); g.addColorStop(1, col(0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(X, Y, 300 * b, 0, TAU); ctx.fill();
      }
      // outer tick ring
      const R1 = 300 * (0.55 + 0.45 * b);
      ctx.beginPath();
      for (let i = 0; i < 90; i++) {
        if (i / 90 > b) break;
        const a = (i / 90) * TAU + t * 0.12, long = i % 5 === 0, r2 = R1 + (long ? 24 : 11);
        ctx.moveTo(X + Math.cos(a) * R1, Y + Math.sin(a) * R1);
        ctx.lineTo(X + Math.cos(a) * r2, Y + Math.sin(a) * r2);
      }
      glowStroke(ctx, 2, 0.75);
      // arc segments
      [[0, 0.2], [0.27, 0.43], [0.52, 0.79], [0.85, 0.95]].forEach(([s0, s1], k) => {
        const a0 = TAU * s0 - t * 0.38, a1 = TAU * (s0 + (s1 - s0) * b) - t * 0.38;
        ctx.beginPath(); ctx.arc(X, Y, 272 * (0.6 + 0.4 * b), a0, a1);
        glowStroke(ctx, k % 2 ? 4 : 8, 0.6);
      });
      // dashed counter-rotating ring
      ctx.save();
      ctx.setLineDash([3, 12]);
      ctx.beginPath(); ctx.arc(X, Y, 248 * b, t * 0.7, t * 0.7 + TAU);
      glowStroke(ctx, 2, 0.6);
      ctx.restore();
      // 3D gyroscope rings, brighter on the near side
      gyros.forEach((g) => {
        const n = 128;
        let prev = null;
        for (let j = 0; j <= n; j++) {
          const a = (j / n) * TAU;
          const p = rot([Math.cos(a) * g.r * b, Math.sin(a) * g.r * b, 0], g.ax + t * g.sp * 0.55, g.ay + t * g.sp);
          const q = proj(p);
          if (prev) {
            const near = clamp((1.12 - q[2]) * -4 + 0.5, 0, 1); // f > 1 is nearer
            const a2 = 0.25 + 0.65 * clamp((q[2] - 0.82) / 0.36);
            ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]);
            ctx.lineWidth = 1.2 + 2.2 * a2; ctx.strokeStyle = col(a2 * 0.9 + near * 0);
            ctx.stroke();
          }
          prev = q;
        }
      });
      // point-cloud globe
      for (const p0 of globe) {
        const p = rot([p0[0] * 128 * b, p0[1] * 128 * b, p0[2] * 128 * b], 0.38, t * 0.5);
        const q = proj(p);
        const near = clamp((q[2] - 0.88) / 0.25);
        const sz = 1 + 2.4 * near;
        ctx.fillStyle = near > 0.55 ? white(0.35 + 0.55 * near) : col(0.18 + 0.6 * near);
        ctx.fillRect(q[0] - sz / 2, q[1] - sz / 2, sz, sz);
      }
      // core
      const pulse = 0.75 + 0.25 * Math.sin(t * 3.1);
      const cg = ctx.createRadialGradient(X, Y, 0, X, Y, 78 * b);
      cg.addColorStop(0, white(0.55 * pulse)); cg.addColorStop(0.35, col(0.32 * pulse)); cg.addColorStop(1, col(0));
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(X, Y, 78 * b, 0, TAU); ctx.fill();
      ctx.beginPath();
      for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU - t * 0.9; ctx[k ? 'lineTo' : 'moveTo'](X + Math.cos(a) * 34 * b, Y + Math.sin(a) * 34 * b); }
      ctx.closePath();
      glowStroke(ctx, 2, 0.85);
      // a faint scan line travelling down the whole screen
      const sy = ((t * 0.18) % 1.2) * H - 60;
      const sg = ctx.createLinearGradient(0, sy - 50, 0, sy + 50);
      sg.addColorStop(0, col(0)); sg.addColorStop(0.5, col(0.07)); sg.addColorStop(1, col(0));
      ctx.fillStyle = sg; ctx.fillRect(0, sy - 50, W, 100);
      ctx.restore();
    }).ref = st;
    return st;
  }

  function sCredits(C) {
    const el = section('s-credits', 'Credits');
    const [r1, r2, r3, r4] = C.readouts.map(esc);
    el.innerHTML = `

      <p class="cr-label" data-a="l"><span data-dec="${esc(C.label)}">${esc(C.label)}</span></p>

      <h2 class="cr-name" data-a="n"><span data-dec="${esc(C.name)}">${esc(C.name)}</span></h2>
      <div class="cr-rule" data-a="u"></div>`;
    return {
      el, duration: C.duration, hidePlaque: true, petals: false, clearCorner: true, tech: true,
      enter(S) {
        const hud = hudHero(this, 960, 392);
        const decode = (span, offset, dur) => {
          const target = span.dataset.dec, o = { p: 0 };
          if (motion) span.innerHTML = decodeHTML(target, 0);
          S.add(o, { p: [0, 1] }, offset, { duration: dur, easing: 'linear', update: () => { span.innerHTML = decodeHTML(target, o.p); },
            complete: () => { span.textContent = target; } });
        };
        S.add($$('[data-a=c]', el), { opacity: [0, 1], scale: [1.4, 1] }, 0, { duration: 700, delay: stagger(90) })
          .add(hud, { boot: [0, 1] }, 150, { duration: 2400, easing: 'easeOutCubic' })
          .add($$('[data-a=r]', el), { opacity: [0, 1] }, 500, { duration: 600, delay: stagger(160) })
          .add($$('[data-a=l]', el), { opacity: [0, 1] }, 1500, { duration: 400 });
        decode($('[data-a=l] span', el), 1500, 900);
        S.add($$('[data-a=b]', el), { opacity: [0, 1], translateY: [14, 0] }, 2300, { duration: 700 })
          .add($$('[data-a=n]', el), { opacity: [0, 1] }, 2700, { duration: 300 });
        decode($('[data-a=n] span', el), 2700, 1700);
        S.add($$('[data-a=u]', el), { opacity: [0, 1], scaleX: [0, 1] }, 3900, { duration: 900, easing: 'easeOutExpo' });
      },
    };
  }

  const slides = DECKS.flatMap(buildDeck);
  {
    const cs = sCredits(CREDITS);
    cs.deck = CREDITS;
    slides.push(cs);
  }
  const slidesEl = $('#slides');
  slides.forEach((s, i) => { s.el.hidden = i !== 0; slidesEl.appendChild(s.el); });

  /* ---------------------------------------------------------------- chrome */
  const chrome = $('#chrome');
  chrome.insertAdjacentHTML('afterbegin', DEFS + toranSVG() +
    `<div class="plaque plaque-mini" id="mini">${logosHTML(DECKS[0].logos)}</div>` +
    `<div class="progress" id="progress">${slides.map((s, i) => `<div class="pseg${i && s.deck !== slides[i - 1].deck ? ' split' : ''}"><div class="pfill"></div></div>`).join('')}</div>`);
  const mini = $('#mini');

  // one ground colour layer per deck; the incoming deck's layer fades in on top
  const groundsEl = document.createElement('div');
  groundsEl.className = 'grounds';
  stage.insertBefore(groundsEl, stage.firstChild);
  const grounds = new Map();
  DECKS.concat([CREDITS]).forEach((d) => {
    const g = document.createElement('div');
    g.className = 'ground' + (d === CREDITS ? ' ground-tech' : '');
    g.style.cssText = `--gg:${d.palette.groundGlow};--g:${d.palette.ground};--ge:${d.palette.groundEdge}`;
    groundsEl.appendChild(g);
    grounds.set(d, g);
  });
  let themeDeck = null, zTop = 1;
  function applyTheme(deck) {
    if (deck === themeDeck) return;
    const first = !themeDeck;
    themeDeck = deck;
    const g = grounds.get(deck);
    g.style.zIndex = String(++zTop);
    g.classList.add('on');
    const others = Array.from(grounds.values()).filter((x) => x !== g);
    if (first || !motion) others.forEach((x) => x.classList.remove('on'));
    else setTimeout(() => { if (themeDeck === deck) others.forEach((x) => x.classList.remove('on')); }, 1500);
    setBgColors(deck, !first && motion);
    setWipeColors(deck);
    mini.innerHTML = logosHTML(deck.logos);
    mini.style.setProperty('--logo-mini', deck.logoHeights.mini + 'px');
    stage.style.setProperty('--accent', deck.palette.accent);
  }
  const fills = $$('.pfill');
  const progress = $('#progress');

  /* ------------------------------------------------------------ controller */
  let idx = -1, playing = true, elapsed = 0, holdUntil = 0, pending = null, current = null;
  const counter = $('#count');
  const pill = $('#pill');

  function setChrome(s, i) {
    applyTheme(s.deck);
    stage.classList.toggle('tech', !!s.tech);
    if (motion) A({ targets: bgFade, a: s.tech ? 0 : 1, duration: 900, easing: 'easeInOutQuad' });
    else bgFade.a = s.tech ? 0 : 1;
    const showMini = !s.hidePlaque;
    if (motion) A({ targets: mini, opacity: showMini ? 1 : 0, duration: 500, easing: 'easeOutQuad' });
    else mini.style.opacity = showMini ? 1 : 0;
    petalsOn = !!s.petals && motion;
    progress.classList.toggle('off', !!s.clearCorner);
    const drop = s.clearCorner || s.clearBottom ? 320 : 0;
    if (motion) A({ targets: bgShift, y: drop, duration: 1600, easing: 'easeInOutCubic' });
    else bgShift.y = drop;
    fills.forEach((f, j) => { f.style.transform = `scaleX(${j < i ? 1 : 0})`; });
    counter.textContent = `${i + 1} / ${slides.length}`;
  }

  function enter(s) {
    s.el.hidden = false;
    s.el.style.opacity = '';
    s.el.style.transform = '';
    const S = Seq();
    s.seq = S;
    s.enter(S);
    S.play();
  }

  function go(i, dir) {
    if (i < 0 || i >= slides.length || i === idx) return;
    const prev = current;
    const next = slides[i];
    dir = dir || (i > idx ? 1 : -1);
    if (pending) { clearTimeout(pending); pending = null; }
    slides.forEach((s) => { if (s !== prev && s !== next) { if (A) A.remove(s.el); s.el.hidden = true; releaseHeroes(s, false); } });
    idx = i; current = next; elapsed = 0;
    if (A) A.remove(next.el);
    setChrome(next, i);
    if (!prev) { enter(next); holdUntil = performance.now() + 300; return; }
    if (prev.seq && prev.seq.tl) prev.seq.tl.pause();
    releaseHeroes(prev, true);
    if (motion) {
      wipeStart = performance.now();
      WIPE.forEach((R) => { R.dir = dir; });
      A.remove(prev.el);
      A({
        targets: prev.el, opacity: [1, 0], translateX: [0, -50 * dir], duration: 520, easing: 'easeInQuad',
        complete: () => { if (prev !== current) { prev.el.hidden = true; prev.el.style.opacity = ''; prev.el.style.transform = ''; } },
      });
      pending = setTimeout(() => { pending = null; enter(next); }, 430);
      holdUntil = performance.now() + 1300;
    } else {
      prev.el.hidden = true;
      enter(next);
      holdUntil = performance.now() + 200;
    }
  }

  const next = () => go(idx + 1, 1);
  const prev = () => go(idx - 1, -1);
  function restart() { go(0, -1); setPlaying(true); }

  const playBtn = $('#btn-play');
  const ICONS = {
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg>',
  };
  function setPlaying(v) {
    playing = v;
    playBtn.innerHTML = v ? ICONS.pause : ICONS.play;
    playBtn.setAttribute('aria-label', v ? 'Pause slideshow' : 'Play slideshow');
    playBtn.title = v ? 'Pause (Space)' : 'Play (Space)';
    pill.hidden = v;
  }
  const togglePlay = () => setPlaying(!playing);

  function setMotion(v) {
    motion = v && !!A;
    viewport.classList.toggle('no-motion', !motion);
    const b = $('#btn-motion');
    b.setAttribute('aria-pressed', String(motion));
    b.title = motion ? 'Animations on (M)' : 'Animations off (M)';
    if (current) petalsOn = !!current.petals && motion;
  }

  /* ------------------------------------------------------------ fullscreen, wake */
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) await viewport.requestFullscreen({ navigationUI: 'hide' });
      else await document.exitFullscreen();
    } catch (e) { flash('Fullscreen is not available here. Press F11 in the browser instead.'); }
  }
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { /* not granted: the slideshow still runs */ }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  let flashT = null;
  function flash(msg) {
    pill.textContent = msg; pill.hidden = false;
    clearTimeout(flashT);
    flashT = setTimeout(() => { pill.textContent = 'Paused · press Space to resume'; pill.hidden = playing; }, 2600);
  }

  /* ---------------------------------------------------------------- input */
  let idleT = null;
  function poke() {
    viewport.classList.remove('idle');
    clearTimeout(idleT);
    idleT = setTimeout(() => viewport.classList.add('idle'), 2800);
  }
  viewport.addEventListener('pointermove', poke);
  viewport.addEventListener('pointerdown', () => { poke(); keepAwake(); });

  const bind = (id, fn) => $(id).addEventListener('click', (e) => { fn(); if (e.detail > 0) e.currentTarget.blur(); poke(); keepAwake(); });
  bind('#btn-prev', prev);
  bind('#btn-next', next);
  bind('#btn-play', togglePlay);
  bind('#btn-restart', restart);
  bind('#btn-full', toggleFullscreen);
  bind('#btn-motion', () => setMotion(!motion));

  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    let handled = true;
    switch (e.key) {
      case ' ': case 'k': case 'K':
        if (onButton && e.key === ' ') { handled = false; break; }
        togglePlay(); break;
      case 'ArrowRight': case 'PageDown': next(); break;
      case 'ArrowLeft': case 'PageUp': prev(); break;
      case 'Home': restart(); break;
      case 'End': go(slides.length - 1, 1); break;
      case 'f': case 'F': toggleFullscreen(); break;
      case 'm': case 'M': setMotion(!motion); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
    poke(); keepAwake();
  });

  /* ---------------------------------------------------------------- fit */
  let scaleK = 1;
  function fit() {
    const r = viewport.getBoundingClientRect();
    scaleK = Math.min(r.width / W, r.height / H) || 1;
    stage.style.transform = `translate(-50%, -50%) scale(${scaleK})`;
    sizeCanvases(scaleK);
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(viewport);
  window.addEventListener('resize', fit);
  document.addEventListener('fullscreenchange', fit);

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  let tAmb = 0;
  let fxDirty = true, wipeDirty = true;
  function frame(now) {
    const raw = Math.max(0, now - last);
    const dt = Math.min(0.1, raw / 1000); // animation step, capped so a stall never jumps the scene
    last = now;
    if (motion) tAmb += dt;
    const t = tAmb;

    // auto-advance
    if (current && now > holdUntil && playing) {
      elapsed += Math.min(raw, 1000); // slide timer follows the wall clock, even if frames are slow
      if (elapsed >= current.duration) {
        elapsed = current.duration;
        if (idx < slides.length - 1) next();
      }
    }
    if (current) fills[idx].style.transform = `scaleX(${clamp(elapsed / current.duration).toFixed(4)})`;

    // background
    const bg = cx.bg;
    tickBgColors();
    bg.clearRect(0, 0, W, H);
    BG.forEach((R) => { R.alpha = bgFade.a; drawRibbon(bg, R, t); });
    for (const hh of heroes) if (hh.layer === 'bg') hh.draw(bg, t);
    drawPetals(bg, motion ? dt : 0, t);

    // foreground pieces
    const fx = cx.fx;
    const fxHeroes = heroes.filter((hh) => hh.layer === 'fx');
    if (fxHeroes.length || fxDirty) {
      fx.clearRect(0, 0, W, H);
      for (const hh of fxHeroes) hh.draw(fx, t);
      fxDirty = fxHeroes.length > 0;
    }
    const wp = cx.wipe;
    if (wipeStart >= 0 || wipeDirty) {
      wp.clearRect(0, 0, W, H);
      wipeDirty = drawWipe(wp, now, t);
    }
    requestAnimationFrame(frame);
  }

  /* ---------------------------------------------------------------- start */
  setMotion(motion);
  setPlaying(true);
  fit();
  poke();
  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([ready, new Promise((r) => setTimeout(r, 2500))]).then(() => {
    go(0, 1);
    requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
    keepAwake();
  });

  // small hook for rehearsals and automated checks
  let frames = 0;
  (function countFrames() { frames++; requestAnimationFrame(countFrames); })();
  window.slideshow = { fps: () => { const f0 = frames; return new Promise((r) => setTimeout(() => r((frames - f0) / 2), 2000)); }, go: (i) => go(i), next, prev, pause: () => setPlaying(false), play: () => setPlaying(true), count: slides.length, setMotion, index: () => idx, _heroes: () => heroes.map((hh) => slides.indexOf(hh.owner) + ':' + hh.layer + ':' + (hh.ref ? hh.ref.alpha : '-')) };
})();
